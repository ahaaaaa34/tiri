<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>指数・対数フィード</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="指数・対数の問題を、縦にスクロールしながら1問ずつ解いていくアプリ。">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="指数対数フィード">
<link rel="apple-touch-icon" href="./icon-apple.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --bg:#000;
  --t1:#fff;
  --t2:rgba(255,255,255,.72);
  --t3:rgba(255,255,255,.45);
  --line:rgba(255,255,255,.14);
  --sheet:#1b1b1d;
  --sheet2:#242427;
  --ok:#25F4EE;          /* 正解＝シアン */
  --ng:#FE2C55;          /* 不正解＝レッド */
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --navH:50px;
  --topH:44px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden; background:var(--bg)}
body{
  color:var(--t1);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,system-ui,-apple-system,sans-serif;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
  line-height:1.55; font-size:15px;
  overscroll-behavior:none;
}
button{font-family:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation}
.hide{display:none !important}

/* ---------- 数式表示（本編アプリと同じ組み方） ---------- */
.mq{font-family:"Times New Roman",'Hiragino Mincho ProN',serif; letter-spacing:.01em}
sup,sub{font-size:.68em; line-height:0}
sup{vertical-align:.5em} sub{vertical-align:-.28em}
.rt{white-space:nowrap}
.rt .ri{font-size:.6em; vertical-align:.62em; margin-right:-.28em}
.rt .rb{border-top:1px solid currentColor; padding:0 .14em 0 .06em; margin-left:.02em}
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
    margin:0 .14em; line-height:1.12; position:relative; top:-.08em}
.fr .fn{font-size:.82em; padding:0 .2em}
.fr .fd{font-size:.82em; padding:0 .2em; border-top:1px solid currentColor; margin-top:.08em}
.bx{display:inline-block; min-width:.72em; padding:0 .06em; border:1px dashed var(--ng);
    border-radius:3px; color:var(--ng); line-height:1.15; text-align:center}

/* =======================================================================
   フィード本体
   ======================================================================= */
#feed{
  position:fixed; inset:0;
  overflow-y:scroll; overflow-x:hidden;
  scroll-snap-type:y mandatory;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}
#feed::-webkit-scrollbar{display:none}
.card{
  position:relative;
  height:100vh; height:100dvh;
  scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 0 calc(var(--navH) + var(--safeB) + 14px);
  overflow:hidden;
}
/* 画面の上と下は、文字が読めるように少しだけ暗く落とす */
.card::before{
  content:''; position:absolute; left:0; right:0; top:0; height:190px; pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));
}
.card::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:60%; pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.72) 12%,rgba(0,0,0,0));
}

/* ---------- 左下（TikTok の アカウント名＋動画タイトル の場所） ---------- */
.meta{position:relative; z-index:2; padding:0 78px 0 14px; max-width:100%}
/* 何問目か */
.who{font-size:17px; font-weight:700; letter-spacing:.02em; display:flex; align-items:baseline; gap:8px}
.who .sub{font-size:12px; font-weight:400; color:var(--t3)}
/* 問題文 */
.cap{
  margin-top:9px; font-size:19px; line-height:1.85; color:var(--t1);
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.cap.open{display:block; -webkit-line-clamp:none; max-height:52vh; overflow-y:auto}
.given{margin-top:7px; font-size:12.5px; color:var(--t2); line-height:1.8}
.given b{font-weight:400; font-family:"Times New Roman",serif; font-size:14px}
.tags{margin-top:7px; font-size:12.5px; color:var(--t2)}
.lnks{margin-top:8px; display:flex; gap:16px; align-items:center}
.lnk{font-size:12.5px; color:var(--t3); letter-spacing:.02em}
.lnk:active{color:var(--t1)}
.hintbox{margin-top:8px; font-size:13px; color:var(--t2); line-height:1.8;
         border-left:2px solid var(--line); padding-left:10px}
/* いちばん下の「♫ …」の行 */
.music{margin-top:12px; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--t2); overflow:hidden}
.music svg{width:14px; height:14px; flex:none; fill:currentColor}
.music span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* 動画が映っている場所。ここをタップすると計算スペースが開く。 */
.void{
  position:absolute; inset:0; z-index:1; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  color:rgba(255,255,255,.15); font-size:12.5px; letter-spacing:.08em;
}
.void svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.5;
          stroke-linecap:round; stroke-linejoin:round}
.void:active{color:rgba(255,255,255,.35)}

/* 答えたあとに出る印 */
.stamp{
  position:absolute; left:14px; top:calc(var(--safeT) + var(--topH) + 12px); z-index:3;
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.08em;
  padding:5px 12px 5px 9px; border-radius:999px;
}
.stamp svg{width:14px; height:14px; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
.stamp.ok{background:var(--ok); color:#000} .stamp.ok svg{stroke:#000}
.stamp.ng{background:var(--ng); color:#fff} .stamp.ng svg{stroke:#fff}
.stamp.sk{background:rgba(255,255,255,.16); color:var(--t1)} .stamp.sk svg{stroke:var(--t1)}

/* ---------- 右のアイコン列 ---------- */
.rail{
  position:absolute; right:6px; z-index:2;
  bottom:calc(var(--navH) + var(--safeB) + 18px);
  display:flex; flex-direction:column; align-items:center; gap:17px;
}
.rail .ri{display:flex; flex-direction:column; align-items:center; gap:4px}
.rail .ri svg{width:31px; height:31px; fill:#fff; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.rail .ri .n{font-size:11.5px; font-weight:600; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rail .ri.on svg{fill:var(--ng)}
.rail .ri.on.cy svg{fill:var(--ok)}
.rail .ri:active{transform:scale(.9)}
/* 範囲バッジ（TikTok のアイコン写真の場所） */
.ava{position:relative; width:44px; height:44px; margin-bottom:2px}
.ava .ph{
  position:absolute; inset:0; border-radius:50%; border:1.5px solid #fff; background:#111;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; line-height:1.15;
  text-align:center; padding:2px; overflow:hidden;
}
.ava .ring{position:absolute; inset:-3px; border-radius:50%}
.ava .pl{
  position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
  width:20px; height:20px; border-radius:50%; background:var(--ng); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1; font-weight:400;
}
/* 回るレコード（TikTok の楽曲ディスクの場所）＝ 出題順の切り替え */
.disc{
  width:42px; height:42px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #4a4a4f 0 26%, #1c1c1f 27% 100%);
  border:1px solid rgba(255,255,255,.22);
  display:flex; align-items:center; justify-content:center;
  animation:spin 6s linear infinite;
}
.disc svg{width:17px; height:17px; fill:#fff}
.ri.ord.stop .disc{animation-play-state:paused}
.ri.ord .n{font-size:9.5px; color:var(--t2); max-width:60px; text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* =======================================================================
   上のタブ（範囲えらび）
   ======================================================================= */
#top{
  position:fixed; left:0; right:0; top:0; z-index:6;
  padding-top:var(--safeT);
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));
}
#tabs{
  height:var(--topH); display:flex; align-items:center; gap:18px;
  padding:0 16px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; font-size:15px; color:rgba(255,255,255,.62); letter-spacing:.02em;
  padding:6px 0 5px; position:relative; white-space:nowrap;
}
.tab.on{color:#fff; font-weight:700}
.tab.on::after{
  content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:0;
  width:22px; height:2.5px; border-radius:2px; background:#fff;
}
.tab .dot{
  display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ng);
  vertical-align:super; margin-left:3px;
}

/* =======================================================================
   下のバー
   ======================================================================= */
#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:6;
  height:calc(var(--navH) + var(--safeB)); padding-bottom:var(--safeB);
  background:#000; border-top:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center;
}
.nb{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:100%}
.nb span{font-size:10px; color:var(--t3); letter-spacing:.02em}
.nb svg{width:22px; height:22px; fill:none; stroke:var(--t3); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.nb.on span{color:#fff}
.nb.on svg{stroke:#fff}
.nb:active{opacity:.6}
/* まん中の「書く」ボタン */
.nb.pen{flex:1.25}
.penbtn{
  position:relative; width:46px; height:30px;
  display:flex; align-items:center; justify-content:center;
}
.penbtn::before,.penbtn::after{content:''; position:absolute; top:0; width:46px; height:30px; border-radius:9px}
.penbtn::before{left:-4px; background:var(--ok)}
.penbtn::after{left:4px; background:var(--ng)}
.penbtn i{
  position:absolute; inset:0; z-index:2; background:#fff; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
}
.penbtn svg{width:20px; height:20px; stroke:#000; stroke-width:2; fill:none}
.nb.pen span{color:var(--t3)}

/* =======================================================================
   シート（解答・範囲・記録）
   ======================================================================= */
#back{position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; z-index:8}
#back.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:9;
  background:var(--sheet); border-radius:14px 14px 0 0;
  transform:translateY(101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
  display:flex; flex-direction:column; max-height:88dvh;
  padding-bottom:var(--safeB);
}
.sheet.on{transform:translateY(0)}
.grip{padding:7px 0 3px; display:flex; justify-content:center; flex:none}
.grip i{width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.28)}
.sh{
  flex:none; text-align:center; font-size:13.5px; font-weight:600; color:var(--t1);
  padding:6px 44px 10px; position:relative; border-bottom:1px solid var(--line);
}
.sh .x{position:absolute; right:12px; top:2px; font-size:21px; line-height:1; color:var(--t2); padding:5px 8px}
.sbody{flex:1 1 auto; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch}

/* ---------- 解答・解説 ---------- */

.ansq{padding:12px 16px 10px; font-size:14px; color:var(--t2); line-height:2; flex:none;
      border-bottom:1px solid var(--line)}
.ansq .g{display:block; margin-top:4px; font-size:12px; color:var(--t3)}
#ansInput{display:flex; flex-direction:column; min-height:0; flex:1}
.field{
  margin:12px 12px 4px; background:var(--sheet2); border:1px solid transparent; border-radius:11px;
  min-height:54px; padding:14px; font-size:20px; line-height:1.4; word-break:break-all; flex:none;
  font-family:"Times New Roman",serif;
}
.field.err{border-color:var(--ng)}
.field.jp{font-family:inherit; font-size:16px}
.field .ph{color:var(--t3); font-size:14px; font-family:inherit}
.field .fr{margin:0 .18em}
.caret{display:inline-block; width:1.5px; height:1.05em; background:#fff; vertical-align:-.18em; margin:0 .5px;
       animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hintline{font-size:11px; color:var(--t3); padding:2px 16px 8px; flex:none; letter-spacing:.02em;
          display:flex; align-items:baseline; gap:10px}
.hintline #hintLine{flex:1; min-width:0}
.hintline .lnk{flex:none; font-size:11px; padding:2px 0}
.hintline #hintLine.warn,.hintline #hintLine.todo{color:var(--ng); font-weight:600}
.kb{padding:2px 6px 8px; flex:none; display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
.k{
  height:44px; border:1px solid rgba(255,255,255,.13); background:var(--sheet2); border-radius:9px;
  font-size:17px; display:flex; align-items:center; justify-content:center; color:#fff;
  font-family:"Times New Roman",serif; transition:background .08s, transform .05s; user-select:none;
}
.k:active{background:#3a3a3e; transform:scale(.95)}
.k.fn{background:#141416; font-size:14px; font-family:inherit; color:var(--t2)}
.k.fn svg{width:17px; height:17px; stroke:var(--t2); stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round}
.k.go{grid-column:span 2; background:var(--ng); border-color:var(--ng); color:#fff; font-size:14.5px;
      font-weight:600; font-family:inherit; letter-spacing:.08em}
.k .sm{font-size:12px}
.k.sm{font-size:12px}
.how{margin:2px 12px 10px; padding:12px 14px; background:#141416; border-radius:12px;
     flex:none; text-align:left; display:grid; grid-template-columns:repeat(2,1fr); gap:9px 14px;
     overflow-y:auto; min-height:0}
.how > span{display:flex; align-items:baseline; gap:9px; font-size:12px; min-width:0}
.how b{font-family:"Times New Roman",serif; font-size:15px; font-weight:400; flex:none; min-width:48px}
.how > span > span{color:var(--t3); font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          overflow:hidden; text-overflow:ellipsis}
.how .hb{grid-column:1/-1; justify-content:center; color:var(--t3); font-size:10.5px;
         letter-spacing:.08em; padding-top:3px; border-top:1px solid var(--line); margin-top:1px}
.chbox{padding:8px 12px 12px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; min-height:0}
.ch{
  min-height:50px; padding:12px 16px; text-align:left; border:1px solid rgba(255,255,255,.13);
  background:var(--sheet2); border-radius:11px; font-size:15px; color:#fff;
  display:flex; align-items:center; gap:11px;
}
.ch::before{content:''; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--t3); flex:none}
.ch.on{border-color:#fff}
.ch.on::before{border-color:#fff; border-width:5px}

/* 判定 */
.res{flex:1 1 auto; min-height:0; padding:14px 16px 20px; overflow-y:auto}
.rq{font-size:14px; color:var(--t2); line-height:2; padding-bottom:11px; margin-bottom:12px; border-bottom:1px solid var(--line)}
.rq .rg{font-size:11.5px; color:var(--t3); margin-left:4px}
.rmark{display:inline-flex; align-items:center; gap:8px; font-size:17px; font-weight:600; letter-spacing:.1em;
       padding:8px 17px 8px 13px; border-radius:999px}
.rmark svg{width:21px; height:21px; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}
.rmark.ok{background:var(--ok); color:#000} .rmark.ok svg{stroke:#000}
.rmark.ng{background:var(--ng); color:#fff} .rmark.ng svg{stroke:#fff}
.rmark.sk{background:rgba(255,255,255,.14); color:#fff} .rmark.sk svg{stroke:#fff; fill:#fff}
.ryour{font-size:12px; color:var(--t3); margin-top:9px}
.ryour b{color:var(--ng); font-weight:400; font-family:"Times New Roman",serif; font-size:14px}
.rans{margin-top:12px; background:var(--sheet2); border:1px solid transparent; border-radius:11px; padding:12px 14px}
.rans.ngb{border-color:var(--ng)}
.rans .lb{font-size:10px; color:var(--t3); letter-spacing:.16em; margin-bottom:4px}
.rans .va{font-size:20px; font-family:"Times New Roman",serif}
.rsub{font-size:11.5px; color:var(--t3); margin-top:5px}
.rexp{margin-top:11px; font-size:13px; color:var(--t2); line-height:1.95; padding:0 2px}
.proof{font-size:14px; line-height:1.95; color:var(--t1); white-space:pre-line}
.selfask{font-size:11.5px; color:var(--t3); margin-top:12px; text-align:center; letter-spacing:.04em}
.rbtns{display:flex; gap:8px; margin-top:16px}
.pbtn{
  flex:1; min-height:46px; border-radius:11px; background:var(--ng); color:#fff;
  font-size:14.5px; font-weight:600; letter-spacing:.04em;
  display:flex; align-items:center; justify-content:center;
}
.pbtn.ghost{background:var(--sheet2); color:#fff}
.pbtn:active{opacity:.8}

/* ---------- 範囲シート ---------- */
.gname{font-size:10.5px; color:var(--t3); letter-spacing:.14em; padding:16px 16px 6px}
.sitem{
  width:100%; text-align:left; padding:13px 16px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid rgba(255,255,255,.07); font-size:14.5px;
}
.sitem:active{background:rgba(255,255,255,.06)}
.sitem .nm{flex:1; min-width:0}
.sitem .nm i{display:block; font-style:normal; font-size:11px; color:var(--t3); margin-top:2px}
.sitem .num{font-size:11.5px; color:var(--t3); flex:none}
.sitem.on .nm{font-weight:700}
.sitem.on::after{content:'●'; font-size:9px; color:var(--ng)}
.bar{height:3px; border-radius:2px; background:rgba(255,255,255,.14); margin-top:6px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok); border-radius:2px}

/* ---------- 記録シート ---------- */
.stwrap{padding:14px 16px 22px}
.hero{display:flex; gap:10px; margin-bottom:16px}
.hcard{flex:1; background:var(--sheet2); border-radius:12px; padding:12px 12px 11px}
.hcard b{display:block; font-size:23px; font-weight:700; line-height:1.2}
.hcard i{display:block; font-style:normal; font-size:10.5px; color:var(--t3); margin-top:3px; letter-spacing:.06em}
.stsec{font-size:10.5px; color:var(--t3); letter-spacing:.14em; margin:18px 0 8px}
.strow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); font-size:13.5px}
.strow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.strow .v{font-size:11.5px; color:var(--t3); flex:none}
.danger{margin-top:22px; width:100%; min-height:44px; border-radius:11px; border:1px solid var(--ng);
        color:var(--ng); font-size:13px; display:flex; align-items:center; justify-content:center}
.note{font-size:11px; color:var(--t3); line-height:1.8; margin-top:10px}

/* =======================================================================
   書くモード
   ======================================================================= */
#write{position:fixed; inset:0; z-index:7; background:#0e0e10; display:flex; flex-direction:column}
#wq{
  flex:none; padding:calc(var(--safeT) + 10px) 14px 10px; font-size:14.5px; line-height:1.9; color:var(--t1);
  border-bottom:1px solid var(--line); max-height:34dvh; overflow-y:auto;
}
#wq .g{display:block; margin-top:4px; font-size:12px; color:var(--t3)}
.padwrap{flex:1; position:relative; min-height:0; background:#17171a}
#pad{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block}
#padHint{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,.22); font-size:13px; pointer-events:none; transition:opacity .2s; letter-spacing:.06em;
}
#tools{
  flex:none; display:flex; align-items:center; gap:4px; padding:8px 8px calc(8px + var(--safeB));
  background:#000; border-top:1px solid rgba(255,255,255,.08);
}
.tb{
  height:38px; min-width:36px; padding:0 7px; border-radius:9px; background:#1e1e21; color:var(--t2);
  display:flex; align-items:center; justify-content:center; font-size:12px; gap:5px;
  flex:none; white-space:nowrap;
}

<script src="./data.js"></script>
<script>
"use strict";

/* =======================================================================
   問題の下ごしらえ
   ======================================================================= */
function qhash(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const ALL = [];
TOPICS.forEach(t=>{
  t.qs.forEach(q=>{
    q.id = t.id+'-'+qhash(q.q);
    q.topic = t.id;
    q.tname = t.name;
    ALL.push(q);
  });
});
const BYID = {}; ALL.forEach(q=>BYID[q.id]=q);
const BYTOPIC = {}; TOPICS.forEach(t=>BYTOPIC[t.id]=t);
/* タブに出す短い名前（「教科書｜累乗根」→「累乗根」） */
function shortName(t){ return t.name.replace(/^教科書｜/,''); }

/* =======================================================================
   数式マークアップ → HTML
   ======================================================================= */
const FR_RT  = '<span class="rt">(?:<span class="ri">[^<]*<\\/span>)?&radic;<span class="rb">[^<]*<\\/span><\\/span>';
const FR_TOK = '(?:\\([^()]*\\)|' + FR_RT + '|[0-9a-z.□\\u0001]+)'
             + '(?:<sup>[^<]*<\\/sup>|<sub>[^<]*<\\/sub>)?';
const FR_RE  = new RegExp('('+FR_TOK+')\\/('+FR_TOK+')', 'g');
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(s){
  return esc(String(s))
    .replace(/\^\(([^()]*)\)/g,'^{$1}')
    .replace(/√\[(.+?)\]\{(.+?)\}/g,'<span class="rt"><span class="ri">$1</span>&radic;<span class="rb">$2</span></span>')
    .replace(/√\{(.+?)\}/g,'<span class="rt">&radic;<span class="rb">$1</span></span>')
    .replace(/\^\{(.+?)\}/g,'<sup>$1</sup>')
    .replace(/_\{(.+?)\}/g,'<sub>$1</sub>')
    .replace(/\^(-?[0-9a-zA-Z])/g,'<sup>$1</sup>')
    .replace(/_(-?[0-9a-zA-Z])/g,'<sub>$1</sub>')
    .replace(FR_RE, (m,a,b)=>'<span class="fr"><span class="fn">'+a+'</span><span class="fd">'+b+'</span></span>');
}

/* =======================================================================
   解答の正規化と判定（本編アプリと同じ規則）
   ======================================================================= */
const FLIP = {'<':'>','>':'<','≦':'≧','≧':'≦'};
function flipIneq(s){
  if(!/[<>≦≧]/.test(s)) return s;
  return s.split(/([<>≦≧])/).reverse().map(p=>FLIP[p]||p).join('');
}
const FBAR = '⁄';
const CARET = '\u0001';
const TOKCH = '[0-9a-z.^\u0001]';
function tokenL(s, i){
  if(s[i-1]===')'){
    let d=0;
    for(let j=i-1;j>=0;j--){
      if(s[j]===')') d++;
      else if(s[j]==='('){ d--; if(d===0) return j; }
    }
    return i-1;
  }
  let j=i-1;
  while(j>=0 && new RegExp(TOKCH).test(s[j])) j--;
  return j+1;
}
function tokenR(s, i){
  if(s[i+1]==='('){
    let d=0;
    for(let j=i+1;j<s.length;j++){
      if(s[j]==='(') d++;
      else if(s[j]===')'){ d--; if(d===0) return j+1; }
    }
    return i+2;
  }
  let j=i+1;
  while(j<s.length && new RegExp(TOKCH).test(s[j])) j++;
  return j;
}
function unfrac(t){
  for(let guard=0; guard<40; guard++){
    const i = t.indexOf(FBAR);
    if(i<0) break;
    const a = tokenL(t, i), bEnd = tokenR(t, i);
    const den = t.slice(a, i), num = t.slice(i+1, bEnd);
    if(den==='' || num===''){ t = t.slice(0,i) + '/' + t.slice(i+1); continue; }
    t = t.slice(0,a) + num + '/' + den + t.slice(bEnd);
  }
  return t;
}
function nz(s){
  let t = String(s==null?'':s);
  t = t.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t = t.replace(/（/g,'(').replace(/）/g,')');
  t = t.replace(/[，、]/g,',').replace(/．/g,'.');
  t = t.replace(/[①②③④⑤]/g, c=>String('①②③④⑤'.indexOf(c)+1));
  t = t.replace(/[−–—‐ー]/g,'-');
  t = t.replace(/[\s　]/g,'');
  t = t.toLowerCase();
  t = t.replace(/sqrt/g,'√').replace(/cbrt/g,'∛');
  t = t.replace(/log_/g,'log');
  t = t.replace(/∛\(([^()]*)\)/g,'√[3]{$1}').replace(/∛([0-9a-z.]+)/g,'√[3]{$1}');
  t = t.replace(/√\[([^\]]+)\]([0-9a-z.]+)/g,'√[$1]{$2}');
  t = t.replace(/√(?!\[|\{)([0-9a-z.]+)/g,'√{$1}');
  t = t.replace(/√\[2\]\{/g,'√{');
  t = t.replace(/＜/g,'<').replace(/＞/g,'>').replace(/＝/g,'=').replace(/／/g,'/');
  if(t.indexOf(FBAR)>=0) t = unfrac(t);
  t = t.replace(/>=|≥/g,'≧').replace(/<=|≤/g,'≦');
  t = t.replace(/[*・×⋅･]/g,'');
  t = t.replace(/÷/g,'/');
  t = t.replace(/桁$/,'').replace(/位$/,'').replace(/^小数第/,'');
  if(/^[xyn]=/.test(t) && !/[<>≦≧]/.test(t)) t = t.slice(2);
  if(t.indexOf(',')>=0){
    t = t.split(',').filter(v=>v!=='').map(v=>{
      const f = flipIneq(v);
      return f<v ? f : v;
    }).sort().join(',');
  }
  return t;
}
function noParen(s){ return s.replace(/[()]/g,''); }
function numOf(s){
  const m = /^(-?\d+(?:\.\d+)?)(?:\/(-?\d+(?:\.\d+)?))?$/.exec(s);
  if(!m) return null;
  const d = m[2]!==undefined ? parseFloat(m[2]) : 1;
  if(d===0) return null;
  return parseFloat(m[1])/d;
}
function judge(input, list){
  const a = nz(input);
  if(a==='') return false;
  const av = [a, flipIneq(a)];
  for(let i=0;i<list.length;i++){
    const b = nz(list[i]);
    for(let j=0;j<av.length;j++){
      if(av[j]===b) return true;
      if(noParen(av[j])===noParen(b)) return true;
    }
    const na=numOf(a), nb=numOf(b);
    if(na!==null && nb!==null && Math.abs(na-nb)<1e-9) return true;
  }
  return false;
}

/* =======================================================================
   記録（localStorage）

   本編アプリ（/tiri/）とは別のキーを使う。同じ置き場所を共有していても
   名前が重ならないので、どちらの記録も相手から見えないし消えない。
   ======================================================================= */
const K = {
  st   : 'feed_stats_v1',    // {qid:{c:正解数, w:間違い数, p:要復習}}
  fav  : 'feed_fav_v1',      // {qid:1}
  scope: 'feed_scope_v1',    // いま選んでいる範囲
  shuf : 'feed_shuffle_v1',  // 出題順
  seen : 'feed_seen_v1'      // 案内を出したか
};
function readJSON(k, dflt){
  try{
    const r = localStorage.getItem(k);
    if(!r) return dflt;
    const v = JSON.parse(r);
    return (v && typeof v==='object') ? v : dflt;
  }catch(e){ return dflt; }
}
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let ST  = readJSON(K.st, {});
let FAV = readJSON(K.fav, {});
/* 差し替えられた問題の記録が残り続けないよう、いまない問題は捨てる */
(function(){
  let drop = false;
  for(const k in ST){ if(!BYID[k] || !ST[k] || typeof ST[k]!=='object'){ delete ST[k]; drop = true; } }
  for(const k in FAV){ if(!BYID[k]){ delete FAV[k]; drop = true; } }
  if(drop){ writeJSON(K.st, ST); writeJSON(K.fav, FAV); }
})();
function saveST(){ writeJSON(K.st, ST); }
function rec(id){ if(!ST[id]) ST[id] = {c:0,w:0,p:0}; return ST[id]; }
function tries(id){ const r=ST[id]; return r ? (r.c||0)+(r.w||0) : 0; }
function isFav(id){ return !!FAV[id]; }
function isPending(id){ return ST[id] ? ST[id].p===1 : false; }
function totalFav(){ return Object.keys(FAV).length; }
function totalPending(){ let n=0; for(const k in ST) if(ST[k].p===1) n++; return n; }
function totalDone(){ let n=0; for(const k in ST) if(ST[k].c>0) n++; return n; }

/* =======================================================================
   状態
   ======================================================================= */
const $ = id => document.getElementById(id);
let SCOPE = '__all__';
try{ const v = localStorage.getItem(K.scope); if(v==='__all__'||v==='__fav__'||v==='__todo__'||BYTOPIC[v]) SCOPE = v; }catch(e){}
let SHUF = false;
try{ SHUF = localStorage.getItem(K.shuf)==='1'; }catch(e){}

let queue = [];      // 出題ぶんの問題（下に伸びていく）
let CUR   = 0;       // いま見ているカード
const answered = {}; // このセッションで答えたカード（カード番号ごと）

function poolOf(){
  if(SCOPE==='__all__') return ALL.slice();
  if(SCOPE==='__fav__') return ALL.filter(q=>isFav(q.id));
  if(SCOPE==='__todo__') return ALL.filter(q=>isPending(q.id));
  return ALL.filter(q=>q.topic===SCOPE);
}
function shuffled(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
let pool = [];
function extend(){
  if(!pool.length) return;
  const pass = SHUF ? shuffled(pool) : pool.slice();
  /* 同じ問題が続けて出ないように、つなぎ目だけずらす */
  if(SHUF && queue.length && pass.length>1 && pass[0].id===queue[queue.length-1].id){
    const t = pass.shift(); pass.splice(1,0,t);
  }
  queue = queue.concat(pass);
}

/* =======================================================================
   カードを作る
   ======================================================================= */
const feed = $('feed');
let rendered = 0;

function svgHeart(){ return '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.6-9C.8 8.4 2.6 4.7 6.2 4.2 8.5 3.9 10.8 5 12 7c1.2-2 3.5-3.1 5.8-2.8 3.6.5 5.4 4.2 3.8 7.8-2.1 4.3-9.6 9-9.6 9z"/></svg>'; }
function svgComment(){ return '<svg viewBox="0 0 24 24"><path d="M12 3c5.5 0 10 3.4 10 7.6 0 4.2-4.5 7.6-10 7.6-.9 0-1.8-.1-2.6-.3L4 21l1.2-3.6C3.2 16 2 13.4 2 10.6 2 6.4 6.5 3 12 3z"/></svg>'; }
function svgMark(){ return '<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg>'; }
function svgChart(){ return '<svg viewBox="0 0 24 24"><path d="M4 19h16v2H4zM5 10h3v7H5zM10.5 5h3v12h-3zM16 13h3v4h-3z"/></svg>'; }
function ringHTML(rate){
  const deg = Math.round(rate*360);
  return '<span class="ring" style="background:conic-gradient(var(--ok) 0 '+deg+'deg, rgba(255,255,255,.18) '+deg+'deg 360deg)"></span>';
}

function cardHTML(q, n){
  const t = BYTOPIC[q.topic];
  const list = ALL.filter(x=>x.topic===q.topic);
  let done = 0; list.forEach(x=>{ if(ST[x.id] && ST[x.id].c>0) done++; });
  const rate = list.length ? done/list.length : 0;
  const badge = shortName(t).slice(0,3);

  return ''+
  '<button class="void" data-a="write">'+
    '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 6l3 3"/></svg>'+
    'タップして計算スペース'+
  '</button>'+
  '<div class="stamp hide"></div>'+
  '<div class="rail">'+
    '<button class="ri av" data-a="scope">'+
      '<span class="ava">'+ringHTML(rate)+'<span class="ph">'+esc(badge)+'</span><span class="pl">＋</span></span>'+
    '</button>'+
    '<button class="ri'+(isFav(q.id)?' on':'')+'" data-a="fav">'+svgHeart()+'<span class="n">'+totalFav()+'</span></button>'+
    '<button class="ri" data-a="answer">'+svgComment()+'<span class="n">'+tries(q.id)+'</span></button>'+
    '<button class="ri cy'+(isPending(q.id)?' on':'')+'" data-a="todo">'+svgMark()+'<span class="n">'+totalPending()+'</span></button>'+
    '<button class="ri" data-a="stats">'+svgChart()+'<span class="n">'+totalDone()+'</span></button>'+
    '<button class="ri ord'+(SHUF?'':' stop')+'" data-a="shuffle">'+
      '<span class="disc"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="17.5" cy="16" r="2.6"/></svg></span>'+
      '<span class="n">'+(SHUF?'ランダム':'じゅんばん')+'</span></button>'+
  '</div>'+
  '<div class="meta">'+
    '<div class="who">'+n+'問目<span class="sub">'+esc(shortName(t))+'</span></div>'+
    '<div class="cap mq">'+fmt(q.q)+'</div>'+
    (q.g ? '<div class="given">ただし <b>'+fmt(q.g)+'</b></div>' : '')+
    '<div class="tags">#'+esc(shortName(t).replace(/\s/g,''))+' #'+(q.topic.indexOf('tb-')===0?'教科書':'オリジナル')+(q.self?' #証明':'')+'</div>'+
    '<div class="lnks">'+
      (q.h ? '<button class="lnk" data-a="hint">ヒントを見る</button>' : '')+
      '<button class="lnk" data-a="answer">解答・解説</button>'+
    '</div>'+
    '<div class="hintbox hide"></div>'+
    '<div class="music"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="17.5" cy="16" r="2.6"/></svg>'+
      '<span>'+esc(t.name)+' ・ 全'+list.length+'問 ・ '+esc(t.desc)+'</span></div>'+
  '</div>';
}

const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio>=.6) setCur(+e.target.dataset.i);
  });
}, {threshold:[.6]});

function addCards(upto){
  while(rendered < upto){
    if(rendered >= queue.length) extend();
    if(rendered >= queue.length) return;      /* 出す問題がない（範囲が空） */
    const q = queue[rendered];
    const el = document.createElement('section');
    el.className = 'card';
    el.dataset.i = rendered;
    el.innerHTML = cardHTML(q, rendered+1);
    feed.appendChild(el);
    io.observe(el);
    rendered++;
  }
}

function setCur(i){
  if(i===CUR && rendered>i+3) return;
  CUR = i;
  addCards(i + 6);                 /* 先の分をすこし作っておく */
  usePad(queue[i] ? queue[i].id : 'x');
  if(!$('write').classList.contains('hide')) paintWQ();
}

function rebuild(){
  pool = poolOf();
  queue = [];
  rendered = 0;
  io.disconnect();
  feed.innerHTML = '';
  CUR = 0;
  for(const k in answered) delete answered[k];
  resetPadStore();
  if(!pool.length){
    const el = document.createElement('section');
    el.className = 'card';
    el.dataset.i = 0;
    el.innerHTML = '<div class="meta"><div class="who">0問</div>'+
      '<div class="cap" style="font-family:inherit;font-size:15px">この範囲にはまだ問題がありません。'+
      (SCOPE==='__fav__' ? 'ハートを押した問題がここに集まります。'
       : SCOPE==='__todo__' ? '間違えた問題がここに集まります。' : '')+
      '</div>'+
      '<div class="lnks"><button class="lnk" data-a="scope">範囲をえらぶ</button></div></div>';
    feed.appendChild(el);
    return;
  }
  addCards(6);
  feed.scrollTop = 0;
}

/* カードの表示だけを今の記録に合わせて描き直す */
function refreshCard(i){
  const el = feed.querySelector('.card[data-i="'+i+'"]');
  const q = queue[i];
  if(!el || !q) return;
  const fav = el.querySelector('[data-a="fav"]'), td = el.querySelector('[data-a="todo"]');
  const ans = el.querySelector('.ri[data-a="answer"]'), stt = el.querySelector('[data-a="stats"]');
  if(fav){ fav.classList.toggle('on', isFav(q.id)); fav.querySelector('.n').textContent = totalFav(); }
  if(td){ td.classList.toggle('on', isPending(q.id)); td.querySelector('.n').textContent = totalPending(); }
  if(ans) ans.querySelector('.n').textContent = tries(q.id);
  if(stt) stt.querySelector('.n').textContent = totalDone();
}
function setStamp(i, kind){
  const el = feed.querySelector('.card[data-i="'+i+'"]');
  if(!el) return;
  const s = el.querySelector('.stamp');
  if(!s) return;
  const tpl = {
    ok:['ok','<path d="M5 12.5l4.5 4.5L19 7"/>','正解'],
    ng:['ng','<path d="M6 6l12 12M18 6L6 18"/>','不正解'],
    sk:['sk','<path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/>','答えを見た']
  }[kind];
  if(!tpl) return;
  s.className = 'stamp '+tpl[0];
  s.innerHTML = '<svg viewBox="0 0 24 24">'+tpl[1]+'</svg>'+tpl[2];
}

/* 下にドラッグして閉じる */
function dragToClose(sheet){
  let sy=0, dy=0, on=false;
  sheet.addEventListener('pointerdown', e=>{
    if(!e.target.closest('.grip, .sh, .ansq')) return;
    if(e.target.closest('.x')) return;
    on = true; sy = e.clientY; dy = 0;
    sheet.style.transition = 'none';
    sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', e=>{
    if(!on) return;
    dy = Math.max(0, e.clientY - sy);
    sheet.style.transform = 'translateY('+dy+'px)';
  });
  const drop = ()=>{
    if(!on) return;
    on = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if(dy > 90) closeSheets();
  };
  sheet.addEventListener('pointerup', drop);
  sheet.addEventListener('pointercancel', drop);
}

let IV = '', IC = 0;
let pickMode = false;
const BOX = '□';
const LOG_TPL = 'log_'+BOX+'('+BOX+')';
const RT_TPL  = '√['+BOX+']{'+BOX+'}';
const EXITERS = '<>≦≧=,';
function curQ(){ return queue[CUR]; }
function resetInput(){
  IV = ''; IC = 0;
  $('field').classList.remove('err');
  clearWarn();
  paintField();
}
function escapeGroups(){ while(IC < IV.length && '}])'.indexOf(IV[IC]) >= 0) IC++; }
function insert(t){
  if(EXITERS.indexOf(t)>=0 && IV[IC]!==BOX) escapeGroups();
  if(t==='log' || t==='ⁿ√'){
    const tpl = t==='log' ? LOG_TPL : RT_TPL;
    IV = IV.slice(0,IC) + tpl + IV.slice(IC);
    IC = IV.indexOf(BOX, IC);
  }else if(IV[IC]===BOX){
    IV = IV.slice(0,IC) + t + IV.slice(IC+1);
    IC += t.length;
  }else{
    IV = IV.slice(0,IC) + t + IV.slice(IC);
    IC += t.length;
  }
  $('field').classList.remove('err');
  clearWarn();
  paintField();
  buzz(4);
}
function nextBox(){
  return IV.indexOf(BOX, IC+1)>=0 ? IV.indexOf(BOX, IC+1) : IV.indexOf(BOX);
}
function doFn(f){
  if(f==='bs'){ if(IC>0){ IV = IV.slice(0,IC-1)+IV.slice(IC); IC--; } }
  else if(f==='l'){ if(IC>0) IC--; }
  else if(f==='r'){
    const nb = nextBox();
    if(nb>=0 && nb!==IC) IC = nb;
    else if(IC<IV.length) IC++;
  }
  else if(f==='go'){ submit(); return; }
  $('field').classList.remove('err');
  clearWarn();
  paintField();
}
function boxify(html){ return html.split(BOX).join('<span class="bx">'+BOX+'</span>'); }
function preview(s){
  let t = unfrac(String(s));
  t = t.replace(/\^\(([^()]*)\)/g, '^{$1}');
  t = t.replace(/√\(([^()]*)\)/g, '√{$1}');
  t = t.replace(/√([\d\u0001]+(?:\/[\d\u0001]+)?|[a-z]\u0001?)/g, '√{$1}');
  t = t.replace(/log_([\d□\u0001]+(?:\/[\d\u0001]+)?|[a-z]\u0001?)\(([^()]*)\)/g, 'log_{$1}$2');
  t = t.replace(/log_([\d□\u0001]+(?:\/[\d\u0001]+)?|[a-z]\u0001?)/g, 'log_{$1}');
  return boxify(fmt(t));
}
function paintField(){
  const f = $('field');
  if(IV===''){
    f.innerHTML = pickMode
      ? '<span class="ph">下から選んでください</span>'
      : '<span class="caret"></span><span class="ph">ここに解答を入力</span>';
  }else if(pickMode){
    f.innerHTML = esc(IV);
    return;
  }else{
    const withCaret = IV.slice(0,IC) + CARET + IV.slice(IC);
    f.innerHTML = preview(withCaret).split(CARET).join('<span class="caret"></span>');
  }
  paintPreview();
}
function paintPreview(){

}

   ======================================================================= */
function openAnswer(){
  const q = curQ();
  if(!q) return;
  $('ansQ').innerHTML = fmt(q.q) + (q.g ? '<span class="g">ただし '+fmt(q.g)+'</span>' : '');
  if(answered[CUR] && !answered[CUR].retry){   /* 一度答えたカードは結果をそのまま出す */
    const a = answered[CUR];
    openSheet($('ansSheet'));
    if(q.self) showSelf(q, true); else showResult(q, a.ok, a.given, true);
    return;
  }
  if(q.self){ openSheet($('ansSheet')); showSelf(q, false); return; }
  $('ansInput').classList.remove('hide');
  $('ansRes').classList.add('hide');
  pickMode = !!q.c;
  $('hintLine').classList.remove('warn');
  $('hintLine').textContent = pickMode ? '' : (q.h || '');
  $('howBtn').classList.toggle('hide', pickMode);
  showHow(false);
  $('choices').classList.toggle('hide', !pickMode);
  $('field').classList.toggle('jp', pickMode);
  if(pickMode) buildChoices(q);
  resetInput();
  openSheet($('ansSheet'));
}

function submit(){
  const q = curQ();
  if(!q || q.self) return;
  if(nz(IV)===''){ warnInput('解答が入力されていません'); return; }
  if(IV.indexOf(BOX)>=0){
    warnInput(IV[IC]===BOX ? '□ がまだ空です。数字を押して埋めてください'
                           : '□ が残っています。→ で移って埋めてください');
    return;
  }
  const ok = judge(IV, q.a);
  score(q, ok);
  if(answered[CUR]) answered[CUR].retry = false;   /* 解き直しはここで終わり */
  showResult(q, ok, IV, false);
}

/* ok: true=正解 / false=不正解 / null=答えを見ただけ（記録しない） */
function score(q, ok){
  if(answered[CUR]) return;                 /* 1枚につき最初の1回だけ記録 */
  answered[CUR] = {ok:ok, given:IV};
  if(ok===null){ setStamp(CUR,'sk'); return; }
  const r = rec(q.id);
  if(ok){ r.c++; r.p = 0; } else { r.w++; r.p = 1; }
  saveST();
  setStamp(CUR, ok ? 'ok' : 'ng');
  refreshCard(CUR);
  buildTabs();
}

  r.innerHTML =

  r.innerHTML =

/* =======================================================================
   計算スペース（書くモード）
   ======================================================================= */
const pad  = $('pad');
const ctx  = pad.getContext('2d');
const buf  = document.createElement('canvas');
const bctx = buf.getContext('2d');

let strokes = [], redoStack = [];
let drawing = false, cur = null;
let tool = 'pen';
let penW = 2.2, eraW = 24;
let penSeen = false;
let dpr = 1;
const padStore = {}, padOrder = [];
const PAD_KEEP = 24;

function setupPad(){
  const r = pad.getBoundingClientRect();
  if(r.width===0 || r.height===0) return;
  dpr = Math.min(window.devicePixelRatio||1, 2.5);
  pad.width  = buf.width  = Math.round(r.width*dpr);
  pad.height = buf.height = Math.round(r.height*dpr);
  bake();
}
function inkStroke(c, s){
  if(!s.pts.length) return;
  c.save();
  c.setTransform(dpr,0,0,dpr,0,0);
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = s.w;
  if(s.tool==='era'){
    c.globalCompositeOperation = 'destination-out';
    c.strokeStyle = c.fillStyle = 'rgba(0,0,0,1)';
  }else{
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = c.fillStyle = '#ffffff';
  }
  if(s.pts.length===1){
    c.beginPath();
    c.arc(s.pts[0].x, s.pts[0].y, s.w/2, 0, Math.PI*2);
    c.fill();
  }else{
    c.beginPath();
    c.moveTo(s.pts[0].x, s.pts[0].y);
    for(let i=1;i<s.pts.length-1;i++){
      const mx=(s.pts[i].x+s.pts[i+1].x)/2, my=(s.pts[i].y+s.pts[i+1].y)/2;
      c.quadraticCurveTo(s.pts[i].x, s.pts[i].y, mx, my);
    }
    const L = s.pts[s.pts.length-1];
    c.lineTo(L.x, L.y);
    c.stroke();
  }
  c.restore();
}
function bake(){
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,buf.width,buf.height);
  for(let i=0;i<strokes.length;i++) inkStroke(bctx, strokes[i]);
  paint();
}
function paint(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,pad.width,pad.height);
  ctx.drawImage(buf,0,0);
  if(cur) inkStroke(ctx, cur);
  const n = strokes.length + (cur?1:0);
  $('padHint').style.opacity = n ? 0 : 1;
  $('tUndo').disabled = strokes.length===0;
  $('tRedo').disabled = redoStack.length===0;
}
function ptOf(e){
  const r = pad.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
pad.addEventListener('pointerdown', e=>{
  if(e.pointerType==='pen') penSeen = true;
  if(penSeen && e.pointerType==='touch') return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  pad.setPointerCapture(e.pointerId);
  drawing = true;
  redoStack.length = 0;
  cur = { tool:tool, w: tool==='era'?eraW:penW, pts:[ptOf(e)] };
  paint();
});
pad.addEventListener('pointermove', e=>{
  if(!drawing || !cur) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(let i=0;i<evs.length;i++){
    const p = ptOf(evs[i]);
    const last = cur.pts[cur.pts.length-1];
    if(Math.abs(p.x-last.x)+Math.abs(p.y-last.y) < 0.7) continue;
    cur.pts.push(p);
  }
  paint();
});
function endDraw(){
  if(!drawing) return;
  drawing = false;
  if(cur){ strokes.push(cur); inkStroke(bctx, cur); cur = null; }
  paint();
}
pad.addEventListener('pointerup', endDraw);
pad.addEventListener('pointercancel', endDraw);
/* 2本指タップで1つ戻す */
let twoAt = 0;
pad.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    twoAt = Date.now();
    if(drawing){ drawing=false; cur=null; paint(); }
  }
}, {passive:true});
pad.addEventListener('touchend', e=>{
  if(twoAt && e.touches.length===0){
    const quick = Date.now()-twoAt < 320;
    twoAt = 0;
    if(quick) undo();
  }
}, {passive:true});

function undo(){ if(strokes.length){ redoStack.push(strokes.pop()); bake(); buzz(6); } }
function redo(){ if(redoStack.length){ const s=redoStack.pop(); strokes.push(s); inkStroke(bctx,s); paint(); buzz(6); } }
function clearPad(){ strokes.length = 0; redoStack.length = 0; cur = null; bake(); }
function usePad(key){
  if(!padStore[key]){
    padStore[key] = {s:[], r:[]};
    padOrder.push(key);
    while(padOrder.length > PAD_KEEP){
      const old = padOrder.shift();
      if(old !== key) delete padStore[old];
    }
  }
  strokes = padStore[key].s;
  redoStack = padStore[key].r;
  cur = null;
  if(!$('write').classList.contains('hide')) bake();
}
function resetPadStore(){
  for(const k in padStore) delete padStore[k];
  padOrder.length = 0;
  strokes = []; redoStack = []; cur = null;
}
function setTool(t){
  tool = t;
  $('tPen').classList.toggle('on', t==='pen');
  $('tEra').classList.toggle('on', t==='era');
}
$('tPen').addEventListener('click', ()=>setTool('pen'));
$('tEra').addEventListener('click', ()=>setTool('era'));
$('tUndo').addEventListener('click', undo);
$('tRedo').addEventListener('click', redo);
$('tClr').addEventListener('click', ()=>{ clearPad(); buzz(10); });
$('tDone').addEventListener('click', closeWrite);

function paintWQ(){
  const q = curQ();
  if(!q) return;
  $('wq').innerHTML = '<b style="font-family:inherit;font-size:12px;color:var(--t3);display:block;margin-bottom:5px;font-weight:400">'+
                      (CUR+1)+'問目</b>' + fmt(q.q) + (q.g ? '<span class="g">ただし '+fmt(q.g)+'</span>' : '');
}
function openWrite(){
  if(!curQ()) return;
  paintWQ();
  $('write').classList.remove('hide');
  usePad(curQ().id);
  requestAnimationFrame(()=>{ setupPad(); });
  syncNav('write');
}
function closeWrite(){
  $('write').classList.add('hide');
  syncNav('home');
}

let rzT = null, lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', ()=>{
  if(innerWidth===lastW && innerHeight===lastH) return;
  lastW = innerWidth; lastH = innerHeight;
  clearTimeout(rzT);
  rzT = setTimeout(()=>{ if(!$('write').classList.contains('hide')) setupPad(); }, 140);
});
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* =======================================================================
   範囲シート
   ======================================================================= */
function renderScope(){
  const body = $('scopeBody');
  let h = '';
  const row = (id, name, desc, list)=>{
    let done = 0; list.forEach(x=>{ if(ST[x.id] && ST[x.id].c>0) done++; });
    const rate = list.length ? done/list.length : 0;
    return '<button class="sitem'+(id===SCOPE?' on':'')+'" data-id="'+id+'">'+
             '<span class="nm">'+esc(name)+'<i>'+esc(desc)+'</i>'+
               '<span class="bar"><i style="width:'+Math.round(rate*100)+'%"></i></span></span>'+
             '<span class="num">'+done+' / '+list.length+'</span>'+
           '</button>';
  };
  h += '<div class="gname">ぜんぶ</div>';
  h += row('__all__','すべての範囲','指数・対数のすべての問題', ALL);
  const todo = ALL.filter(q=>isPending(q.id));
  const fav  = ALL.filter(q=>isFav(q.id));
  h += row('__todo__','要復習','間違えたまま正解していない問題', todo);
  h += row('__fav__','お気に入り','ハートを押した問題', fav);
  GROUPS.forEach(g=>{
    h += '<div class="gname">'+esc(g.name)+'</div>';
    g.ids.forEach(id=>{
      const t = BYTOPIC[id];
      if(!t) return;
      h += row(id, shortName(t), t.desc, ALL.filter(q=>q.topic===id));
    });
  });
  h += '<div style="height:14px"></div>';
  body.innerHTML = h;
}
$('scopeBody').addEventListener('click', e=>{
  const b = e.target.closest('.sitem');
  if(!b) return;
  closeSheets();
  setTimeout(()=>setScope(b.dataset.id), 180);
});

/* =======================================================================
   記録シート
   ======================================================================= */
function renderStats(){
  let tried = 0, right = 0, wrongSum = 0;
  for(const k in ST){
    const r = ST[k];
    if((r.c||0)+(r.w||0) > 0) tried++;
    if(r.c>0) right++;
    wrongSum += (r.w||0);
  }
  const rate = tried ? Math.round(right/tried*100) : 0;
  let h = '<div class="stwrap">';
  h += '<div class="hero">'+
         '<div class="hcard"><b>'+right+'<span style="font-size:12px;color:var(--t3)"> / '+ALL.length+'</span></b><i>正解した問題</i></div>'+
         '<div class="hcard"><b>'+rate+'<span style="font-size:12px;color:var(--t3)">%</span></b><i>解いたうちの正解率</i></div>'+
       '</div>';
  h += '<div class="hero">'+
         '<div class="hcard"><b>'+totalPending()+'</b><i>要復習</i></div>'+
         '<div class="hcard"><b>'+totalFav()+'</b><i>お気に入り</i></div>'+
       '</div>';

  h += '<div class="stsec">範囲ごと</div>';
  const rows = [];
  TOPICS.forEach(t=>{
    const list = ALL.filter(q=>q.topic===t.id);
    let done = 0, w = 0;
    list.forEach(q=>{ if(ST[q.id]){ if(ST[q.id].c>0) done++; w += (ST[q.id].w||0); } });
    rows.push({t:t, n:list.length, done:done, w:w});
  });
  rows.forEach(r=>{
    const p = r.n ? Math.round(r.done/r.n*100) : 0;
    h += '<div class="strow"><span class="nm">'+esc(shortName(r.t))+'</span>'+
         '<span class="bar" style="width:74px;margin:0;flex:none"><i style="width:'+p+'%"></i></span>'+
         '<span class="v">'+r.done+'/'+r.n+(r.w?'　×'+r.w:'')+'</span></div>';
  });

  const bad = Object.keys(ST).filter(k=>BYID[k] && (ST[k].w||0)>0)
                    .sort((a,b)=>ST[b].w-ST[a].w).slice(0,10);
  if(bad.length){
    h += '<div class="stsec">よく間違える問題</div>';
    bad.forEach(k=>{
      const q = BYID[k];
      h += '<div class="strow"><span class="nm mq">'+fmt(q.q)+'</span><span class="v">×'+ST[k].w+'</span></div>';
    });
  }

  h += '<button class="danger" id="wipe">このアプリの記録を消す</button>'+
       '<div class="note">消えるのはフィードの記録だけです。'+
       'もとの「指数・対数」アプリの記録は別に保存されているので残ります。</div>';
  h += '</div>';
  $('statBody').innerHTML = h;
  $('wipe').addEventListener('click', ()=>{
    if(!confirm('フィードの記録をすべて消します。よろしいですか？')) return;
    ST = {}; FAV = {};
    try{
      localStorage.removeItem(K.st);
      localStorage.removeItem(K.fav);
    }catch(e){}
    renderStats();
    buildTabs();
    rebuild();
  });
}

/* =======================================================================
   カードの上での操作
   ======================================================================= */
feed.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]');
  if(b){
    const card = b.closest('.card');
    if(card) CUR = +card.dataset.i;
    act(b.dataset.a);
    return;
  }
  /* 問題文をタップしたら全部見せる */
  const cap = e.target.closest('.cap');
  if(cap) cap.classList.toggle('open');
});

function act(a){
  const q = curQ();
  if(a==='answer'){ openAnswer(); }
  else if(a==='write'){ openWrite(); }
  else if(a==='scope'){ renderScope(); openSheet($('scopeSheet')); }
  else if(a==='stats'){ renderStats(); openSheet($('statSheet')); }
  else if(a==='hint'){
    const card = feed.querySelector('.card[data-i="'+CUR+'"]');
    if(!card || !q) return;
    const box = card.querySelector('.hintbox');
    const on = box.classList.toggle('hide');
    box.innerHTML = 'ヒント　'+esc(q.h||'');
    const lk = card.querySelector('[data-a="hint"]');
    if(lk) lk.textContent = on ? 'ヒントを見る' : 'ヒントを隠す';
  }
  else if(a==='fav'){
    if(!q) return;
    if(FAV[q.id]) delete FAV[q.id]; else FAV[q.id] = 1;
    writeJSON(K.fav, FAV);
    refreshCard(CUR);
    buildTabs();
    buzz(6);
  }
  else if(a==='todo'){
    if(!q) return;
    const r = rec(q.id);
    r.p = r.p===1 ? 0 : 1;
    saveST();
    refreshCard(CUR);
    buildTabs();
    buzz(6);
  }
  else if(a==='shuffle'){
    SHUF = !SHUF;
    try{ localStorage.setItem(K.shuf, SHUF?'1':'0'); }catch(e){}
    rebuild();
    buzz(8);
  }
  else if(a==='home'){
    closeWrite();
    closeSheets();
  }
}

$('nav').addEventListener('click', e=>{
  const b = e.target.closest('.nb');
  if(!b) return;
  act(b.dataset.a);
});
function syncNav(which){
  Array.prototype.forEach.call($('nav').children, b=>{
    b.classList.toggle('on', b.dataset.a===which);
  });
}

/* =======================================================================
   起動
   ======================================================================= */
buildTabs();
rebuild();

/* 案内は初回だけ */
let seen = false;
try{ seen = localStorage.getItem(K.seen)==='1'; }catch(e){}
if(!seen){
  $('intro').classList.remove('hide');
  $('introGo').addEventListener('click', ()=>{
    $('intro').classList.add('hide');
    try{ localStorage.setItem(K.seen,'1'); }catch(e){}
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    /* このページから登録するので、担当は /feed/ の中だけになる。
       親の /tiri/ の Service Worker とは持ち場が分かれる。 */
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
