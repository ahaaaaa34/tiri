<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>たんたん試し 4</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  html,body{height:100%; margin:0; overflow:hidden; background:#f4f4f5; color:#111}
  body{font-family:"Hiragino Sans",system-ui,sans-serif; display:flex; flex-direction:column}
  header{padding:8px 12px; font-size:12.5px; line-height:1.6; color:#555; background:#fff; border-bottom:1px solid #ddd}
  header b{color:#111}
  .ver{display:inline-block; margin-right:8px; padding:2px 9px; border-radius:999px;
       background:#111; color:#fff; font-size:13px; font-weight:700; letter-spacing:.06em; vertical-align:1px}
  .grid{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; padding:8px}
  .cell{position:relative; background:#fff; border:1px solid #ddd; border-radius:12px; overflow:hidden}
  .cell canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  .cell .tag{position:absolute; left:10px; top:7px; font-size:11.5px; color:#8a8a8a; pointer-events:none; line-height:1.4}
  .cell .tag b{display:block; font-size:16px; color:#111}
  .cell .num{position:absolute; right:12px; top:4px; font-size:30px; font-weight:800; color:#c9c9c9;
             font-variant-numeric:tabular-nums; pointer-events:none}
  .cell .num.ok{color:#1a8a3a}
  footer{padding:6px 12px 10px; display:flex; align-items:center; gap:10px; font-size:12px; color:#666}
  footer button{font:inherit; padding:7px 14px; border-radius:10px; border:1px solid #ccc; background:#fff}
</style>
</head>
<body>
<header>
  <span class="ver">v4</span>
  <b>4つの枠それぞれで、ペンで はやく2回「たんたん」。</b><br>
  数字が <b>2</b> になった枠が当たりです。どれが 2 になったか教えてください。
</header>

<div class="grid">
  <div class="cell" id="cA"><canvas></canvas><span class="tag"><b>A</b>今のアプリと同じ</span><span class="num">0</span></div>
  <div class="cell" id="cB"><canvas></canvas><span class="tag"><b>B</b>touch を止める</span><span class="num">0</span></div>
  <div class="cell" id="cC"><canvas></canvas><span class="tag"><b>C</b>touch だけで書く</span><span class="num">0</span></div>
  <div class="cell" id="cD"><canvas></canvas><span class="tag"><b>D</b>指定をゆるめる</span><span class="num">0</span></div>
</div>

<footer>
  <button id="clr">ぜんぶ消してやり直す</button>
  <span>1つの枠で「たんたん」→ 次の枠へ、を4回。</span>
</footer>

<script>
/* =====================================================================
   同じ「書く」しくみを、4とおりのやり方で並べる。
   iPad が2回目の合図を飲みこむのを、どれなら抜けられるかを見る。
   ===================================================================== */
function make(id, opt){
  const cell = document.getElementById(id);
  const cv = cell.querySelector('canvas');
  const num = cell.querySelector('.num');
  const ctx = cv.getContext('2d');
  let dpr = 1, strokes = [], cur = null;

  cv.style.touchAction = opt.touchAction;

  function fit(){
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    draw();
  }
  function draw(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.lineWidth = 3.4;
    ctx.strokeStyle = ctx.fillStyle = '#111';
    (cur ? strokes.concat([cur]) : strokes).forEach(s=>{
      if(s.length === 1){ ctx.beginPath(); ctx.arc(s[0].x, s[0].y, 1.7, 0, Math.PI*2); ctx.fill(); return; }
      ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
      for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x, s[i].y);
      ctx.stroke();
    });
    num.textContent = strokes.length;
    num.classList.toggle('ok', strokes.length >= 2);
  }
  window.addEventListener('resize', fit);
  function pt(e){
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function begin(p){ cur = [p]; draw(); }
  function move(p){
    if(!cur) return;
    const l = cur[cur.length-1];
    if(Math.abs(p.x-l.x) + Math.abs(p.y-l.y) >= 0.7) cur.push(p);
    draw();
  }
  function end(){ if(!cur) return; strokes.push(cur); cur = null; draw(); }

  /* ---- pointer で書く ---- */
  if(opt.pointer){
    cv.addEventListener('pointerdown', e=>{
      e.preventDefault();
      begin(pt(e));
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    });
    cv.addEventListener('pointermove', e=>{ if(cur){ e.preventDefault(); move(pt(e)); } });
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
  }

  /* ---- touch で書く ---- */
  if(opt.touch){
    cv.addEventListener('touchstart', e=>{ e.preventDefault(); begin(pt(e.changedTouches[0])); }, {passive:false});
    cv.addEventListener('touchmove',  e=>{ e.preventDefault(); move(pt(e.changedTouches[0])); }, {passive:false});
    cv.addEventListener('touchend',   e=>{ e.preventDefault(); end(); }, {passive:false});
    cv.addEventListener('touchcancel', end, {passive:true});
  }

  /* ---- 書くのは pointer のまま、touch の既定の動きだけ止める ---- */
  if(opt.blockTouch){
    ['touchstart','touchmove','touchend'].forEach(t=>
      cv.addEventListener(t, e=>e.preventDefault(), {passive:false}));
  }

  fit();
  return { reset(){ strokes = []; cur = null; draw(); } };
}

const cells = [
  /* A: 今のアプリと同じ。pointer だけで書き、touch には手を出さない。 */
  make('cA', {pointer:true,  touch:false, blockTouch:false, touchAction:'none'}),
  /* B: 書くのは pointer のまま。touch の既定の動きを止めて、
        Safari のジェスチャ判定そのものを起こさせない。 */
  make('cB', {pointer:true,  touch:false, blockTouch:true,  touchAction:'none'}),
  /* C: pointer を一切使わず、touch だけで書く。 */
  make('cC', {pointer:false, touch:true,  blockTouch:false, touchAction:'none'}),
  /* D: touch-action を manipulation に。none だと逆に効かない版があるらしいので。 */
  make('cD', {pointer:true,  touch:false, blockTouch:false, touchAction:'manipulation'}),
];
document.getElementById('clr').addEventListener('click', ()=>cells.forEach(c=>c.reset()));
</script>
</body>
</html>
