<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>たんたん調べ 2</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  html,body{height:100%; margin:0; overflow:hidden; background:#f4f4f5; color:#111}
  body{font-family:"Hiragino Sans",system-ui,sans-serif; display:flex; flex-direction:column}
  header{padding:7px 12px; font-size:12px; line-height:1.55; color:#555; background:#fff; border-bottom:1px solid #ddd}
  header b{color:#111}
  .padwrap{height:26vh; margin:7px; position:relative}
  #pad{position:absolute; inset:0; width:100%; height:100%; background:#fff;
       border:1px solid #ddd; border-radius:12px; touch-action:none; display:block}
  .bar{display:flex; gap:8px; align-items:center; padding:0 12px 5px; font-size:12px}
  .bar button{font:inherit; padding:5px 11px; border-radius:9px; border:1px solid #ccc; background:#fff}
  .bar .n{margin-left:auto; font-variant-numeric:tabular-nums}
  #log{flex:1; min-height:0; overflow:auto; margin:0 7px 7px; padding:7px 9px; background:#111; color:#dcdcdc;
       border-radius:12px; font-family:ui-monospace,Menlo,monospace; font-size:10px; line-height:1.5;
       white-space:pre; -webkit-user-select:text; user-select:text}
  #log .d{color:#7fd1ff}   /* pointer が下りた・上がった */
  #log .h{color:#6b7a86}   /* ただの通過・ホバー */
  #log .t{color:#ffd479}   /* touch */
  #log .x{color:#ff8a8a}   /* あやしいもの */
  #log .g{color:#8ce99a}   /* こちらの処理 */
</style>
</head>
<body>
<header>
  <b>白い枠の中で、ペンで はやく2回「たんたん」。</b>
  打ったあとは <b>ペンを画面のすぐ上に残したまま</b>（遠ざけないで）少し待ってください。<br>
  画面のどこに飛んだイベントも全部ひろいます。撮って送ってください。
</header>
<div class="padwrap"><canvas id="pad"></canvas></div>
<div class="bar">
  <button id="clr">消してやり直す</button>
  <span class="n">線 <b id="cnt">0</b> ／ 届いた合図 <b id="raw">0</b></span>
</div>
<div id="log"></div>

<script>
const pad = document.getElementById('pad'), logEl = document.getElementById('log');
const ctx = pad.getContext('2d');
let dpr = 1, last = 0, raw = 0, strokes = [], cur = null, drawing = false;

/* ---------------- 絵 ---------------- */
function fit(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = pad.getBoundingClientRect();
  pad.width = Math.round(r.width * dpr);
  pad.height = Math.round(r.height * dpr);
  redraw();
}
function redraw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,pad.width,pad.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = ctx.fillStyle = '#111';
  (cur ? strokes.concat([cur]) : strokes).forEach(s=>{
    if(s.length === 1){ ctx.beginPath(); ctx.arc(s[0].x, s[0].y, 1.6, 0, Math.PI*2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
    for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x, s[i].y);
    ctx.stroke();
  });
  document.getElementById('cnt').textContent = strokes.length;
}
window.addEventListener('resize', fit);
function ptOf(e){
  const r = pad.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---------------- 記録 ---------------- */
let pend = null;                    /* 動き系はまとめて1行にする */
function flush(){
  if(!pend) return;
  const p = pend; pend = null;
  put('h', p.name + ' ×' + p.n + '   ' + p.where);
}
function put(cls, text){
  const now = performance.now();
  const gap = last ? Math.round(now - last) : 0;
  last = now;
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = '+' + String(gap).padStart(4) + 'ms  ' + text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  while(logEl.children.length > 500) logEl.removeChild(logEl.firstChild);
}
function log(cls, text){ flush(); put(cls, text); }
function pile(name, where){
  raw++; document.getElementById('raw').textContent = raw;
  if(pend && pend.name === name){ pend.n++; return; }
  flush();
  pend = {name:name, n:1, where:where};
}
function who(e){
  const t = e.target;
  if(!t || !t.tagName) return '（不明）';
  return t.tagName.toLowerCase() + (t.id ? '#' + t.id : '');
}
function pinfo(e){
  return (e.pointerType || '?') + ' id=' + e.pointerId + (e.isPrimary ? ' 主' : ' 副') +
         ' 圧=' + (e.pressure === undefined ? '-' : e.pressure.toFixed(2)) + '   ' + who(e);
}
function tinfo(e){
  const c = e.changedTouches && e.changedTouches[0];
  return (c && c.touchType ? c.touchType : '種類なし') + ' 本数=' + e.touches.length +
         ' 力=' + (c && c.force !== undefined ? c.force.toFixed(2) : '-') + '   ' + who(e);
}

/* ---- 画面ぜんぶを見張る（枠の外に飛んでも拾えるように） ---- */
const BIG = ['pointerdown','pointerup','pointercancel','gotpointercapture','lostpointercapture',
             'touchstart','touchend','touchcancel',
             'mousedown','mouseup','click','dblclick','contextmenu',
             'gesturestart','gestureend','selectstart'];
const SMALL = ['pointerover','pointerenter','pointerout','pointerleave','pointermove','touchmove','mousemove'];

BIG.forEach(t=>window.addEventListener(t, e=>{
  raw++; document.getElementById('raw').textContent = raw;
  const cls = /^touch/.test(t) ? 't' : (/dblclick|contextmenu|gesture|cancel/.test(t) ? 'x' : 'd');
  log(cls, t + '  ' + (/^touch/.test(t) ? tinfo(e) : (e.pointerId !== undefined ? pinfo(e) : who(e))));
}, true));
SMALL.forEach(t=>window.addEventListener(t, e=>{
  pile(t + (e.pointerType ? '(' + e.pointerType + ' id=' + e.pointerId + ')' : ''), who(e));
}, true));
document.addEventListener('selectionchange', ()=>log('x', 'selectionchange（文字が選ばれた）'), true);
window.addEventListener('blur', ()=>log('x', 'ページが後ろに回った'), true);
document.addEventListener('visibilitychange', ()=>log('x', 'visibilitychange ' + document.visibilityState), true);

/* ---------------- 本番の書く処理 ---------------- */
pad.addEventListener('pointerdown', e=>{
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  drawing = true;
  cur = [ptOf(e)];
  redraw();
  try{ pad.setPointerCapture(e.pointerId); }
  catch(err){ log('x', '    capture でしくじった: ' + err.name); }
  log('g', '    → 書き始めた');
});
pad.addEventListener('pointermove', e=>{
  if(!drawing || !cur) return;
  e.preventDefault();
  const p = ptOf(e), l = cur[cur.length-1];
  if(Math.abs(p.x-l.x) + Math.abs(p.y-l.y) >= 0.7) cur.push(p);
  redraw();
});
function end(){
  if(!drawing) return;
  drawing = false;
  if(cur){ strokes.push(cur); cur = null; }
  redraw();
  log('g', '    → 書き終わった（線 ' + strokes.length + '本目）');
}
pad.addEventListener('pointerup', end);
pad.addEventListener('pointercancel', end);

document.getElementById('clr').addEventListener('click', ()=>{
  strokes = []; cur = null; drawing = false; raw = 0; last = 0; pend = null;
  document.getElementById('raw').textContent = '0';
  logEl.innerHTML = '';
  redraw();
});

fit();
put('g', '用意できました。ペンで はやく2回 たんたん と打ってください。');
</script>
</body>
</html>
