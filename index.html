<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF8">
<meta name="description" content="指数関数・対数関数の演習アプリ。手書きの計算スペースと専用キーボードで、スマホだけで解いて記録できます。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./katex.min.css">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>微分法 ｜ 数学II</title>
<style>
  :root{
    --bg:#FAFAF8;
    --bg2:#F3F3F0;
    --card:#FFFFFF;
    --t1:#111111;
    --t2:#555555;
    --t3:#999999;
    --bd:#E0E0DC;
    --bd2:#EEEEEA;
    --err:#8B0000;
    --ok:#00008B;
    --sh:0 1px 2px rgba(17,17,17,.04);
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  /* 画面の文字は選べないようにする。
     Apple Pencil で書いていると、手のひらや軸が問題文に触れただけで
     文字が選ばれて「コピー／調べる／翻訳」の黒いメニューが出てしまう。 */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  html,body{height:100%; overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--t1);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,system-ui,-apple-system,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    line-height:1.55; font-size:15px;
    overscroll-behavior:none;
  }
  button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
  .app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden}
  .hide{display:none !important}

  /* ---------- 数式表示 ---------- */
  .mq{font-family:"Times New Roman",'Hiragino Mincho ProN',serif; letter-spacing:.01em}
  sup,sub{font-size:.68em; line-height:0}
  sup{vertical-align:.5em} sub{vertical-align:-.28em}
  .rt{white-space:nowrap}
  .rt .ri{font-size:.6em; vertical-align:.62em; margin-right:-.28em}
  .rt .rb{border-top:1px solid currentColor; padding:0 .14em 0 .06em; margin-left:.02em}

  /* ---------- メニュー ---------- */
  #menu{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px calc(40px + var(--safe-b))}
  .mhead{padding:34px 0 22px; text-align:center}
  /* 更新が届いたか分かるように、トップに小さく版を出す */
  .mhead .ver{margin:0 0 6px; font-size:11px; color:var(--t3); letter-spacing:.14em}
  .mhead h1{margin:0; font-size:25px; font-weight:600; letter-spacing:.06em}
  .mhead .cap{margin:6px 0 0; font-size:12px; color:var(--t3); letter-spacing:.18em}
  .sec{margin:0 0 9px; font-size:11px; color:var(--t3); letter-spacing:.14em; font-weight:600}

  .seg{display:flex; gap:2px; background:var(--bg2); border-radius:11px; padding:3px; margin-bottom:8px}
  .seg button{flex:1; border:0; background:transparent; color:var(--t2); font-size:12.5px; padding:9px 4px; border-radius:8px; letter-spacing:.02em}
  .seg button.on{background:var(--card); color:var(--t1); font-weight:600; box-shadow:var(--sh)}
  .modenote{font-size:11.5px; color:var(--t3); margin:0 0 12px; padding:0 2px; line-height:1.6}
  .toggle{display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:6px 2px; margin-bottom:16px; font-size:13px; color:var(--t2)}
  .toggle .tk{width:38px; height:22px; border-radius:22px; background:var(--bd2); border:1px solid var(--bd); flex:none; position:relative; transition:background .16s, border-color .16s}
  .toggle .tk i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--card); box-shadow:var(--sh); transition:transform .16s}
  .toggle[aria-pressed="true"]{color:var(--t1)}
  .toggle[aria-pressed="true"] .tk{background:var(--t1); border-color:var(--t1)}
  .toggle[aria-pressed="true"] .tk i{transform:translateX(16px)}
  .toggle[disabled]{opacity:.35}

  .tlist{display:flex; flex-direction:column; gap:7px; margin-bottom:22px}
  .gsec{margin:14px 0 -1px; padding-left:2px; font-size:10.5px; color:var(--t3); letter-spacing:.16em; font-weight:600}
  .mrow{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .gsec:first-child{margin-top:6px}
  .titem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--bd); border-radius:13px;
    padding:14px 15px; box-shadow:var(--sh); transition:transform .06s, background .12s;
  }
  .titem:active{transform:scale(.985); background:var(--bg2)}
  .titem .nm{flex:1; min-width:0}
  .titem .nm b{display:block; font-size:15px; font-weight:600; letter-spacing:.01em}
  .titem .nm span{display:block; font-size:11.5px; color:var(--t3); margin-top:2px}
  .titem .rt2{display:flex; align-items:center; gap:9px; flex:none}
  .titem .num{font-size:12px; color:var(--t2); font-variant-numeric:tabular-nums}
  .titem .arw{color:var(--t3); font-size:17px; line-height:1}
  .titem.all{background:var(--t1); border-color:var(--t1); color:var(--card)}
  .titem.all .nm span,.titem.all .num,.titem.all .arw{color:rgba(255,255,255,.62)}
  .titem.all:active{background:#000}
  /* 途中でやめた範囲は、カード＋「途中から」の2つ並びにする */
  .trow{display:flex; gap:7px; align-items:stretch}
  .trow .titem{flex:1; min-width:0}
  .tcont{
    flex:none; width:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:var(--bg2); border:1px solid var(--bd); border-radius:13px; box-shadow:var(--sh);
    padding:8px 4px; transition:transform .06s, background .12s;
  }
  .tcont:active{transform:scale(.97); background:var(--bd2)}
  .tcont .cl{font-size:10px; color:var(--t3); letter-spacing:.04em}
  .tcont b{font-size:13px; font-weight:600; color:var(--t1); font-variant-numeric:tabular-nums}
  .titem[disabled]{opacity:.4; box-shadow:none}
  .titem.rsm{border-style:dashed; border-color:var(--bd); margin-bottom:0}
  .mini-bar{display:block; height:2px; background:var(--bd2); border-radius:2px; margin-top:7px; overflow:hidden}
  .mini-bar i{display:block; height:100%; background:var(--t3); border-radius:2px}
  .badge{
    font-size:11px; font-variant-numeric:tabular-nums; color:var(--err);
    border:1px solid rgba(139,0,0,.24); border-radius:20px; padding:1px 7px; background:rgba(139,0,0,.04);
  }
  .empty{border:1px dashed var(--bd); border-radius:13px; padding:26px 16px; text-align:center; color:var(--t3); font-size:12.5px; line-height:1.8}

  /* ---------- 記録の持ち出し ---------- */
  .bkrow{display:flex; gap:8px; margin-top:8px}
  .bkbtn{flex:1; min-height:42px; border-radius:11px; border:1px solid var(--bd);
         background:var(--card); color:inherit; font-size:13.5px}
  .bkbtn.go{background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600}
  .bkbtn:active{opacity:.75}
  .bknote{font-size:11px; color:var(--t3); line-height:1.85; margin-top:9px}
  .bkbox{margin-top:12px; padding:12px; border:1px solid var(--bd); border-radius:12px; background:var(--card)}
  .bkh{margin:0 0 8px; font-size:11.5px; color:var(--t3); line-height:1.8}
  .bkta{width:100%; height:110px; box-sizing:border-box; padding:9px; border-radius:9px;
        border:1px solid var(--bd); background:var(--bg2); color:inherit;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; line-height:1.5;
        resize:none;
        /* 記録の書き出し・読みこみ欄だけは、選んで貼りつけできるようにしておく */
        -webkit-user-select:text; user-select:text; -webkit-touch-callout:default}
  .bkmsg{margin:8px 0 0; font-size:11.5px; line-height:1.7}
  .bkmsg.ok{color:var(--ok)} .bkmsg.ng{color:var(--ng)}

  /* ---------- 囲った計算 ---------- */
  #ansClip{position:relative; margin:0 14px 8px; padding:6px 8px; border:1px solid var(--bd);
           border-radius:10px; background:var(--bg2); text-align:center}
  #ansClip img{max-width:100%; max-height:104px; display:inline-block; vertical-align:middle}
  #ansClip .cx{position:absolute; right:6px; top:6px; font-size:10px; color:var(--t3);
               background:var(--card); border-radius:99px; padding:3px 8px; line-height:1}
  .mfoot{display:flex; justify-content:center; padding-top:6px}
  .lnk{background:none; border:0; color:var(--t3); font-size:11.5px; letter-spacing:.06em; text-decoration:underline; text-underline-offset:3px; padding:8px}

  /* ---------- 演習画面 ---------- */
  #play{flex:1; display:flex; flex-direction:column; min-height:0}
  .bar{display:flex; align-items:center; gap:6px; padding:8px 8px 7px; flex:none}
  .mbar{padding-top:calc(8px + var(--safe-t)); border-bottom:1px solid var(--bd2); margin-bottom:8px}
  .ib{
    width:38px; height:38px; flex:none; border:0; background:transparent; border-radius:10px;
    display:flex; align-items:center; justify-content:center; transition:background .12s;
  }
  .ib:active{background:var(--bg2)}
  .ib svg{width:19px; height:19px; stroke:var(--t1); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .ttl{flex:1; text-align:center; min-width:0}
  .ttl b{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ttl span{display:block; font-size:10.5px; color:var(--t3); font-variant-numeric:tabular-nums; letter-spacing:.06em; margin-top:1px}
  .prog{height:2px; background:var(--bd2); flex:none}
  .prog i{display:block; height:100%; background:var(--t1); width:0; transition:width .28s ease}

  .qbox{
    flex:none; display:block; width:auto; text-align:left;
    margin:11px 12px 0; background:var(--card); border:1px solid var(--bd);
    border-radius:13px; padding:12px 14px; box-shadow:var(--sh);
    max-height:26vh; overflow-y:auto; transition:padding .16s;
  }
  .qbox .lb{font-size:10px; color:var(--t3); letter-spacing:.16em; margin-bottom:5px; display:flex; gap:8px; align-items:center}
  .qbox .lb .wc{color:var(--err); letter-spacing:.02em}
  .qbox .lb .fold{margin-left:auto; letter-spacing:.04em; text-decoration:underline; text-underline-offset:2px}
  .qbox .qt{display:block; font-size:17px; line-height:1.75; word-break:break-word}
  .qbox .gv{display:block; font-size:11.5px; color:var(--t2); margin-top:7px; padding-top:7px; border-top:1px solid var(--bd2)}
  .qbox .gv.hide{display:none !important}
  /* たたんだ状態: 1行だけ見せて計算スペースを広げる */
  .qbox.fold{padding:7px 14px 8px; overflow:hidden}
  .qbox.fold .lb{margin-bottom:2px}
  .qbox.fold .qt{
    font-size:14px; line-height:1.5; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .qbox.fold .gv{display:none}

  .tools{display:flex; align-items:center; gap:4px; padding:9px 12px 7px; flex:none}
  .tb{
    height:36px; min-width:44px; padding:0 11px; border:1px solid var(--bd); background:var(--card);
    border-radius:9px; display:flex; align-items:center; justify-content:center; gap:5px; box-shadow:var(--sh);
    transition:background .12s, border-color .12s;
  }
  .tb svg{width:17px; height:17px; stroke:var(--t1); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .tb.on{background:var(--t1); border-color:var(--t1)}
  .tb.on svg{stroke:var(--card)}
  .tb:disabled{opacity:.32}
  .tb:active{background:var(--bg2)}
  .tb.on:active{background:#000}
  .tsp{flex:1}

  .padwrap{flex:1; min-height:0; margin:0 12px; position:relative}
  #pad{
    position:absolute; inset:0; width:100%; height:100%;
    background:var(--card); border:1px solid var(--bd); border-radius:13px;
    box-shadow:var(--sh); touch-action:none; display:block;
  }
  .padhint{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:var(--t3); font-size:12px; letter-spacing:.1em; pointer-events:none;
    transition:opacity .2s;
  }
  .padhint small{display:block; font-size:10.5px; letter-spacing:.04em; margin-top:6px; opacity:.75}
  .foot{flex:none; padding:11px 12px calc(11px + var(--safe-b))}
  .pbtn{
    width:100%; height:50px; border:0; border-radius:13px; background:var(--t1); color:var(--card);
    font-size:15px; font-weight:600; letter-spacing:.08em; transition:transform .06s, opacity .12s;
  }
  .pbtn:active{transform:scale(.985); opacity:.86}
  .pbtn.ghost{background:var(--card); color:var(--t1); border:1px solid var(--bd); box-shadow:var(--sh)}

  /* ---------- 学習状況（ダッシュボード） ----------
     3つの状態は色だけに頼らせない。凡例を必ず出し、各行に実数を併記する。
     「未着手」の #EEEEEA は白地とのコントラストが低い（1.13:1）ため、
     数値ラベルで内容が伝わるようにしている。 */
  .statlink{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--bd); border-radius:13px;
    padding:12px 15px; box-shadow:var(--sh); margin-bottom:18px; font-size:14px;
  }
  .statlink:active{background:var(--bg2)}
  .statlink .sl{font-weight:600; flex:none}
  .statlink .sr{flex:1; text-align:right; font-size:11.5px; color:var(--t3); font-variant-numeric:tabular-nums}
  .statlink .arw{color:var(--t3); font-size:17px; line-height:1; flex:none}

  /* ---------- KaTeX ----------
     数式は KaTeX で組む。地の文はこれまでどおりの書体のまま。 */
  .katex{font-size:1.05em}
  .mq .katex{font-size:1em}
  /* 埋めるべき □ */
  .tbx{color:var(--ng)}
  /* 入力欄のカーソル */
  .tcaret{animation:tcar 1.05s steps(1) infinite; font-weight:300}
  @keyframes tcar{50%{opacity:0}}

  /* 別リポジトリにある「フィード」への行き来。記録は同じものを見ている。 */
  .feedlink{margin-bottom:0; color:inherit; text-decoration:none}
  .feedlink .sr{font-size:11px}

  #stats{flex:1; display:flex; flex-direction:column; min-height:0}
  .stbody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px calc(36px + var(--safe-b))}

  .hero{text-align:center; padding:22px 0 6px}
  .hero .hv{font-size:52px; font-weight:600; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .hero .hv i{font-style:normal; font-size:22px; color:var(--t3); margin-left:1px}
  .hero .hl{margin:8px 0 0; font-size:12px; color:var(--t2); letter-spacing:.04em}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:18px 0 6px}
  .tile{background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:11px 10px; box-shadow:var(--sh)}
  .tile .tl{font-size:10px; color:var(--t3); letter-spacing:.08em; display:block}
  .tile .tv{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:3px; display:block}
  .tile .tv small{font-size:11px; color:var(--t3); font-weight:400; margin-left:1px}

  .verdict{display:flex; flex-direction:column; gap:7px; margin:16px 0 6px}
  .vrow{display:flex; align-items:baseline; gap:10px; background:var(--card); border:1px solid var(--bd);
        border-radius:11px; padding:10px 13px; box-shadow:var(--sh); font-size:13px}
  .vrow .vk{font-size:10.5px; color:var(--t3); letter-spacing:.1em; flex:none; width:52px}
  .vrow .vn{flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .vrow .vp{font-variant-numeric:tabular-nums; color:var(--t2); flex:none; font-size:12px}
  .vrow.bad .vp{color:var(--err)}

  .legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin:10px 2px 12px; font-size:11px; color:var(--t2)}
  .legend span{display:flex; align-items:center; gap:6px}
  .legend i{width:10px; height:10px; border-radius:3px; flex:none}
  .legend .k1{background:var(--t1)} .legend .k2{background:var(--err)} .legend .k3{background:var(--bd2)}

  .srow{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd);
    border-radius:12px; padding:11px 13px 12px; box-shadow:var(--sh); margin-bottom:7px;
  }
  .srow:active{background:var(--bg2)}
  .srow.src{background:var(--bg2); box-shadow:none; pointer-events:none}
  .srow.src:active{background:var(--bg2)}
  .srow .sh1{display:flex; align-items:baseline; gap:8px}
  .srow .sn{flex:1; font-size:14px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .srow .sa{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--t2); flex:none}
  .srow .sa.none{color:var(--t3); font-size:11px}
  /* 積み上げ棒: セグメントの間は 2px の余地（背景＝白）で分ける */
  .sbar{display:flex; gap:2px; height:9px; margin:8px 0 6px}
  .sbar i{border-radius:4px; min-width:0}
  .sbar .b1{background:var(--t1)} .sbar .b2{background:var(--err)} .sbar .b3{background:var(--bd2)}
  .srow .sf{display:flex; gap:12px; font-size:10.5px; color:var(--t3); font-variant-numeric:tabular-nums}
  .srow .sf b{font-weight:400; color:var(--t2)}
  .srow .sf .w{color:var(--err)}

  .wq{display:flex; flex-direction:column; gap:7px}
  .wqi{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd);
    border-left:2px solid var(--err); border-radius:11px; padding:10px 13px; box-shadow:var(--sh);
  }
  .wqi:active{background:var(--bg2)}
  .wqi .h{display:flex; align-items:baseline; gap:9px}
  .wqi .q{flex:1; font-size:13.5px; line-height:1.6; min-width:0}
  .wqi .n{flex:none; font-size:11px; color:var(--err); font-variant-numeric:tabular-nums}
  .wqi .t{font-size:10.5px; color:var(--t3); margin-top:3px; display:block}
  .wqi .x{display:block; font-size:12px; color:var(--t2); line-height:1.8; margin-top:8px; padding-top:8px; border-top:1px solid var(--bd2)}
  .wqi .x.hide{display:none !important}

  .stempty{border:1px dashed var(--bd); border-radius:13px; padding:34px 18px; text-align:center;
           color:var(--t3); font-size:12.5px; line-height:1.9; margin-top:20px}

  /* ---------- 結果画面 ---------- */
  #done{flex:1; overflow-y:auto; padding:0 18px calc(28px + var(--safe-b))}
  .dhead{text-align:center; padding:40px 0 26px}
  .dhead .sc{font-size:44px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .dhead .sc i{font-style:normal; font-size:19px; color:var(--t3); margin-left:2px}
  .dhead p{margin:6px 0 0; font-size:12px; color:var(--t3); letter-spacing:.12em}
  .wlist{display:flex; flex-direction:column; gap:7px; margin-bottom:24px}
  .witem{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd);
    border-left:2px solid var(--err); border-radius:11px; padding:11px 13px; box-shadow:var(--sh);
    transition:background .12s;
  }
  .witem:active{background:var(--bg2)}
  .witem .q{display:block; font-size:14px; line-height:1.7}
  .witem .q .wg{font-size:11px; color:var(--t3); margin-left:3px}
  .witem .a{font-size:11.5px; color:var(--t2); margin-top:4px; display:flex; align-items:baseline; gap:6px}
  .witem .a b{color:var(--t1); font-weight:600}
  .witem .a .more{margin-left:auto; color:var(--t3); text-decoration:underline; text-underline-offset:3px; flex:none}
  .witem .wexp{display:block; font-size:12px; color:var(--t2); line-height:1.8; margin-top:9px; padding-top:9px; border-top:1px solid var(--bd2)}
  .witem .wexp.hide{display:none !important}
  .dbtns{display:flex; flex-direction:column; gap:8px}

  /* ---------- シート ---------- */
  .back{position:fixed; inset:0; background:rgba(17,17,17,.28); opacity:0; pointer-events:none; transition:opacity .22s; z-index:40}
  .back.on{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg); border-top:1px solid var(--bd);
    border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(17,17,17,.08);
    transform:translateY(102%); transition:transform .26s cubic-bezier(.22,.68,.3,1);
    padding-bottom:var(--safe-b); max-height:92vh; max-height:92dvh; display:flex; flex-direction:column;
  }
  .sheet.on{transform:translateY(0)}
  .grip{width:34px; height:4px; background:var(--bd); border-radius:4px; margin:9px auto 4px; flex:none}
  .sh{padding:6px 16px 10px; display:flex; align-items:center; gap:10px; flex:none}
  .sh b{flex:1; font-size:12.5px; letter-spacing:.1em; color:var(--t2); font-weight:600}
  .sh .lnk{padding:4px 2px}
  /* 小さい端末では項目がシートに収まらないのでここをスクロールさせる（min-height:0 は保険） */
  .slist{padding:0 12px 14px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch}
  .sitem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0;
    background:transparent; border-radius:11px; padding:14px 12px; font-size:14.5px; transition:background .12s;
  }
  .sitem:active{background:var(--bg2)}
  .sitem svg{width:18px; height:18px; flex:none; stroke:var(--t2); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .sitem.dg{color:var(--err)} .sitem.dg svg{stroke:var(--err)}
  .sitem .sd{display:block; font-size:11px; color:var(--t3); margin-top:1px}
  .sitem .sw{flex:1; min-width:0}
  .sitem:disabled{opacity:.32}
  .shr{height:1px; background:var(--bd2); margin:6px 12px}

  /* ---------- 問題を選ぶ ---------- */
  .jitem{
    display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; border:0;
    background:transparent; border-radius:11px; padding:11px 10px; transition:background .12s;
  }
  .jitem:active{background:var(--bg2)}
  .jitem.now{background:var(--bg2); box-shadow:inset 0 0 0 1px var(--bd)}
  .jitem .jn{flex:none; min-width:2.1em; text-align:right; font-size:12px; color:var(--t3);
             padding-top:3px; font-variant-numeric:tabular-nums}
  .jitem.now .jn{color:var(--t1); font-weight:700}
  /* 問題文は長いので2行で切る */
  .jitem .jq{flex:1; min-width:0; font-size:14px; line-height:1.65; overflow:hidden;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .jitem .jm{flex:none; margin-top:2px; font-size:11px; letter-spacing:.06em;
             padding:2px 8px; border-radius:999px; border:1px solid var(--bd)}
  .jitem .jm.ok{color:var(--ok); border-color:var(--ok)}
  .jitem .jm.ng{color:var(--err); border-color:var(--err)}
  .jitem .jm.na{color:var(--t3)}
  .prow{display:flex; align-items:center; gap:12px; padding:6px 12px 4px}
  .prow .pl{flex:1; font-size:14.5px}
  .seg.mini{margin:0; width:168px; flex:none}
  .seg.mini button{font-size:12.5px; padding:7px 4px}

  /* ---------- 解答入力 ---------- */
  .ansq{padding:0 14px 8px; font-size:13px; color:var(--t2); line-height:1.7; flex:none}
  .field .fr{margin:0 .18em}
  .field .fr .fn,.field .fr .fd{font-size:.86em; padding:0 .22em}
  .field{
    margin:0 12px 4px; background:var(--card); border:1px solid var(--bd); border-radius:11px;
    min-height:52px; padding:13px 14px; font-size:19px; line-height:1.4; box-shadow:var(--sh);
    word-break:break-all; flex:none; font-family:"Times New Roman",serif;
  }
  .field.err{border-color:var(--err)}
  .field.jp{font-family:inherit; font-size:16px}
  .field .ph{color:var(--t3); font-size:14px; font-family:inherit}
  .caret{display:inline-block; width:1.5px; height:1.05em; background:var(--t1); vertical-align:-.18em; margin:0 .5px; animation:bl 1.05s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .hintline{font-size:11px; color:var(--t3); padding:2px 16px 8px; flex:none; letter-spacing:.02em;
            display:flex; align-items:baseline; gap:10px}
  .hintline #hintLine{flex:1; min-width:0}
  .hintline .lnk{padding:2px 0; flex:none; font-size:11px}
  .hintline #hintLine.warn{color:var(--err); font-weight:600}
  .hintline #hintLine.todo{color:var(--err); font-weight:600}
  /* 埋めるべき □ は入力欄でもプレビューでも目立たせる */
  .bx{display:inline-block; min-width:.72em; padding:0 .06em; border:1px dashed var(--err);
      border-radius:3px; color:var(--err); line-height:1.15; text-align:center}
  /* シートの中身も縦フレックスにして、はみ出す要素だけ縮む／スクロールできるようにする */
  #ansInput{display:flex; flex-direction:column; min-height:0}
  /* 書き方の早見表（キーボードの場所に出す） */
  .how{margin:2px 12px 10px; padding:12px 14px; background:var(--bg2); border:0; border-radius:12px;
       flex:none; text-align:left; display:grid; grid-template-columns:repeat(2,1fr); gap:9px 14px;
       overflow-y:auto; min-height:0}
  .how > span{display:flex; align-items:baseline; gap:9px; font-size:12px; min-width:0}
  .how b{font-family:"Times New Roman",serif; font-size:15px; font-weight:400; flex:none; min-width:48px}
  .how > span > span{color:var(--t3); font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
            overflow:hidden; text-overflow:ellipsis}
  .how .hb{grid-column:1/-1; justify-content:center; color:var(--t3); font-size:10.5px;
           letter-spacing:.08em; padding-top:3px; border-top:1px solid var(--bd); margin-top:1px}

  .kb{padding:2px 6px 8px; flex:none; display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .k{
    height:44px; border:1px solid var(--bd); background:var(--card); border-radius:9px;
    font-size:17px; display:flex; align-items:center; justify-content:center; box-shadow:var(--sh);
    font-family:"Times New Roman",serif; transition:background .08s, transform .05s; user-select:none;
  }
  .k:active{background:var(--bg2); transform:scale(.95)}
  .k.fn{background:var(--bg2); font-size:14px; font-family:inherit; color:var(--t2); box-shadow:none}
  .k.fn:active{background:var(--bd2)}
  .k.fn svg{width:17px; height:17px; stroke:var(--t2); stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .k.go{grid-column:span 5; background:var(--t1); border-color:var(--t1); color:var(--card); font-size:14.5px; font-weight:600; font-family:inherit; letter-spacing:.08em}
  .k.go:active{background:#000}
  .k .sm{font-size:12px}
  /* 横棒の分数（入力プレビュー用） */
  .fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
      margin:0 .14em; line-height:1.12; position:relative; top:-.08em}
  .fr .fn{font-size:.82em; padding:0 .2em}
  .fr .fd{font-size:.82em; padding:0 .2em; border-top:1px solid currentColor; margin-top:.08em}
  /* 分数が入る行は少し行間を広げて、上下の行とぶつからないようにする */
  .rexp,.wexp,.proof,.qt,.ansq{line-height:2}

  /* 記号で書けない答え（増加/減少・対称の軸など）は選択式にする */
  .chbox{padding:2px 12px 10px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; min-height:0}
  .ch{
    min-height:50px; padding:12px 16px; text-align:left; border:1px solid var(--bd);
    background:var(--card); border-radius:11px; font-size:15px; box-shadow:var(--sh);
    display:flex; align-items:center; gap:11px; transition:background .12s, border-color .12s;
  }
  .ch::before{
    content:''; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--bd2);
    flex:none; transition:border-color .12s, box-shadow .12s;
  }
  .ch:active{background:var(--bg2)}
  .ch.on{border-color:var(--t1)}
  .ch.on::before{border-color:var(--t1); border-width:5px}

  /* ---------- 判定 ---------- */
  .res{padding:14px 16px 18px; overflow-y:auto}
  .rq{font-size:14px; color:var(--t2); line-height:1.7; padding-bottom:11px; margin-bottom:12px; border-bottom:1px solid var(--bd2)}
  .rq .rg{font-size:11.5px; color:var(--t3); margin-left:4px}
  .rsub{font-size:11.5px; color:var(--t3); margin-top:5px}
  .proof{font-size:14px; line-height:1.95; color:var(--t1); white-space:pre-line}
  .selfask{font-size:11.5px; color:var(--t3); margin-top:11px; text-align:center; letter-spacing:.04em}
  /* 正解か不正解かは一目で分かってほしいので、文字だけでなく地色ごと変える */
  .rmark{
    display:inline-flex; align-items:center; gap:8px; font-size:17px; font-weight:600; letter-spacing:.1em;
    padding:8px 17px 8px 13px; border-radius:999px;
  }
  .rmark svg{width:21px; height:21px; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}
  /* 正解は青、不正解は赤で塗りつぶす */
  .rmark.ok{background:var(--ok); color:var(--card)} .rmark.ok svg{stroke:var(--card)}
  .rmark.ng{background:var(--err); color:var(--card)} .rmark.ng svg{stroke:var(--card)}
  .rmark.sk{background:var(--bg2); color:var(--t2); border:1px solid var(--bd)}
  .rmark.sk svg{stroke:var(--t2); fill:var(--t2)}
  /* 答えの枠も、不正解のときだけ縁の色を変えて見分けやすくする */
  .rans.ngb{border-color:var(--err)}
  .ryour{font-size:12px; color:var(--t3); margin-top:8px}
  .ryour b{color:var(--err); font-weight:400; font-family:"Times New Roman",serif; font-size:14px}
  .rans{
    margin-top:12px; background:var(--card); border:1px solid var(--bd); border-radius:11px;
    padding:12px 14px; box-shadow:var(--sh);
  }
  .rans .lb{font-size:10px; color:var(--t3); letter-spacing:.16em; margin-bottom:4px}
  .rans .va{font-size:19px; font-family:"Times New Roman",serif}
  .rexp{margin-top:10px; font-size:12.5px; color:var(--t2); line-height:1.85; padding:0 2px}
  .rbtns{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  .rbtns .pbtn{flex:1 1 0; width:auto}
  /* 4つ並ぶと1行では文字が折れてしまうので、2つずつ2段にする */
  .rbtns.four .pbtn{flex:1 1 calc(50% - 4px)}

  .cmsg{padding:2px 18px 18px; font-size:14px; line-height:1.8; color:var(--t2)}

  /* ---------- 横向き・画面が低いとき ----------
     6段のままだと決定キーが画面の外に出てしまうので、
     横幅を使って12列3段に組み替え、余白も詰める。 */
  @media (max-height:520px){
    .mhead{padding:14px 0 10px}
    .mhead h1{font-size:21px}
    .mhead .cap{margin-top:3px}
    .bar{padding:4px 8px}
    .ib{width:34px; height:34px}
    .qbox{margin-top:8px; padding:9px 13px; max-height:34vh}
    .qbox .qt{font-size:16px}
    .tools{padding:7px 12px 6px}
    .tb{height:32px}
    .foot{padding:8px 12px calc(8px + var(--safe-b))}
    .pbtn{height:44px}
    .sh{padding:2px 16px 6px}
    .ansq{padding-bottom:5px}
    .field{min-height:44px; padding:10px 14px; font-size:18px}
    .hintline{padding-bottom:5px}
    .k{height:38px; font-size:16px}
    .how{margin:0 12px 8px; padding:9px 12px; gap:6px 12px}
    .how b{font-size:14px; min-width:44px}
    .ch{min-height:40px; padding:8px 14px; font-size:14px}
    .ch::before{width:15px; height:15px}
    .chbox{gap:5px; padding-bottom:8px}
    .res{padding:10px 16px 14px}
    .rq{padding-bottom:8px; margin-bottom:9px}
  }
  /* 極端に低い画面（小型端末の横向き）は、あると入り切らないものを削る */
  @media (max-height:365px){
    .how{max-height:132px; gap:5px 12px; padding:8px 12px}
    .how .hb{display:none}
    .ansq{font-size:12px}
  }
  @media (max-height:520px) and (min-width:560px){
    .kb{grid-template-columns:repeat(12,1fr)}
    .k.go{grid-column:span 4}
    .chbox{display:grid; grid-template-columns:repeat(2,1fr)}
    .chbox .pbtn{grid-column:span 2; margin-top:0 !important}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ========== トップ（教科書かオリジナルかを選ぶ） ========== -->
  <div id="home">
    <div class="mhead">
      <p class="ver">v5.3</p>
      <h1>微分法</h1>
      <p class="cap">数学 II　第6章</p>
    </div>

    <button class="statlink" id="statBtn">
      <span class="sl">学習状況を見る</span>
      <span class="sr" id="statPeek"></span>
      <span class="arw">›</span>
    </button>

    <div id="resume" class="hide"></div>

    <p class="sec">どれを解く？</p>
    <div class="tlist" id="sidelist"></div>

    <p class="sec">別のかたちで</p>
    <a class="statlink feedlink" href="../jhvjh/">
      <span class="sl">フィード</span>
      <span class="sr">上下にスワイプして1問ずつ　※中身はまだ指数・対数</span>
      <span class="arw">›</span>
    </a>

    <p class="sec">ほかの科目</p>
    <a class="statlink feedlink" href="./kobun.html">
      <span class="sl">古文単語</span>
      <span class="sr">意味を打って答える　まちがえた語だけ復習</span>
      <span class="arw">›</span>
    </a>

    <div class="mfoot"><button class="lnk" id="resetAll">学習記録をすべて消去</button></div>
  </div>

  <!-- ========== メニュー（選んだ側の範囲を選ぶ） ========== -->
  <div id="menu" class="hide">
    <div class="bar mbar">
      <button class="ib" id="toTop" aria-label="トップへ戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b id="sideTtl">教科書の問題</b><span id="sideCap"></span></div>
      <span class="ib"></span>
    </div>

    <p class="sec">出題モード</p>
    <div class="seg" id="modeSeg">
      <button data-m="normal" class="on">通常</button>
      <button data-m="wrong">間違えた問題</button>
      <button data-m="freq">間違い回数順</button>
    </div>
    <p class="modenote" id="modeNote"></p>

    <button class="toggle" id="shufBtn" aria-pressed="false">
      <span class="tk"><i></i></span>
      <span>順番をシャッフルする</span>
    </button>

    <p class="sec">範囲</p>
    <div class="tlist" id="tlist"></div>
    <div style="height:18px"></div>
  </div>

  <!-- ========== 演習 ========== -->
  <div id="play" class="hide">
    <div class="bar">
      <button class="ib" id="backBtn" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b id="pTitle"></b><span id="pCount"></span></div>
      <button class="ib" id="menuBtn" aria-label="メニュー">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="prog"><i id="progBar"></i></div>

    <!-- button の中身は phrasing content でないといけないので span を block 表示にする -->
    <button class="qbox" id="qBox" aria-expanded="true">
      <span class="lb"><span id="qLabel">問題</span><span class="wc" id="qWrong"></span><span class="fold" id="qFold">たたむ</span></span>
      <span class="qt mq" id="qText"></span>
      <span class="gv hide" id="qGiven"></span>
    </button>

    <div class="tools">
      <button class="tb on" id="tPen" aria-label="ペン">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 10-3-3L5 16l-1 4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <button class="tb" id="tEra" aria-label="消しゴム">
        <svg viewBox="0 0 24 24"><path d="M8.5 19.5H20"/><path d="M15.5 4.5l4 4a1.5 1.5 0 010 2.2l-8 8H7l-3-3a1.5 1.5 0 010-2.2l9.3-9a1.5 1.5 0 012.2 0z"/></svg>
      </button>
      <button class="tb" id="tSel" aria-label="囲って持っていく">
        <svg viewBox="0 0 24 24"><path d="M12 4c4.4 0 8 2.7 8 6s-3.6 6-8 6-8-2.7-8-6 3.6-6 8-6z" stroke-dasharray="3 2.5"/><path d="M16.5 15.5l3 4.5"/></svg>
      </button>
      <div class="tsp"></div>
      <button class="tb" id="tFit" aria-label="枠に収める">
        <svg viewBox="0 0 24 24"><path d="M3 8V3h5"/><path d="M21 8V3h-5"/><path d="M3 16v5h5"/><path d="M21 16v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
      </button>
      <button class="tb" id="tUndo" aria-label="元に戻す">
        <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="tb" id="tRedo" aria-label="やり直す">
        <svg viewBox="0 0 24 24"><path d="M15 14l4-4-4-4"/><path d="M19 10h-9a5 5 0 000 10h3"/></svg>
      </button>
      <button class="tb" id="tClr" aria-label="全消去">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 12h9l1-12"/></svg>
      </button>
    </div>

    <div class="padwrap">
      <canvas id="pad"></canvas>
      <div class="padhint" id="padHint">
        計算スペース
        <small>2本指でタップすると1つ戻せます</small>
      </div>
    </div>

    <div class="foot">
      <button class="pbtn" id="ansBtn">解答する</button>
    </div>
  </div>

  <!-- ========== 学習状況（ダッシュボード） ========== -->
  <div id="stats" class="hide">
    <div class="bar">
      <button class="ib" id="stBack" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b>学習状況</b><span id="stSub"></span></div>
      <span class="ib"></span>
    </div>
    <div class="stbody" id="stBody"></div>
  </div>

  <!-- ========== 結果 ========== -->
  <div id="done" class="hide">
    <div class="dhead">
      <div class="sc" id="dScore"></div>
      <p id="dSub"></p>
    </div>
    <div id="dWrongWrap" class="hide">
      <p class="sec">間違えた問題</p>
      <div class="wlist" id="dWrong"></div>
    </div>
    <div class="dbtns" id="dBtns"></div>
  </div>
</div>

<!-- ========== オーバーレイ ========== -->
<div class="back" id="back"></div>

<!-- 解答シート -->
<div class="sheet" id="ansSheet">
  <div class="grip"></div>
  <div id="ansInput">
    <div class="sh">
      <b>解答を入力</b>
      <button class="lnk" id="peekBtn">計算を見る</button>
      <button class="lnk" id="clrIn">全消去</button>
    </div>
    <div class="ansq mq" id="ansQ"></div>
    <div id="ansClip" class="hide"></div>
    <div class="field" id="field"></div>
    <!-- 打った文字が数式としてどう読まれるかをその場で見せる -->
    <div class="hintline">
      <span id="hintLine"></span>
      <button class="lnk" id="howBtn" aria-expanded="false">書き方 ▾</button>
    </div>
    <div class="kb" id="kb"></div>
    <!-- 早見表はキーボードと入れ替えて出す（積み上げると決定キーが画面外に出るため） -->
    <button class="how hide" id="how">
      <span><b>x<sup>2</sup></b><span>x^2</span></span>
      <span><b>3x<sup>2</sup>-2x</b><span>3x^2-2x</span></span>
      <span><b>3&frasl;2</b><span>2 → 分の → 3</span></span>
      <span><b>-<sup>5</sup>&frasl;<sub>27</sub></b><span>- → 27 → 分の → 5</span></span>
      <span><b>y = 3x-2</b><span>y → = → 3x-2</span></span>
      <span><b>(5, 10)</b><span>( → 5 → , → 10 → )</span></span>
      <span><b>3&pi;</b><span>3 → π</span></span>

    {id:'tb-p1-1wdj4vk', q:'［問題3(2)］a, b を定数とするとき、y = (ax+b)^3 の導関数が y′ = 3a(ax+b)^2 であることを示せ', self:true, e:'y = (ax+b)^3 = a^3x^3 + 3a^2bx^2 + 3ab^2x + b^3\nこれを x で微分すると\ny′ = 3a^3x^2 + 6a^2bx + 3ab^2\n = 3a(a^2x^2 + 2abx + b^2)\n = 3a(ax + b)^2'},
    {id:'tb-p1-16qk6hu', q:'［問題4］f(x) = x^3 + px^2 + qx について、方程式 f′(x) = 0 が実数解をもつような p, q の条件を求めよ', a:['p^2≧3q','p^2-3q≧0'], h:'p, q, ≧ のキーで。例: p^2≧3q', e:'f′(x) = 3x^2 + 2px + q。2次方程式 3x^2+2px+q = 0 が実数解をもつ条件は\n判別式 D/4 = p^2 - 3q ≧ 0\nよって p^2 ≧ 3q'},
    {id:'tb-p1-12wi18a', q:'［問題5］底面の直径と高さがともに a の直円柱の体積を V とする。a = 2 における V の微分係数を求めよ', a:['3π'], h:'π キーを使う。例: 3π', e:'底面の半径は a/2 なので V = π(a/2)^2×a = πa^3/4\ndV/da = 3πa^2/4。a=2 を代入して 3π×4/4 = 3π'},
    {id:'tb-p1-1recr31', q:'［問題6］k は 0 でない定数とする。2次関数 f(x) が f(x) + x^2 f′(x) = kx^3 + k^2x + 1 を満たすとき、f(x) を求めよ', a:['-(1/4)x^2+(1/4)x+1'], h:'分数は 分の キーで。例: -(4分の1)x^2+(4分の1)x+1', e:'f(x) = ax^2+bx+c とおくと f′(x) = 2ax+b。\nf(x) + x^2f′(x) = 2ax^3 + (a+b)x^2 + bx + c\n係数を比べて 2a = k、a+b = 0、b = k^2、c = 1。\nb = -a と b = k^2 = 4a^2 より -a = 4a^2 → a(4a+1) = 0。\nk≠0 だから a≠0 で a = -1/4、k = -1/2、b = 1/4。\nよって f(x) = -(1/4)x^2 + (1/4)x + 1'}
  ]

    {id:'tb-tan-yoy71h', q:'［例題4］曲線 y = x^2 - x + 2 上の点 (2, 4) における接線の方程式', a:['y=3x-2'], h:'y= から書く。例: y=3x-2', e:'y′ = 2x - 1。x=2 での傾きは 3。\ny - 4 = 3(x - 2) より y = 3x - 2'},

    {id:'tb-tan-kw31qx', q:'［応用例題1］点 (1, 1) から曲線 y = x^2 + 4 に引いた接線は2本ある。接点の x 座標が負であるほうの接線の方程式', a:['y=-2x+3'], h:'例: y=-2x+3', e:'接点を (t, t^2+4) とすると傾きは 2t。\n接線 y - (t^2+4) = 2t(x - t) が (1,1) を通るので\n1 - t^2 - 4 = 2t(1 - t) → t^2 - 2t - 3 = 0 → t = -1, 3\nt = -1 のとき接点 (-1, 5)、傾き -2 で y = -2x + 3'},
    {id:'tb-tan-5rauiw', q:'［応用例題1］点 (1, 1) から曲線 y = x^2 + 4 に引いた接線のうち、接点の x 座標が正であるほうの接線の方程式', a:['y=6x-5'], h:'例: y=6x-5', e:'t = 3 のとき接点 (3, 13)、傾き 6。\ny - 13 = 6(x - 3) より y = 6x - 5'},
    {id:'tb-tan-1vykis9', q:'［練習11(1)］点 (3, -4) から曲線 y = x^2 - 3x に引いた接線は2本ある。傾きが負であるほうの接線の方程式', a:['y=-x-1'], h:'例: y=-x-1', e:'接点を (t, t^2-3t) とすると傾きは 2t-3。\n-4 - (t^2-3t) = (2t-3)(3-t) を整理して t^2 - 6t + 5 = 0 → t = 1, 5\nt = 1 のとき接点 (1, -2)、傾き -1 で y = -x - 1'},
    {id:'tb-tan-yg3te0', q:'［練習11(1)］点 (3, -4) から曲線 y = x^2 - 3x に引いた接線のうち、傾きが正であるほうの接線の方程式', a:['y=7x-25'], h:'例: y=7x-25', e:'t = 5 のとき接点 (5, 10)、傾き 7。\ny - 10 = 7(x - 5) より y = 7x - 25'},
    {id:'tb-tan-1taznu0', q:'［練習11(1)］点 (3, -4) から曲線 y = x^2 - 3x に引いた接線のうち、傾きが正であるほうの接点の座標', a:['(5,10)'], h:'かっこと カンマ で。例: (5,10)', e:'t = 5 のとき接点は (5, 5^2-3×5) = (5, 10)'},
    {id:'tb-tan-6cx0tw', q:'［練習11(2)］点 (-1, -5) から曲線 y = x^3 に引いた接線の方程式', a:['y=3x-2'], h:'例: y=3x-2', e:'接点を (t, t^3) とすると傾きは 3t^2。\n-5 - t^3 = 3t^2(-1 - t) を整理して 2t^3 + 3t^2 - 5 = 0\n(t-1)(2t^2+5t+5) = 0 で 2t^2+5t+5 は実数解をもたないから t = 1。\n接点 (1, 1)、傾き 3 で y = 3x - 2'},

    {id:'tb-tan-kjvrwi', q:'［深める］放物線 y = f(x) とその接線 y = g(x) について、f(x) = g(x) を整理して得られる2次方程式は重解をもつ。このことを、応用例題1の放物線 y = x^2 + 4 と、その2本の接線 y = -2x+3、y = 6x-5 について、それぞれ確かめよ。', self:true, e:'接線 y = -2x+3 について\nx^2+4 = -2x+3 とすると　x^2+2x+1 = 0\nこの2次方程式の判別式を D_1 とすると\nD_1/4 = 1^2 - 1·1 = 0\n\n接線 y = 6x-5 について\nx^2+4 = 6x-5 とすると　x^2-6x+9 = 0\nこの2次方程式の判別式を D_2 とすると\nD_2/4 = (-3)^2 - 9·1 = 0\n\nよって、どちらの2次方程式も重解をもつ。\n（重解は順に x = -1、x = 3 で、これは接点の x 座標と一致する）'}
  ]
},

    {id:'tb-max-1jbou78', q:'［例題7］-2 ≦ x ≦ 4 における y = -2x^3 + 3x^2 + 12x の最大値', a:['20'], h:'例: 20', e:'y′ = -6x^2 + 6x + 12 = -6(x+1)(x-2)\n端と極値の候補: y(-2) = 4、y(-1) = -7、y(2) = 20、y(4) = -32\n最大値は 20（x = 2）'},
    {id:'tb-max-1jbn9ak', q:'［例題7］-2 ≦ x ≦ 4 における y = -2x^3 + 3x^2 + 12x の最小値', a:['-32'], h:'例: -32', e:'上の候補のうち最も小さいのは y(4) = -32'},
    {id:'tb-max-1w2vs3d', q:'［練習17(1)］-2 ≦ x ≦ 3 における y = x^3 - 3x + 4 の最大値', a:['22'], h:'例: 22', e:'y′ = 3x^2 - 3 = 3(x+1)(x-1)\ny(-2) = 2、y(-1) = 6、y(1) = 2、y(3) = 22\n最大値は 22（x = 3）'},
    {id:'tb-max-1w2vyc1', q:'［練習17(1)］-2 ≦ x ≦ 3 における y = x^3 - 3x + 4 の最小値', a:['2'], h:'例: 2', e:'y(-2) = 2 と y(1) = 2 が最小。最小値は 2'},
    {id:'tb-max-641cq6', q:'［練習17(2)］1 ≦ x ≦ 3 における y = -2x^3 + 6x^2 - 8 の最大値', a:['0'], h:'例: 0', e:'y′ = -6x^2 + 12x = -6x(x-2)\ny(1) = -4、y(2) = 0、y(3) = -8\n最大値は 0（x = 2）'},
    {id:'tb-max-6417k6', q:'［練習17(2)］1 ≦ x ≦ 3 における y = -2x^3 + 6x^2 - 8 の最小値', a:['-8'], h:'例: -8', e:'最も小さいのは y(3) = -8'},
    {id:'tb-max-p3s3xh', q:'［練習17(3)］-1 ≦ x ≦ 4 における y = x^4 - 4x^3 + 12 の最大値', a:['17'], h:'例: 17', e:'y′ = 4x^3 - 12x^2 = 4x^2(x-3)\ny(-1) = 17、y(0) = 12、y(3) = -15、y(4) = 12\n最大値は 17（x = -1）'},
    {id:'tb-max-p3r6od', q:'［練習17(3)］-1 ≦ x ≦ 4 における y = x^4 - 4x^3 + 12 の最小値', a:['-15'], h:'例: -15', e:'最も小さいのは y(3) = 81 - 108 + 12 = -15'},
    {id:'tb-max-m3wkkf', q:'［応用例題4］1辺 12 cm の正方形の厚紙の四隅から合同な正方形を切り取り、ふたのない箱を作る。容積が最大になるのは、切り取る正方形の1辺を何 cm にしたときか', a:['2'], h:'単位は書かない。例: 2', e:'切り取る1辺を x cm とすると 0 < x < 6 で\nV = x(12-2x)^2\nV′ = (12-2x)^2 + x×2(12-2x)(-2) = (12-2x)(12-6x)\n0 < x < 6 では 12-2x > 0 なので、符号を決めるのは 12-6x。\nx = 2 の前後で 正→負 となり、x = 2 で最大。'},
    {id:'tb-max-papr5v', q:'［練習18］底面の直径と高さの和が 18 cm である直円柱のうち、体積が最大になるものの高さは何 cm か', a:['6'], h:'単位は書かない。例: 6', e:'底面の半径を r cm、高さを h cm とすると 2r + h = 18、つまり h = 2(9-r) で 0 < r < 9。\nV = πr^2·2(9-r) = 2π(-r^3 + 9r^2)\ndV/dr = 2π(-3r^2 + 18r) = -6πr(r-6)\n0 < r < 9 では r = 6 で最大。このとき h = 2(9-6) = 6 cm'}
  ]
},
{
  id:'tb-nsol', name:'教科書｜方程式の実数解の個数', desc:'グラフの共有点で数える（例題8・練習19・応用例題5・問2・練習20）',
  qs:[
    {id:'tb-nsol-1japgj', q:'［例題8］方程式 x^3 - 3x + 1 = 0 の異なる実数解の個数', a:['3'], h:'個数だけ。例: 3', e:'f(x) = x^3-3x+1 とすると f′(x) = 3(x+1)(x-1)\n極大 f(-1) = 3 > 0、極小 f(1) = -1 < 0\n極大値と極小値が異符号なので x 軸と3回交わる。よって 3 個'},
    {id:'tb-nsol-72n6y2', q:'［練習19(1)］方程式 x^3 + 3x^2 - 5 = 0 の異なる実数解の個数', a:['1'], h:'例: 1', e:'f′(x) = 3x^2 + 6x = 3x(x+2)\n極大 f(-2) = -8+12-5 = -1 < 0、極小 f(0) = -5 < 0\n極大値も極小値も負なので x 軸と交わるのは1回。よって 1 個'},
    {id:'tb-nsol-1404pgs', q:'［練習19(2)］方程式 -x^3 + 3x^2 + 9x - 7 = 0 の異なる実数解の個数', a:['3'], h:'例: 3', e:'f′(x) = -3x^2 + 6x + 9 = -3(x+1)(x-3)\n極小 f(-1) = -12 < 0、極大 f(3) = 20 > 0\n異符号なので 3 個'},
    {id:'tb-nsol-1kjgnus', q:'［練習19(3)］方程式 -x^3 + 3x^2 - 4 = 0 の異なる実数解の個数', a:['2'], h:'例: 2', e:'f′(x) = -3x^2 + 6x = -3x(x-2)\n極小 f(0) = -4 < 0、極大 f(2) = 0\n極大値が 0 ちょうどなので、そこで x 軸に接する。交点は 2 個'},
    {id:'tb-nsol-1uctvqi', q:'［練習19(4)］方程式 x^4 - 2x^3 - 1 = 0 の異なる実数解の個数', a:['2'], h:'例: 2', e:'f′(x) = 4x^3 - 6x^2 = 2x^2(2x-3)\n極小は x = 3/2 のときだけで f(3/2) = 81/16 - 108/16 - 1 = -43/16 < 0\n最小値が負で、両端は +∞ に向かうので 2 個'},
    {id:'tb-nsol-mysy8e', q:'［応用例題5］方程式 x^3 + 3x^2 - a = 0 が異なる3個の実数解をもつような定数 a の値の範囲', a:['0<a<4'], h:'例: 0<a<4', e:'x^3 + 3x^2 = a とし、y = x^3+3x^2 と y = a の共有点を数える。\ny′ = 3x(x+2) より 極大 y(-2) = 4、極小 y(0) = 0\n共有点が3個になるのは 0 < a < 4'},
    {id:'tb-nsol-4qfdgc', q:'［問2(1)］方程式 x^3 + 3x^2 - a = 0 が異なる2個の実数解をもつような定数 a の値', a:['a=0,4','0,4','a=0,a=4'], h:'2つ。カンマで区切る。例: a=0,4', e:'直線 y = a が極大値・極小値をちょうど通るときに共有点が2個になる。\nよって a = 0、a = 4'},
    {id:'tb-nsol-1slfa2y', q:'［問2(2)］方程式 x^3 + 3x^2 - a = 0 がただ1個の実数解をもつような定数 a の値の範囲', a:['a<0,a>4'], h:'2つに分かれる。カンマで区切る。例: a<0,a>4', e:'直線 y = a が極小値 0 より下、または極大値 4 より上にあるとき共有点は1個。\nよって a < 0、4 < a'},
    {id:'tb-nsol-17f2p0a', q:'［練習20(1)］a は定数とする。方程式 2x^3 - 3x^2 - a = 0 について、a < -1 のときの異なる実数解の個数', a:['1'], h:'個数だけ。例: 1', e:'y = 2x^3-3x^2 と y = a の共有点を数える。\ny′ = 6x(x-1) より 極大 y(0) = 0、極小 y(1) = -1\na < -1 は極小値より下なので共有点は 1 個'},
    {id:'tb-nsol-x23onb', q:'［練習20(1)］方程式 2x^3 - 3x^2 - a = 0 について、a = -1 のときの異なる実数解の個数', a:['2'], h:'例: 2', e:'a = -1 は極小値そのもの。接する点と、もう1つの交点で 2 個'},
    {id:'tb-nsol-1su5r9m', q:'［練習20(1)］方程式 2x^3 - 3x^2 - a = 0 について、-1 < a < 0 のときの異なる実数解の個数', a:['3'], h:'例: 3', e:'極小値 -1 と極大値 0 の間なので共有点は 3 個'},
    {id:'tb-nsol-yt1h57', q:'［練習20(1)］方程式 2x^3 - 3x^2 - a = 0 について、a = 0 のときの異なる実数解の個数', a:['2'], h:'例: 2', e:'a = 0 は極大値そのもの。接する点と、もう1つの交点で 2 個'},
    {id:'tb-nsol-1ryw79k', q:'［練習20(1)］方程式 2x^3 - 3x^2 - a = 0 について、a > 0 のときの異なる実数解の個数', a:['1'], h:'例: 1', e:'極大値より上なので共有点は 1 個'},
    {id:'tb-nsol-5wgxiy', q:'［練習20(2)］a は定数とする。方程式 x^4 - 2x^2 - 2 + a = 0 について、a < 2 のときの異なる実数解の個数', a:['2'], h:'例: 2', e:'-x^4 + 2x^2 + 2 = a と変形し、y = -x^4+2x^2+2 と y = a の共有点を数える。\ny′ = -4x(x+1)(x-1) より 極大 y(±1) = 3、極小 y(0) = 2\na < 2 は極小値より下なので共有点は 2 個'},
    {id:'tb-nsol-107mm7b', q:'［練習20(2)］方程式 x^4 - 2x^2 - 2 + a = 0 について、a = 2 のときの異なる実数解の個数', a:['3'], h:'例: 3', e:'a = 2 は極小値そのもの。接する点と、その外側で2点。共有点は 3 個'},
    {id:'tb-nsol-1djqcx5', q:'［練習20(2)］方程式 x^4 - 2x^2 - 2 + a = 0 について、2 < a < 3 のときの異なる実数解の個数', a:['4'], h:'例: 4', e:'a は極小値 2 と極大値 3 の間。共有点は 4 個'},
    {id:'tb-nsol-1ktklk6', q:'［練習20(2)］方程式 x^4 - 2x^2 - 2 + a = 0 について、a = 3 のときの異なる実数解の個数', a:['2'], h:'例: 2', e:'a = 3 は極大値そのもの。2か所で接するので共有点は 2 個'},
    {id:'tb-nsol-rclt1', q:'［練習20(2)］方程式 x^4 - 2x^2 - 2 + a = 0 について、a > 3 のときの異なる実数解の個数', a:['0'], h:'例: 0', e:'a > 3 は極大値より上なので共有点はない。0 個'}
  ]
},
{
  id:'tb-pineq', name:'教科書｜不等式の証明', desc:'最小値が 0 以上であることを示す（応用例題6・練習21・練習22）',
  qs:[
    {id:'tb-pineq-8gmcoj', q:'［応用例題6］x ≧ 0 のとき、不等式 x^3 + 4 ≧ 3x^2 が成り立つことを示せ', self:true, e:'f(x) = x^3 - 3x^2 + 4 とおく。\nf′(x) = 3x^2 - 6x = 3x(x-2)\nx ≧ 0 における増減は\n0 ≦ x ≦ 2 で減少、2 ≦ x で増加\nよって x ≧ 0 での最小値は f(2) = 8 - 12 + 4 = 0\nしたがって x ≧ 0 のとき f(x) ≧ 0、すなわち x^3 + 4 ≧ 3x^2\n（等号が成り立つのは x = 2 のとき）'},
    {id:'tb-pineq-1nil6gx', q:'［練習21］x ≧ 1 のとき、不等式 2x^3 - 9x^2 + 12x - 4 ≧ 0 が成り立つことを示せ', self:true, e:'f(x) = 2x^3 - 9x^2 + 12x - 4 とおく。\nf′(x) = 6x^2 - 18x + 12 = 6(x-1)(x-2)\nx ≧ 1 における増減は\n1 ≦ x ≦ 2 で減少、2 ≦ x で増加\nよって x ≧ 1 での最小値は f(2) = 16 - 36 + 24 - 4 = 0\nしたがって x ≧ 1 のとき f(x) ≧ 0\n（等号が成り立つのは x = 2 のとき）'},
    {id:'tb-pineq-1n6wejx', q:'［練習22］すべての実数 x について、不等式 x^4 + 3 ≧ 4x が成り立つことを示せ', self:true, e:'f(x) = x^4 - 4x + 3 とおく。\nf′(x) = 4x^3 - 4 = 4(x-1)(x^2+x+1)\nx^2 + x + 1 = (x + 1/2)^2 + 3/4 > 0 だから、f′(x) の符号は x - 1 で決まる。\nx ≦ 1 で減少、1 ≦ x で増加\nよって最小値は f(1) = 1 - 4 + 3 = 0\nしたがってすべての x で f(x) ≧ 0、すなわち x^4 + 3 ≧ 4x\n（等号が成り立つのは x = 1 のとき）'}
  ]
},
{
  id:'tb-p2', name:'教科書｜第2節の問題', desc:'p.220 問題7〜14',
  qs:[
    {id:'tb-p2-12fo1iz', q:'［問題7(1)］曲線 y = x^3 + ax + b 上の点 (1, 2) における接線が原点を通るときの a の値', a:['-1'], h:'例: -1', e:'点 (1,2) が曲線上にあるので 1 + a + b = 2、すなわち a + b = 1。\ny′ = 3x^2 + a より接線の傾きは 3 + a。\n接線 y - 2 = (3+a)(x-1) が原点を通るので -2 = -(3+a) より 3 + a = 2、a = -1'},
    {id:'tb-p2-12fnbbs', q:'［問題7(1)］曲線 y = x^3 + ax + b 上の点 (1, 2) における接線が原点を通るときの b の値', a:['2'], h:'例: 2', e:'a + b = 1 に a = -1 を代入して b = 2'},
    {id:'tb-p2-p5muyi', q:'［問題7(2)］曲線 y = x^3 + ax + b 上の点 (1, 2) における接線の傾きが 4 であるときの a の値', a:['1'], h:'例: 1', e:'傾きは 3 + a なので 3 + a = 4 より a = 1'},
    {id:'tb-p2-p5myxl', q:'［問題7(2)］曲線 y = x^3 + ax + b 上の点 (1, 2) における接線の傾きが 4 であるときの b の値', a:['0'], h:'例: 0', e:'a + b = 1 に a = 1 を代入して b = 0'},
    {id:'tb-p2-1t4o1w1', q:'［問題8(1)］y = x^3 - 27x の極大値', a:['54'], h:'例: 54', e:'y′ = 3x^2 - 27 = 3(x+3)(x-3)\nx = -3 で極大。y = -27 + 81 = 54'},
    {id:'tb-p2-1t4mh2x', q:'［問題8(1)］y = x^3 - 27x の極小値', a:['-54'], h:'例: -54', e:'x = 3 で極小。y = 27 - 81 = -54'},
    {id:'tb-p2-if4kkj', q:'［問題8(2)］y = -(1/3)x^3 - 2x の極値', c:['極大値と極小値がある','極大値だけある','極値はない'], a:['極値はない'], e:'y′ = -x^2 - 2 = -(x^2 + 2)\nx^2 + 2 > 0 なので y′ < 0 が常に成り立つ。常に減少するので極値はない。'},
    {id:'tb-p2-g5dc5u', q:'［問題8(3)］y = -x^4 - (4/3)x^3 + 4x^2 の x = -2 における極大値', a:['32/3'], h:'分の キーで。3 → 分の → 32', e:'y′ = -4x^3 - 4x^2 + 8x = -4x(x+2)(x-1)\nx = -2 で極大。y = -16 + 32/3 + 16 = 32/3'},
    {id:'tb-p2-1rh506z', q:'［問題8(3)］y = -x^4 - (4/3)x^3 + 4x^2 の極小値', a:['0'], h:'例: 0', e:'x = 0 で極小。y = 0'},
    {id:'tb-p2-v0hbfg', q:'［問題8(3)］y = -x^4 - (4/3)x^3 + 4x^2 の x = 1 における極大値', a:['5/3'], h:'分の キーで。3 → 分の → 5', e:'y = -1 - 4/3 + 4 = 5/3'},
    {id:'tb-p2-14ja8vq', q:'［問題9］3次関数 f(x) が x = 0 で極小値 0、x = 2 で極大値 4 をとるとき、f(x) を求めよ', a:['-x^3+3x^2'], h:'x の式で。例: -x^3+3x^2', e:'f(x) = ax^3+bx^2+cx+d とおく。\nf(0) = d = 0、f′(0) = c = 0。\nf′(x) = 3ax^2 + 2bx で f′(2) = 12a + 4b = 0 より b = -3a。\nf(2) = 8a + 4b = 8a - 12a = -4a = 4 より a = -1、b = 3。\nよって f(x) = -x^3 + 3x^2'},
    {id:'tb-p2-17gh4wb', q:'［問題10］a > 0 とする。-1 ≦ x ≦ 2 における y = ax^3 + 3ax^2 + b の最大値を a, b で表せ', a:['20a+b'], h:'例: 20a+b', e:'y′ = 3ax^2 + 6ax = 3ax(x+2)。a > 0 なので -1 ≦ x ≦ 0 で減少、0 ≦ x ≦ 2 で増加。\n端の値は y(-1) = 2a+b、y(2) = 20a+b。a > 0 より大きいのは 20a+b'},
    {id:'tb-p2-1fiqfab', q:'［問題10］a > 0 とする。-1 ≦ x ≦ 2 における y = ax^3 + 3ax^2 + b の最小値を a, b で表せ', a:['b'], h:'例: b', e:'x = 0 で極小かつ最小。y(0) = b'},
    {id:'tb-p2-150fohk', q:'［問題11］半径 r、高さ h の直円錐に内接する直円柱のうち、体積が最大になるものの底面の半径を r で表せ', a:['2r/3'], h:'分の キーで。3 → 分の → 2r', e:'円柱の底面の半径を x（0 < x < r）とすると、相似より高さは h(1 - x/r)。\nV = πx^2·h(1 - x/r) = πh(x^2 - x^3/r)\nV′ = πh(2x - 3x^2/r) = πhx(2 - 3x/r)\nx = 2r/3 の前後で 正→負 となり、そこで最大'},
    {id:'tb-p2-f4ra6w', q:'［問題11］半径 r、高さ h の直円錐に内接する直円柱のうち、体積が最大になるものの高さを h で表せ', a:['h/3'], h:'分の キーで。3 → 分の → h', e:'高さは h(1 - x/r) に x = 2r/3 を代入して h(1 - 2/3) = h/3'},
    {id:'tb-p2-16rsi2h', q:'［問題12］方程式 x^3 - 6x + a = 0 が正の解を2個、負の解を1個もつような定数 a の値の範囲', a:['0<a<4√2'], h:'√ キーを使う。例: 0<a<4√2', e:'x^3 - 6x = -a とし、y = x^3-6x と y = -a の共有点を見る。\ny′ = 3(x^2-2) より 極大 y(-√2) = 4√2、極小 y(√2) = -4√2、y(0) = 0。\n正の解2個・負の解1個となるのは -4√2 < -a < 0、すなわち 0 < a < 4√2'},
    {id:'tb-p2-1j8xrr0', q:'［問題13］すべての実数 x について、不等式 x^4 + 4x^3 + 28 > 0 が成り立つことを示せ', self:true, e:'f(x) = x^4 + 4x^3 + 28 とおく。\nf′(x) = 4x^3 + 12x^2 = 4x^2(x+3)\n4x^2 ≧ 0 なので f′(x) の符号は x+3 で決まる。\nx ≦ -3 で減少、-3 ≦ x で増加\nよって最小値は f(-3) = 81 - 108 + 28 = 1\n最小値が 1 > 0 だから、すべての実数 x について x^4 + 4x^3 + 28 > 0'},

/* 問題文から固定のIDを作る。
   添字を使うと問題を1問足したり並べ替えるだけで以降のIDがずれて、
   保存済みの間違い記録が別の問題に付いてしまうため。 */
function qhash(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* すべての問題にIDを付けてフラット化 */
const ALL = [];
TOPICS.forEach(t=>{
  t.qs.forEach(q=>{
    /* IDは各問に書いてある。問題文を直しても記録が迷子にならないようにするため。
       書いていないもの（新しく足した問題）だけ、これまでどおり問題文から作る。 */
    q.id = q.id || (t.id+'-'+qhash(q.q));
    q.topic = t.id;
    q.tname = t.name;
    ALL.push(q);
  });
});
const BYID = {};
ALL.forEach(q=>BYID[q.id]=q);

/* =======================================================================
   数式マークアップ → HTML
   ======================================================================= */
/* a/b を横棒の分数に組み直す。
   1/a^3 の分母は a^3 なので、組み立て済みの <sup>…</sup> や根号のかたまりも
   まとめて分母・分子として拾う。ここを取りこぼすと (1/a)^3 に見えてしまう。 */
const FR_RT  = '<span class="rt">(?:<span class="ri">[^<]*<\\/span>)?&radic;<span class="rb">[^<]*<\\/span><\\/span>';
const FR_TOK = '(?:\\([^()]*\\)|' + FR_RT + '|[0-9a-z.□\\u0001]+)'
             + '(?:<sup>[^<]*<\\/sup>|<sub>[^<]*<\\/sub>)?';
const FR_RE  = new RegExp('('+FR_TOK+')\\/('+FR_TOK+')', 'g');
function fmt(s){
  /* まず KaTeX で組む。読み込めていないときだけ、下の昔の組み方に落ちる。 */
  const k = texHTML(s, esc);
  if(k !== null) return k;
  return fmtOld(s);
}
function fmtOld(s){
  return esc(String(s))
    /* 答えは a^(5/3) のように括弧で書くので、これも上付きとして扱う */
    .replace(/\^\(([^()]*)\)/g,'^{$1}')
    .replace(/√\[(.+?)\]\{(.+?)\}/g,'<span class="rt"><span class="ri">$1</span>&radic;<span class="rb">$2</span></span>')
    .replace(/√\{(.+?)\}/g,'<span class="rt">&radic;<span class="rb">$1</span></span>')
    .replace(/\^\{(.+?)\}/g,'<sup>$1</sup>')
    .replace(/_\{(.+?)\}/g,'<sub>$1</sub>')
    .replace(/\^(-?[0-9a-zA-Z])/g,'<sup>$1</sup>')
    .replace(/_(-?[0-9a-zA-Z])/g,'<sub>$1</sub>')
    .replace(FR_RE, (m,a,b)=>'<span class="fr"><span class="fn">'+a+'</span><span class="fd">'+b+'</span></span>');
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =======================================================================
   解答の正規化と判定
   ======================================================================= */

/* 不等式は向きを裏返しても同じ意味。
   "0<x<8" ⇔ "8>x>0"、"x≧10" ⇔ "10≦x" を機械的に作って照合する。 */
const FLIP = {'<':'>','>':'<','≦':'≧','≧':'≦'};
function flipIneq(s){
  if(!/[<>≦≧]/.test(s)) return s;
  const parts = s.split(/([<>≦≧])/);          // 項と不等号を交互に取り出す
  return parts.reverse().map(p=>FLIP[p]||p).join('');
}

function nz(s){
  let t = String(s==null?'':s);
  t = t.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t = t.replace(/（/g,'(').replace(/）/g,')');
  t = t.replace(/[，、]/g,',').replace(/．/g,'.');
  t = t.replace(/[①②③④⑤]/g, c=>String('①②③④⑤'.indexOf(c)+1));   // 丸数字で答えても通す
  t = t.replace(/[−–—‐ー]/g,'-');
  t = t.replace(/[\s　]/g,'');
  t = t.toLowerCase();
  t = t.replace(/sqrt/g,'√').replace(/cbrt/g,'∛');
  t = t.replace(/log_/g,'log');   // log_2(3) / log2(3) / log_2 3 を同じ形に寄せる
  /* 3乗根は ∛8 とも √[3]{8} とも書ける。n乗根の形に寄せて同じものとして扱う。 */
  t = t.replace(/∛\(([^()]*)\)/g,'√[3]{$1}').replace(/∛([0-9a-z.]+)/g,'√[3]{$1}');
  /* √2 と √{2}、√[3]{8} と √[3]8 のような書き方の揺れも吸収する */
  t = t.replace(/√\[([^\]]+)\]([0-9a-z.]+)/g,'√[$1]{$2}');
  t = t.replace(/√(?!\[|\{)([0-9a-z.]+)/g,'√{$1}');
  t = t.replace(/√\[2\]\{/g,'√{');    // ⁿ√キーで打った √[2]{2} も ただの √2 と同じ
  t = t.replace(/＜/g,'<').replace(/＞/g,'>').replace(/＝/g,'=').replace(/／/g,'/');
  if(t.indexOf(FBAR)>=0) t = unfrac(t);   /* 4⁄1 → 1/4 */
  t = t.replace(/>=|≥/g,'≧').replace(/<=|≤/g,'≦');
  t = t.replace(/[*・×⋅･]/g,'');
  /* 「分の」キーで 3分の1 を打ってから x を足すと 1x/3 になる。
     -1x や 1(x+1) のような「係数の1」は、書いても書かなくても同じものとして扱う。 */
  t = t.replace(/(^|[+\-(,\/])1(?=[a-z(])/g, '$1');
  t = t.replace(/÷/g,'/');
  t = t.replace(/桁$/,'').replace(/位$/,'').replace(/^小数第/,'');
  if(/^[xyn]=/.test(t) && !/[<>≦≧]/.test(t)) t = t.slice(2);
  /* 「x<-1, 2<x」のように解が2つに分かれる答えは、書く順番も
     不等号の向きも人によって違う。各項を裏返しも含めて一意に決めてから並べ直す。 */
  if(t.indexOf(',')>=0){
    t = t.split(',').filter(v=>v!=='').map(v=>{
      const f = flipIneq(v);
      return f<v ? f : v;
    }).sort().join(',');
  }
  return t;
}
function noParen(s){ return s.replace(/[()]/g,''); }

/* 「分の」キーは 分母 → 分子 の順に打つ（4 分の 1 で 1/4）。
   照合や計算のために A⁄B を B/A に直しておく。 */
const FBAR = '⁄';
const CARET = '\u0001';        // 入力欄のカーソル位置を示す目印
const TOKCH = '[0-9a-z.^\u0001]';   // 分数の分母・分子として1かたまりに扱う文字
function tokenL(s, i){          // i の直前にある「ひとかたまり」の開始位置
  if(s[i-1]===')'){
    let d=0;
    for(let j=i-1;j>=0;j--){
      if(s[j]===')') d++;
      else if(s[j]==='('){ d--; if(d===0) return j; }
    }
    return i-1;
  }
  let j=i-1;
  while(j>=0 && new RegExp(TOKCH).test(s[j])) j--;
  return j+1;
}
function tokenR(s, i){          // i の直後にある「ひとかたまり」の終了位置（含まない）
  if(s[i+1]==='('){
    let d=0;
    for(let j=i+1;j<s.length;j++){
      if(s[j]==='(') d++;
      else if(s[j]===')'){ d--; if(d===0) return j+1; }
    }
    return i+2;
  }
  let j=i+1;
  while(j<s.length && new RegExp(TOKCH).test(s[j])) j++;
  return j;
}
function unfrac(t){
  for(let guard=0; guard<40; guard++){
    const i = t.indexOf(FBAR);
    if(i<0) break;
    const a = tokenL(t, i), bEnd = tokenR(t, i);
    const den = t.slice(a, i), num = t.slice(i+1, bEnd);
    if(den==='' || num===''){ t = t.slice(0,i) + '/' + t.slice(i+1); continue; }
    t = t.slice(0,a) + num + '/' + den + t.slice(bEnd);
  }
  return t;
}
function numOf(s){
  const m = /^(-?\d+(?:\.\d+)?)(?:\/(-?\d+(?:\.\d+)?))?$/.exec(s);
  if(!m) return null;
  const d = m[2]!==undefined ? parseFloat(m[2]) : 1;
  if(d===0) return null;
  return parseFloat(m[1])/d;
}
/* 多項式は足す順番を変えても同じ式。x^2-2x と -2x+x^2 のどちらで書いても
   正解になるように、いちばん外側の + と - で項に切り分けて並べ替える。
   かっこや上付きの中にある符号では切らない（x^(n-1) を割らないため）。
   等号・不等号・カンマが入っているものは、順番に意味があるので対象外。 */
function termKey(s){
  if(/[=<>≦≧,]/.test(s)) return null;
  const t = [];
  let d = 0, st = 0, sg = '+', i0 = 0;
  if(s[0]==='+' || s[0]==='-'){ sg = s[0]; i0 = 1; st = 1; }
  for(let i=i0; i<s.length; i++){
    const c = s[i];
    if(c==='(' || c==='{' || c==='[') d++;
    else if(c===')' || c==='}' || c===']') d--;
    else if(d===0 && (c==='+' || c==='-') && '+-*/^_({[,'.indexOf(s[i-1])<0){
      t.push(sg + s.slice(st, i)); sg = c; st = i+1;
    }
  }
  t.push(sg + s.slice(st));
  return t.length > 1 ? t.sort().join('') : null;
}

/* 書き方が違うだけで中身は同じ式、というのを取りこぼさないための保険。
   -3(x-3)^2 と -3x^2+18x-27、4x^2-(1/3)x+2/3 と (12x^2-x+2)/3 のように、
   人によって書き方が分かれるものを、実際に数を入れて計算して見くらべる。
   いくつもの数で必ず一致したときだけ「同じ式」とみなす。
   等号・不等号・カンマが入っているものは値では比べられないので対象外。 */
const EVCH = /^[0-9a-z.+\-\/^()√{}\[\]π]+$/;
const EVPT = [1.31, 1.87, 2.43, 0.57, 3.11, 4.29];

function evalExpr(s, env){
  let i = 0;
  function atom(){
    const c = s[i];
    if(c === undefined) throw 0;
    if(c === '('){ i++; const v = expr(); if(s[i] !== ')') throw 0; i++; return v; }
    if(c === '{'){ i++; const v = expr(); if(s[i] !== '}') throw 0; i++; return v; }
    if(c === '√'){
      i++;
      let n = 2;
      if(s[i] === '['){ i++; n = expr(); if(s[i] !== ']') throw 0; i++; }
      const v = atom();
      if(v < 0 || n === 0) throw 0;
      return Math.pow(v, 1/n);
    }
    if(c === 'π'){ i++; return Math.PI; }
    if(/[0-9.]/.test(c)){
      const st = i;
      while(i < s.length && /[0-9.]/.test(s[i])) i++;
      const v = parseFloat(s.slice(st, i));
      if(isNaN(v)) throw 0;
      return v;
    }
    if(/[a-z]/.test(c)){ i++; if(!(c in env)) throw 0; return env[c]; }
    throw 0;
  }
  function power(){
    const b = atom();
    if(s[i] === '^'){ i++; return Math.pow(b, unary()); }
    return b;
  }
  function unary(){
    if(s[i] === '-'){ i++; return -unary(); }
    if(s[i] === '+'){ i++; return unary(); }
    return power();
  }
  function term(){
    let v = unary();
    for(;;){
      if(s[i] === '/'){ i++; const d = unary(); if(d === 0) throw 0; v /= d; }
      else if(s[i] !== undefined && /[0-9a-z.(√{π]/.test(s[i])) v *= unary();  /* 4x のような省略した掛け算 */
      else break;
    }
    return v;
  }
  function expr(){
    let v = term();
    while(s[i] === '+' || s[i] === '-'){
      const op = s[i]; i++;
      const r = term();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  const out = expr();
  if(i !== s.length || !isFinite(out)) throw 0;
  return out;
}

function letterSet(s){
  const m = s.match(/[a-z]/g);
  return m ? Array.from(new Set(m)).sort().join('') : '';
}

function sameValue(a, b){
  if(!EVCH.test(a) || !EVCH.test(b)) return false;
  const ls = letterSet(a);
  if(ls !== letterSet(b)) return false;      /* 使っている文字が違えば別の式 */
  for(let k = 0; k < EVPT.length; k++){
    const env = {};
    for(let j = 0; j < ls.length; j++) env[ls[j]] = EVPT[k] + (j + 1) * 0.137;
    let va, vb;
    try{ va = evalExpr(a, env); vb = evalExpr(b, env); }catch(e){ return false; }
    if(!(Math.abs(va - vb) <= 1e-7 * Math.max(1, Math.abs(va), Math.abs(vb)))) return false;
  }
  return true;
}

function judge(input, list){
  const a = nz(input);
  if(a==='') return false;
  const av = [a, flipIneq(a)];
  const at = termKey(a);
  for(let i=0;i<list.length;i++){
    const b = nz(list[i]);
    for(let j=0;j<av.length;j++){
      if(av[j]===b) return true;
      if(noParen(av[j])===noParen(b)) return true;
    }
    const bt = termKey(b);
    if(at && bt && (at===bt || noParen(at)===noParen(bt))) return true;
    if(sameValue(a, b)) return true;
    const na=numOf(a), nb=numOf(b);
    if(na!==null && nb!==null && Math.abs(na-nb)<1e-9) return true;
  }
  return false;
}

/* =======================================================================
   学習記録（localStorage）
   ST[qid] = { w: 累計の間違い回数, p: 復習対象フラグ, c: 正解回数 }
   ======================================================================= */
const SKEY = 'explog_stats_v1';
let ST = {};
function loadST(){
  try{
    const r = localStorage.getItem(SKEY);
    ST = r ? JSON.parse(r) : {};
  }catch(e){ ST = {}; }
  if(!ST || typeof ST !== 'object') ST = {};
  /* 差し替えられた問題の記録が残り続けないよう、現在ない問題は捨てる */
  let dropped = false;
  for(const k in ST){
    if(!BYID[k] || !ST[k] || typeof ST[k] !== 'object'){ delete ST[k]; dropped = true; }
  }
  if(dropped) saveST();
}
function saveST(){
  try{ localStorage.setItem(SKEY, JSON.stringify(ST)); }catch(e){}
}
function rec(id){
  if(!ST[id]) ST[id] = {w:0,p:0,c:0};
  return ST[id];
}
function markWrong(id){ const r=rec(id); r.w++; r.p=1; saveST(); }
function markRight(id){ const r=rec(id); r.c++; r.p=0; saveST(); }
function wcount(id){ return ST[id] ? (ST[id].w||0) : 0; }
function isPending(id){ return ST[id] ? ST[id].p===1 : false; }

loadST();

/* =======================================================================
   状態
   ======================================================================= */
const S = {
  mode:'normal',
  shuffle:false,
  topic:null,
  queue:[],
  idx:0,
  okCount:0,
  wrongList:[],
  scored:{},      // このセッションで既に記録した問題
  locked:false    // 判定表示中
};

const $ = id => document.getElementById(id);

/* =======================================================================
   範囲ごとの続き（通常モード）

   同じ範囲をまた選んだとき、前に見ていたところから始められるようにする。
   「続きから」は中断した1件だけを丸ごと戻すもので、こちらは範囲ごとに
   「何問目まで進んだか」だけを覚えておくもの。
   ======================================================================= */
const POSKEY = 'explog_pos_v1';
let POS = {};
function loadPOS(){
  try{ const r = localStorage.getItem(POSKEY); POS = r ? JSON.parse(r) : {}; }catch(e){ POS = {}; }
  if(!POS || typeof POS !== 'object') POS = {};
}
function savePOS(){ try{ localStorage.setItem(POSKEY, JSON.stringify(POS)); }catch(e){} }
/* 並べ替えたときの位置は次に開くと意味が変わるので覚えない */
function posTrackable(){ return S.mode==='normal' && !S.shuffle; }
function setPos(topic, idx){
  if(!topic) return;
  if(idx<=0){ if(POS[topic]!==undefined){ delete POS[topic]; savePOS(); } return; }
  if(POS[topic]===idx) return;
  POS[topic] = idx; savePOS();
}
function getPos(topic, len){
  const v = POS[topic];
  if(typeof v !== 'number' || !(v>0)) return 0;
  return v < len ? v : 0;        /* 問題が減っていたら最初から */
}
function clearPos(topic){ if(POS[topic]!==undefined){ delete POS[topic]; savePOS(); } }
loadPOS();

/* =======================================================================
   出題プール
   ======================================================================= */
function poolOf(topicId, mode){
  let list = SCOPES[topicId] ? scopeList(topicId) : ALL.filter(q=>q.topic===topicId);
  if(mode==='wrong'){
    list = list.filter(q=>isPending(q.id));
    list.sort((a,b)=>wcount(b.id)-wcount(a.id));
  }else if(mode==='freq'){
    list = list.filter(q=>wcount(q.id)>0);
    list.sort((a,b)=>wcount(b.id)-wcount(a.id));
  }
  return list;
}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* =======================================================================
   メニュー描画
   ======================================================================= */
const MODE_NOTE = {
  normal:'すべての問題を順番に出題します。',
  wrong:'間違えたまま「まだ正解していない」問題だけを出題します。正解すると次からは出ません。',
  freq:'これまでに間違えた回数が多い問題から順に出題します。正解しても回数は減りません。'
};

/* 範囲を区分けして並べる（範囲を素通しにすると探しにくいため） */
const GROUPS = [
  {name:'第1節 微分係数と導関数', ids:['tb-vel','tb-lim','tb-def','tb-calc','tb-fval',
                                'tb-var','tb-p1']},
  {name:'第2節 導関数の応用',    ids:['tb-tan','tb-inc','tb-ext','tb-ext4','tb-coef',
                                'tb-max','tb-nsol','tb-pineq','tb-p2']},
  {name:'計算',                ids:['dcalc']},
  {name:'接線・増減',           ids:['dtan','dext']},
  {name:'応用',                ids:['dmax','dapp']}
];

/* 教科書から起こした問題と、こちらで用意した問題は別ものなので、
   まずどれを解くかを選んでもらい、そのあと範囲を選ぶ。
   ここの id は範囲IDの代わりに「まとめて出題」の指定としても使える。 */
const isTB = q => q.topic.indexOf('tb-')===0;
const SIDES = {
  '__tb__'  : {key:'tb',   name:'教科書の問題',   desc:'例・練習・問・例題・節末の問題',
               allName:'教科書の問題すべて', test:isTB},
  '__mine__': {key:'mine', name:'オリジナル問題', desc:'教科書とは別に用意した練習問題',
               allName:'オリジナル問題すべて', test:q=>!isTB(q)}
};
/* 旧バージョンで保存されたセッション（両方まとめて）も開けるように残しておく */
const SCOPES = Object.assign({'__all__':{name:'すべての範囲', test:()=>true}}, SIDES);
function scopeList(id){ return ALL.filter(SCOPES[id].test); }

/* いま選んでいる側。閉じても覚えておく。 */
const SIDEKEY = 'explog_side_v1';
let SIDE = '__tb__';
try{ const v = localStorage.getItem(SIDEKEY); if(SIDES[v]) SIDE = v; }catch(e){}
function setSide(id){ SIDE = id; try{ localStorage.setItem(SIDEKEY, id); }catch(e){} }
function sideOfTopic(id){
  if(SIDES[id]) return id;
  if(id && id.indexOf('tb-')===0) return '__tb__';
  return '__mine__';
}

/* 一度でも正解した問題の割合（範囲ごとの手応えの目安） */
function doneRate(list){
  if(!list.length) return 0;
  let n = 0;
  list.forEach(q=>{ if(ST[q.id] && ST[q.id].c>0) n++; });
  return n/list.length;
}

function renderResume(){
  const box = $('resume');
  const r = readSession();
  if(!r){ box.classList.add('hide'); box.innerHTML=''; return; }
  const t = SCOPES[r.topic] ? SCOPES[r.topic].name : ((TOPICS.find(x=>x.id===r.topic)||{}).name||'');
  box.classList.remove('hide');
  box.innerHTML =
    '<p class="sec">続きから</p>'+
    '<button class="titem rsm" id="resumeBtn">'+
      '<span class="nm"><b>'+esc(t)+'</b><span>'+(r.idx+1)+'問目から再開 ／ 全'+r.ids.length+'問</span></span>'+
      '<span class="rt2"><span class="arw">›</span></span>'+
    '</button>'+
    '<div class="mfoot" style="padding:2px 0 14px"><button class="lnk" id="dropResume">この続きを破棄する</button></div>';
  $('resumeBtn').addEventListener('click', ()=>resumeSession(r));
  $('dropResume').addEventListener('click', ()=>{ clearSession(); renderResume(); });
}

/* 1枚のカードを作る。範囲カードもトップの2枚もこれで作る。
   前に途中でやめている範囲には、右に「途中から」の小さいボタンを添える。
   カード本体を押せば1問目から、そこを押したときだけ続きから。 */
function mkItem(id, name, desc, n, wsum, rate, isAll, onTap, cont){
  const b = document.createElement('button');
  b.className = 'titem' + (isAll?' all':'');
  if(n===0){ b.disabled = true; }
  let badge = '';
  if(!isAll && S.mode!=='normal' && wsum>0) badge = '<span class="badge">×'+wsum+'</span>';
  /* 通常モードでは、一度でも正解した割合を細い線で示す */
  const bar = (rate>0) ? '<span class="mini-bar"><i style="width:'+Math.round(rate*100)+'%"></i></span>' : '';
  b.innerHTML =
    '<span class="nm"><b>'+esc(name)+'</b><span>'+esc(desc)+'</span>'+bar+'</span>'+
    '<span class="rt2">'+badge+'<span class="num">'+n+'</span><span class="arw">›</span></span>';
  b.addEventListener('click', ()=>{ if(n>0) onTap(); });
  if(!cont) return b;

  const row = document.createElement('div');
  row.className = 'trow';
  const c = document.createElement('button');
  c.className = 'tcont';
  c.innerHTML = '<span class="cl">途中から</span><b>'+cont.at+'問目</b>';
  c.setAttribute('aria-label', name+' の続き、'+cont.at+'問目から');
  c.addEventListener('click', cont.onTap);
  row.appendChild(b); row.appendChild(c);
  return row;
}

/* トップ画面 ── 教科書かオリジナルかを選ぶ */
function renderHome(){
  renderResume();
  const st = tally(ALL);
  $('statPeek').textContent = st.tries
    ? '正解済み '+st.done+'/'+st.n + (st.todo? '　要復習 '+st.todo : '')
    : 'まだ記録がありません';
  const box = $('sidelist');
  box.innerHTML = '';
  Object.keys(SIDES).forEach(sid=>{
    const sd = SIDES[sid];
    const list = scopeList(sid);
    const s = tally(list);
    const desc = s.tries
      ? sd.desc+'　正解済み '+s.done+'/'+s.n+(s.todo? '　要復習 '+s.todo : '')
      : sd.desc;
    box.appendChild(mkItem(sid, sd.name, desc, list.length, 0, doneRate(list), false,
      ()=>{ setSide(sid); renderMenu(); show('menu'); }));
  });
}

function renderMenu(){
  const sd = SIDES[SIDE];
  $('sideTtl').textContent = sd.name;
  $('modeNote').textContent = MODE_NOTE[S.mode];
  Array.prototype.forEach.call($('modeSeg').children, b=>{
    b.classList.toggle('on', b.dataset.m===S.mode);
  });
  /* 復習モードは出題順そのものに意味があるのでシャッフルは無効 */
  $('shufBtn').disabled = S.mode!=='normal';
  $('shufBtn').setAttribute('aria-pressed', (S.shuffle && S.mode==='normal')?'true':'false');

  const box = $('tlist');
  box.innerHTML = '';

  const sideN = poolOf(SIDE, S.mode).length;
  $('sideCap').textContent = S.mode==='normal' ? '全'+scopeList(SIDE).length+'問' : sideN+'問';
  if(sideN===0){
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = S.mode==='wrong'
      ? 'この区分に復習が必要な問題はありません。<br>通常モードで問題を解くと、間違えた問題がここに集まります。'
      : 'この区分にはまだ間違えた記録がありません。<br>通常モードで問題を解いてみましょう。';
    box.appendChild(d);
    return;
  }

  const mk = (id, name, desc, n, wsum, rate, isAll)=>{
    /* 前に途中でやめた範囲には「途中から」を添える。押さなければ1問目から。 */
    const at = (S.mode==='normal' && !S.shuffle) ? getPos(id, n) : 0;
    const cont = at>0 ? {at:at+1, onTap:()=>startSession(id)} : null;
    return mkItem(id, name, desc, n, wsum, (S.mode==='normal'?rate:0), isAll,
                  ()=>startSession(id, true), cont);
  };

  /* いちばん上は「この区分をまとめて」 */
  const sideRate = doneRate(scopeList(SIDE));
  box.appendChild(mk(SIDE, sd.allName,
    S.mode==='normal'
      ? '通して演習'+(sideRate>0 ? '　正解済み '+Math.round(sideRate*100)+'%' : '')
      : '対象すべて',
    sideN, 0, 0, true));

  /* この区分に属する区切りだけを出す */
  GROUPS.forEach(g=>{
    const ts = g.ids.map(id=>TOPICS.find(t=>t.id===id))
                    .filter(t=>t && sideOfTopic(t.id)===SIDE);
    if(!ts.length) return;
    const pools = ts.map(t=>poolOf(t.id, S.mode));
    /* 復習モードで対象0の区分は見出しごと出さない */
    if(pools.every(p=>p.length===0)) return;
    const h = document.createElement('p');
    h.className = 'gsec';
    h.textContent = g.name;
    box.appendChild(h);
    ts.forEach((t,i)=>{
      const p = pools[i];
      const wsum = p.reduce((s,q)=>s+wcount(q.id),0);
      const nm = t.name.replace(/^(教科書|チェック)｜/, '');
      box.appendChild(mk(t.id, nm, t.desc, p.length, wsum, doneRate(t.qs), false));
    });
  });
}

/* =======================================================================
   学習状況（ダッシュボード）

   1問は必ず次の3つのどれか1つに入る（重複なし・合計＝問題数）:
     要復習   … p===1（間違えたまま、まだ正解していない）
     正解済み … p===0 かつ c>0
     未着手   … p===0 かつ c===0
   正答率は「解答回数のうち正解だった割合」= Σc / (Σc + Σw)。
   ======================================================================= */
let statSort = 'weak';        // weak: 苦手な順 / order: 出題順

function tally(list){
  let done=0, todo=0, fresh=0, c=0, w=0;
  list.forEach(q=>{
    const r = ST[q.id];
    if(r && r.p===1) todo++;
    else if(r && r.c>0) done++;
    else fresh++;
    if(r){ c += r.c||0; w += r.w||0; }
  });
  const tries = c + w;
  return {n:list.length, done, todo, fresh, c, w, tries,
          acc: tries ? c/tries : null,          // 正答率（未挑戦は null）
          touched: list.length - fresh};
}

function pct(x){ return Math.round(x*100); }

function renderStats(){
  const all = tally(ALL);
  $('stSub').textContent = all.tries ? '解答 '+all.tries+'回' : '';
  const body = $('stBody');
  body.innerHTML = '';

  if(all.tries===0){
    /* 記録が無いときこそ「読み込む」が要るので、持ち出しだけは出しておく */
    body.innerHTML = '<div class="stempty">まだ記録がありません。<br>問題を解くと、範囲ごとの得意・苦手がここに出ます。</div>'+
                     '<p class="sec" style="margin-top:26px">記録の持ち出し</p><div id="bkHost"></div>';
    bkPanel($('bkHost'));
    return;
  }

  /* ヒーロー数値はこの画面に1つだけ。「全問中どれだけ正解済みか」 */
  let html =
    '<div class="hero"><div class="hv">'+pct(all.done/all.n)+'<i>%</i></div>'+
    '<p class="hl">全'+all.n+'問のうち '+all.done+'問を正解済み</p></div>'+
    '<div class="tiles">'+
      '<div class="tile"><span class="tl">解いた問題</span><span class="tv">'+all.touched+'<small>/'+all.n+'</small></span></div>'+
      '<div class="tile"><span class="tl">正答率</span><span class="tv">'+pct(all.acc)+'<small>%</small></span></div>'+
      '<div class="tile"><span class="tl">要復習</span><span class="tv">'+all.todo+'<small>問</small></span></div>'+
    '</div>';

  /* 範囲ごとに集計 */
  const rows = TOPICS.map(t=>({t, s:tally(t.qs)}));
  const played = rows.filter(r=>r.s.tries>0);

  /* いちばん得意・いちばん苦手（挑戦した範囲の中で） */
  if(played.length>=2){
    const byAcc = played.slice().sort((a,b)=>a.s.acc-b.s.acc || b.s.todo-a.s.todo);
    const weak = byAcc[0], strong = byAcc[byAcc.length-1];
    html += '<div class="verdict">'+
      '<div class="vrow bad"><span class="vk">苦手</span><span class="vn">'+esc(weak.t.name)+'</span>'+
        '<span class="vp">正答率 '+pct(weak.s.acc)+'%</span></div>'+
      '<div class="vrow"><span class="vk">得意</span><span class="vn">'+esc(strong.t.name)+'</span>'+
        '<span class="vp">正答率 '+pct(strong.s.acc)+'%</span></div>'+
    '</div>';
  }

  /* 教科書の問題とオリジナル問題は別ものなので、まとめても見えるようにする */
  const sides = [['教科書の問題', scopeList('__tb__')], ['オリジナル問題', scopeList('__mine__')]];
  html += '<p class="sec" style="margin:20px 0 9px">出どころべつ</p>';
  sides.forEach(([nm, list])=>{
    const s = tally(list);
    const seg = (v,cls)=> v>0 ? '<i class="'+cls+'" style="flex:'+v+'"></i>' : '';
    html += '<div class="srow src">'+
      '<span class="sh1"><span class="sn">'+esc(nm)+'</span>'+
        (s.tries ? '<span class="sa">正答率 '+pct(s.acc)+'%</span>'
                 : '<span class="sa none">まだ解いていない</span>')+'</span>'+
      '<span class="sbar">'+seg(s.done,'b1')+seg(s.todo,'b2')+seg(s.fresh,'b3')+'</span>'+
      '<span class="sf"><b>正解済み '+s.done+'</b>'+
        (s.todo? '<span class="w">要復習 '+s.todo+'</span>' : '')+
        (s.fresh? '<span>未着手 '+s.fresh+'</span>' : '')+
        '<span>全'+s.n+'問</span></span>'+
    '</div>';
  });

  html += '<div class="mrow"><p class="sec" style="margin:16px 0 0">範囲べつ</p>'+
    '<div class="seg mini" id="sortSeg" style="width:150px">'+
      '<button data-s="weak"'+(statSort==='weak'?' class="on"':'')+'>苦手な順</button>'+
      '<button data-s="order"'+(statSort==='order'?' class="on"':'')+'>出題順</button>'+
    '</div></div>'+
    '<div class="legend"><span><i class="k1"></i>正解済み</span><span><i class="k2"></i>要復習</span>'+
    '<span><i class="k3"></i>未着手</span></div>';

  /* 苦手な順 = 正答率の低い順。未挑戦の範囲は最後にまとめる。 */
  const sorted = statSort==='order' ? rows : rows.slice().sort((a,b)=>{
    if(a.s.tries===0 && b.s.tries===0) return 0;
    if(a.s.tries===0) return 1;
    if(b.s.tries===0) return -1;
    return a.s.acc-b.s.acc || b.s.todo-a.s.todo;
  });

  sorted.forEach(({t,s})=>{
    const seg = (v,cls)=> v>0 ? '<i class="'+cls+'" style="flex:'+v+'"></i>' : '';
    html += '<button class="srow" data-topic="'+t.id+'">'+
      '<span class="sh1"><span class="sn">'+esc(t.name)+'</span>'+
        (s.tries ? '<span class="sa">正答率 '+pct(s.acc)+'%</span>'
                 : '<span class="sa none">まだ解いていない</span>')+'</span>'+
      '<span class="sbar">'+seg(s.done,'b1')+seg(s.todo,'b2')+seg(s.fresh,'b3')+'</span>'+
      '<span class="sf"><b>正解済み '+s.done+'</b>'+
        (s.todo? '<span class="w">要復習 '+s.todo+'</span>' : '')+
        (s.fresh? '<span>未着手 '+s.fresh+'</span>' : '')+
        (s.w? '<span>間違い計 '+s.w+'回</span>' : '')+'</span>'+
    '</button>';
  });

  /* よく間違える問題 */
  const worst = ALL.filter(q=>wcount(q.id)>0)
                   .sort((a,b)=>wcount(b.id)-wcount(a.id))
                   .slice(0,6);
  if(worst.length){
    html += '<p class="sec" style="margin:22px 0 9px">よく間違える問題</p><div class="wq">';
    worst.forEach(q=>{
      html += '<button class="wqi" data-q="'+q.id+'">'+
        '<span class="h"><span class="q mq">'+fmt(q.q)+'</span><span class="n">×'+wcount(q.id)+'</span></span>'+
        '<span class="t">'+esc(q.tname)+(isPending(q.id)?' ／ まだ正解していません':'')+'</span>'+
        /* 証明問題（自己採点）には照合用の正解がないので、解答だけを見せる */
        '<span class="x hide">'+(q.a ? '正解 '+fmt(q.a[0])+'<br>' : '')+fmt(q.e)+'</span>'+
      '</button>';
    });
    html += '</div>';
  }

  html += '<p class="sec" style="margin-top:26px">記録の持ち出し</p><div id="bkHost"></div>';
  body.innerHTML = html;
  bkPanel($('bkHost'));

  $('sortSeg').addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(!b) return;
    statSort = b.dataset.s;
    renderStats();
  });
  /* 範囲をタップ → その範囲を演習（要復習があれば復習モードで） */
  body.querySelectorAll('.srow[data-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.dataset.topic;
      const s = tally(TOPICS.find(x=>x.id===t).qs);
      S.mode = s.todo>0 ? 'wrong' : 'normal';
      startSession(t);
    });
  });
  /* 問題をタップ → 解説の開閉 */
  body.querySelectorAll('.wqi').forEach(el=>{
    el.addEventListener('click', ()=>el.querySelector('.x').classList.toggle('hide'));
  });
}
