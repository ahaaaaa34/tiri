<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF8">
<meta name="description" content="指数関数・対数関数の演習アプリ。手書きの計算スペースと専用キーボードで、スマホだけで解いて記録できます。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>指数・対数 ｜ 数学II</title>
<style>
  :root{
    --bg:#FAFAF8;
    --bg2:#F3F3F0;
    --card:#FFFFFF;
    --t1:#111111;
    --t2:#555555;
    --t3:#999999;
    --bd:#E0E0DC;
    --bd2:#EEEEEA;
    --err:#8B0000;
    --sh:0 1px 2px rgba(17,17,17,.04);
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--t1);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,system-ui,-apple-system,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    line-height:1.55; font-size:15px;
    overscroll-behavior:none;
  }
  button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
  .app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden}
  .hide{display:none !important}

  /* ---------- 数式表示 ---------- */
  .mq{font-family:"Times New Roman",'Hiragino Mincho ProN',serif; letter-spacing:.01em}
  sup,sub{font-size:.68em; line-height:0}
  sup{vertical-align:.5em} sub{vertical-align:-.28em}
  .rt{white-space:nowrap}
  .rt .ri{font-size:.6em; vertical-align:.62em; margin-right:-.28em}
  .rt .rb{border-top:1px solid currentColor; padding:0 .14em 0 .06em; margin-left:.02em}

  /* ---------- メニュー ---------- */
  #menu{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px calc(40px + var(--safe-b))}
  .mhead{padding:34px 0 22px; text-align:center}
  .mhead h1{margin:0; font-size:25px; font-weight:600; letter-spacing:.06em}
  .mhead .cap{margin:6px 0 0; font-size:12px; color:var(--t3); letter-spacing:.18em}
  .sec{margin:0 0 9px; font-size:11px; color:var(--t3); letter-spacing:.14em; font-weight:600}

  .seg{display:flex; gap:2px; background:var(--bg2); border-radius:11px; padding:3px; margin-bottom:8px}
  .seg button{flex:1; border:0; background:transparent; color:var(--t2); font-size:12.5px; padding:9px 4px; border-radius:8px; letter-spacing:.02em}
  .seg button.on{background:var(--card); color:var(--t1); font-weight:600; box-shadow:var(--sh)}
  .modenote{font-size:11.5px; color:var(--t3); margin:0 0 12px; padding:0 2px; line-height:1.6}
  .toggle{display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:6px 2px; margin-bottom:16px; font-size:13px; color:var(--t2)}
  .toggle .tk{width:38px; height:22px; border-radius:22px; background:var(--bd2); border:1px solid var(--bd); flex:none; position:relative; transition:background .16s, border-color .16s}
  .toggle .tk i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--card); box-shadow:var(--sh); transition:transform .16s}
  .toggle[aria-pressed="true"]{color:var(--t1)}
  .toggle[aria-pressed="true"] .tk{background:var(--t1); border-color:var(--t1)}
  .toggle[aria-pressed="true"] .tk i{transform:translateX(16px)}
  .toggle[disabled]{opacity:.35}

  .tlist{display:flex; flex-direction:column; gap:7px; margin-bottom:22px}
  .gsec{margin:14px 0 -1px; padding-left:2px; font-size:10.5px; color:var(--t3); letter-spacing:.16em; font-weight:600}
  .mrow{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .gsec:first-child{margin-top:6px}
  .titem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--bd); border-radius:13px;
    padding:14px 15px; box-shadow:var(--sh); transition:transform .06s, background .12s;
  }
  .titem:active{transform:scale(.985); background:var(--bg2)}
  .titem .nm{flex:1; min-width:0}
  .titem .nm b{display:block; font-size:15px; font-weight:600; letter-spacing:.01em}
  .titem .nm span{display:block; font-size:11.5px; color:var(--t3); margin-top:2px}
  .titem .rt2{display:flex; align-items:center; gap:9px; flex:none}
  .titem .num{font-size:12px; color:var(--t2); font-variant-numeric:tabular-nums}
  .titem .arw{color:var(--t3); font-size:17px; line-height:1}
  .titem.all{background:var(--t1); border-color:var(--t1); color:var(--card)}
  .titem.all .nm span,.titem.all .num,.titem.all .arw{color:rgba(255,255,255,.62)}
  .titem.all:active{background:#000}
  .titem[disabled]{opacity:.4; box-shadow:none}
  .titem.rsm{border-style:dashed; border-color:var(--bd); margin-bottom:0}
  .mini-bar{display:block; height:2px; background:var(--bd2); border-radius:2px; margin-top:7px; overflow:hidden}
  .mini-bar i{display:block; height:100%; background:var(--t3); border-radius:2px}
  .badge{
    font-size:11px; font-variant-numeric:tabular-nums; color:var(--err);
    border:1px solid rgba(139,0,0,.24); border-radius:20px; padding:1px 7px; background:rgba(139,0,0,.04);
  }
  .empty{border:1px dashed var(--bd); border-radius:13px; padding:26px 16px; text-align:center; color:var(--t3); font-size:12.5px; line-height:1.8}
  .mfoot{display:flex; justify-content:center; padding-top:6px}
  .lnk{background:none; border:0; color:var(--t3); font-size:11.5px; letter-spacing:.06em; text-decoration:underline; text-underline-offset:3px; padding:8px}

  /* ---------- 演習画面 ---------- */
  #play{flex:1; display:flex; flex-direction:column; min-height:0}
  .bar{display:flex; align-items:center; gap:6px; padding:8px 8px 7px; flex:none}
  .ib{
    width:38px; height:38px; flex:none; border:0; background:transparent; border-radius:10px;
    display:flex; align-items:center; justify-content:center; transition:background .12s;
  }
  .ib:active{background:var(--bg2)}
  .ib svg{width:19px; height:19px; stroke:var(--t1); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .ttl{flex:1; text-align:center; min-width:0}
  .ttl b{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ttl span{display:block; font-size:10.5px; color:var(--t3); font-variant-numeric:tabular-nums; letter-spacing:.06em; margin-top:1px}
  .prog{height:2px; background:var(--bd2); flex:none}
  .prog i{display:block; height:100%; background:var(--t1); width:0; transition:width .28s ease}

  .qbox{
    flex:none; display:block; width:auto; text-align:left;
    margin:11px 12px 0; background:var(--card); border:1px solid var(--bd);
    border-radius:13px; padding:12px 14px; box-shadow:var(--sh);
    max-height:26vh; overflow-y:auto; transition:padding .16s;
  }
  .qbox .lb{font-size:10px; color:var(--t3); letter-spacing:.16em; margin-bottom:5px; display:flex; gap:8px; align-items:center}
  .qbox .lb .wc{color:var(--err); letter-spacing:.02em}
  .qbox .lb .fold{margin-left:auto; letter-spacing:.04em; text-decoration:underline; text-underline-offset:2px}
  .qbox .qt{display:block; font-size:17px; line-height:1.75; word-break:break-word}
  .qbox .gv{display:block; font-size:11.5px; color:var(--t2); margin-top:7px; padding-top:7px; border-top:1px solid var(--bd2)}
  .qbox .gv.hide{display:none !important}
  /* たたんだ状態: 1行だけ見せて計算スペースを広げる */
  .qbox.fold{padding:7px 14px 8px; overflow:hidden}
  .qbox.fold .lb{margin-bottom:2px}
  .qbox.fold .qt{
    font-size:14px; line-height:1.5; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .qbox.fold .gv{display:none}

  .tools{display:flex; align-items:center; gap:4px; padding:9px 12px 7px; flex:none}
  .tb{
    height:36px; min-width:44px; padding:0 11px; border:1px solid var(--bd); background:var(--card);
    border-radius:9px; display:flex; align-items:center; justify-content:center; gap:5px; box-shadow:var(--sh);
    transition:background .12s, border-color .12s;
  }
  .tb svg{width:17px; height:17px; stroke:var(--t1); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .tb.on{background:var(--t1); border-color:var(--t1)}
  .tb.on svg{stroke:var(--card)}
  .tb:disabled{opacity:.32}
  .tb:active{background:var(--bg2)}
  .tb.on:active{background:#000}
  .tsp{flex:1}

  .padwrap{flex:1; min-height:0; margin:0 12px; position:relative}
  #pad{
    position:absolute; inset:0; width:100%; height:100%;
    background:var(--card); border:1px solid var(--bd); border-radius:13px;
    box-shadow:var(--sh); touch-action:none; display:block;
  }
  .padhint{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:var(--t3); font-size:12px; letter-spacing:.1em; pointer-events:none;
    transition:opacity .2s;
  }
  .padhint small{display:block; font-size:10.5px; letter-spacing:.04em; margin-top:6px; opacity:.75}
  .foot{flex:none; padding:11px 12px calc(11px + var(--safe-b))}
  .pbtn{
    width:100%; height:50px; border:0; border-radius:13px; background:var(--t1); color:var(--card);
    font-size:15px; font-weight:600; letter-spacing:.08em; transition:transform .06s, opacity .12s;
  }
  .pbtn:active{transform:scale(.985); opacity:.86}
  .pbtn.ghost{background:var(--card); color:var(--t1); border:1px solid var(--bd); box-shadow:var(--sh)}

  /* ---------- 学習状況（ダッシュボード） ----------
     3つの状態は色だけに頼らせない。凡例を必ず出し、各行に実数を併記する。
     「未着手」の #EEEEEA は白地とのコントラストが低い（1.13:1）ため、
     数値ラベルで内容が伝わるようにしている。 */
  .statlink{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--bd); border-radius:13px;
    padding:12px 15px; box-shadow:var(--sh); margin-bottom:18px; font-size:14px;
  }
  .statlink:active{background:var(--bg2)}
  .statlink .sl{font-weight:600; flex:none}
  .statlink .sr{flex:1; text-align:right; font-size:11.5px; color:var(--t3); font-variant-numeric:tabular-nums}
  .statlink .arw{color:var(--t3); font-size:17px; line-height:1; flex:none}

  #stats{flex:1; display:flex; flex-direction:column; min-height:0}
  .stbody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px calc(36px + var(--safe-b))}

  .hero{text-align:center; padding:22px 0 6px}
  .hero .hv{font-size:52px; font-weight:600; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .hero .hv i{font-style:normal; font-size:22px; color:var(--t3); margin-left:1px}
  .hero .hl{margin:8px 0 0; font-size:12px; color:var(--t2); letter-spacing:.04em}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:18px 0 6px}
  .tile{background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:11px 10px; box-shadow:var(--sh)}
  .tile .tl{font-size:10px; color:var(--t3); letter-spacing:.08em; display:block}
  .tile .tv{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:3px; display:block}
  .tile .tv small{font-size:11px; color:var(--t3); font-weight:400; margin-left:1px}

  .verdict{display:flex; flex-direction:column; gap:7px; margin:16px 0 6px}
  .vrow{display:flex; align-items:baseline; gap:10px; background:var(--card); border:1px solid var(--bd);
        border-radius:11px; padding:10px 13px; box-shadow:var(--sh); font-size:13px}
  .vrow .vk{font-size:10.5px; color:var(--t3); letter-spacing:.1em; flex:none; width:52px}
  .vrow .vn{flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .vrow .vp{font-variant-numeric:tabular-nums; color:var(--t2); flex:none; font-size:12px}
  .vrow.bad .vp{color:var(--err)}

  .legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin:10px 2px 12px; font-size:11px; color:var(--t2)}
  .legend span{display:flex; align-items:center; gap:6px}
  .legend i{width:10px; height:10px; border-radius:3px; flex:none}
  .legend .k1{background:var(--t1)} .legend .k2{background:var(--err)} .legend .k3{background:var(--bd2)}

  .srow{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd);
    border-radius:12px; padding:11px 13px 12px; box-shadow:var(--sh); margin-bottom:7px;
  }
  .srow:active{background:var(--bg2)}
  .srow .sh1{display:flex; align-items:baseline; gap:8px}
  .srow .sn{flex:1; font-size:14px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .srow .sa{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--t2); flex:none}
  .srow .sa.none{color:var(--t3); font-size:11px}
  /* 積み上げ棒: セグメントの間は 2px の余地（背景＝白）で分ける */
  .sbar{display:flex; gap:2px; height:9px; margin:8px 0 6px}
  .sbar i{border-radius:4px; min-width:0}
  .sbar .b1{background:var(--t1)} .sbar .b2{background:var(--err)} .sbar .b3{background:var(--bd2)}
  .srow .sf{display:flex; gap:12px; font-size:10.5px; color:var(--t3); font-variant-numeric:tabular-nums}
  .srow .sf b{font-weight:400; color:var(--t2)}
  .srow .sf .w{color:var(--err)}

  .wq{display:flex; flex-direction:column; gap:7px}
  .wqi{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd);
    border-left:2px solid var(--err); border-radius:11px; padding:10px 13px; box-shadow:var(--sh);
  }
  .wqi:active{background:var(--bg2)}
  .wqi .h{display:flex; align-items:baseline; gap:9px}
  .wqi .q{flex:1; font-size:13.5px; line-height:1.6; min-width:0}
  .wqi .n{flex:none; font-size:11px; color:var(--err); font-variant-numeric:tabular-nums}
  .wqi .t{font-size:10.5px; color:var(--t3); margin-top:3px; display:block}
  .wqi .x{display:block; font-size:12px; color:var(--t2); line-height:1.8; margin-top:8px; padding-top:8px; border-top:1px solid var(--bd2)}
  .wqi .x.hide{display:none !important}

  .stempty{border:1px dashed var(--bd); border-radius:13px; padding:34px 18px; text-align:center;
           color:var(--t3); font-size:12.5px; line-height:1.9; margin-top:20px}

  /* ---------- 結果画面 ---------- */
  #done{flex:1; overflow-y:auto; padding:0 18px calc(28px + var(--safe-b))}
  .dhead{text-align:center; padding:40px 0 26px}
  .dhead .sc{font-size:44px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .dhead .sc i{font-style:normal; font-size:19px; color:var(--t3); margin-left:2px}
  .dhead p{margin:6px 0 0; font-size:12px; color:var(--t3); letter-spacing:.12em}
  .wlist{display:flex; flex-direction:column; gap:7px; margin-bottom:24px}
  .witem{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd);
    border-left:2px solid var(--err); border-radius:11px; padding:11px 13px; box-shadow:var(--sh);
    transition:background .12s;
  }
  .witem:active{background:var(--bg2)}
  .witem .q{display:block; font-size:14px; line-height:1.7}
  .witem .q .wg{font-size:11px; color:var(--t3); margin-left:3px}
  .witem .a{font-size:11.5px; color:var(--t2); margin-top:4px; display:flex; align-items:baseline; gap:6px}
  .witem .a b{color:var(--t1); font-weight:600}
  .witem .a .more{margin-left:auto; color:var(--t3); text-decoration:underline; text-underline-offset:3px; flex:none}
  .witem .wexp{display:block; font-size:12px; color:var(--t2); line-height:1.8; margin-top:9px; padding-top:9px; border-top:1px solid var(--bd2)}
  .witem .wexp.hide{display:none !important}
  .dbtns{display:flex; flex-direction:column; gap:8px}

  /* ---------- シート ---------- */
  .back{position:fixed; inset:0; background:rgba(17,17,17,.28); opacity:0; pointer-events:none; transition:opacity .22s; z-index:40}
  .back.on{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg); border-top:1px solid var(--bd);
    border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(17,17,17,.08);
    transform:translateY(102%); transition:transform .26s cubic-bezier(.22,.68,.3,1);
    padding-bottom:var(--safe-b); max-height:92vh; max-height:92dvh; display:flex; flex-direction:column;
  }
  .sheet.on{transform:translateY(0)}
  .grip{width:34px; height:4px; background:var(--bd); border-radius:4px; margin:9px auto 4px; flex:none}
  .sh{padding:6px 16px 10px; display:flex; align-items:center; gap:10px; flex:none}
  .sh b{flex:1; font-size:12.5px; letter-spacing:.1em; color:var(--t2); font-weight:600}
  .sh .lnk{padding:4px 2px}
  /* 小さい端末では項目がシートに収まらないのでここをスクロールさせる（min-height:0 は保険） */
  .slist{padding:0 12px 14px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch}
  .sitem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0;
    background:transparent; border-radius:11px; padding:14px 12px; font-size:14.5px; transition:background .12s;
  }
  .sitem:active{background:var(--bg2)}
  .sitem svg{width:18px; height:18px; flex:none; stroke:var(--t2); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .sitem.dg{color:var(--err)} .sitem.dg svg{stroke:var(--err)}
  .sitem .sd{display:block; font-size:11px; color:var(--t3); margin-top:1px}
  .sitem .sw{flex:1; min-width:0}
  .sitem:disabled{opacity:.32}
  .shr{height:1px; background:var(--bd2); margin:6px 12px}
  .prow{display:flex; align-items:center; gap:12px; padding:6px 12px 4px}
  .prow .pl{flex:1; font-size:14.5px}
  .seg.mini{margin:0; width:168px; flex:none}
  .seg.mini button{font-size:12.5px; padding:7px 4px}

  /* ---------- 解答入力 ---------- */
  .ansq{padding:0 14px 8px; font-size:13px; color:var(--t2); line-height:1.7; flex:none}
  .field{
    margin:0 12px 4px; background:var(--card); border:1px solid var(--bd); border-radius:11px;
    min-height:52px; padding:13px 14px; font-size:19px; line-height:1.4; box-shadow:var(--sh);
    word-break:break-all; flex:none; font-family:"Times New Roman",serif;
  }
  .field.err{border-color:var(--err)}
  .field.jp{font-family:inherit; font-size:16px}
  .field .ph{color:var(--t3); font-size:14px; font-family:inherit}
  .caret{display:inline-block; width:1.5px; height:1.05em; background:var(--t1); vertical-align:-.18em; margin:0 .5px; animation:bl 1.05s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .hintline{font-size:11px; color:var(--t3); padding:2px 16px 8px; flex:none; letter-spacing:.02em;
            display:flex; align-items:baseline; gap:10px}
  .hintline #hintLine{flex:1; min-width:0}
  .hintline .lnk{padding:2px 0; flex:none; font-size:11px}
  /* 入力の読み取り結果 */
  .prev{margin:5px 12px 0; padding:6px 12px 7px; display:flex; align-items:baseline; gap:9px; flex:none}
  .prev .pl{font-size:10px; color:var(--t3); letter-spacing:.1em; flex:none}
  .prev .pv{font-size:17px; color:var(--t1); word-break:break-all}
  .prev.todo .pl{color:var(--err)}
  .prev .ar{display:inline-block; border:1px solid var(--err); border-radius:4px; padding:0 4px; margin-right:2px; font-size:11px}
  /* 埋めるべき □ は入力欄でもプレビューでも目立たせる */
  .bx{display:inline-block; min-width:.72em; padding:0 .06em; border:1px dashed var(--err);
      border-radius:3px; color:var(--err); line-height:1.15; text-align:center}
  /* シートの中身も縦フレックスにして、はみ出す要素だけ縮む／スクロールできるようにする */
  #ansInput{display:flex; flex-direction:column; min-height:0}
  /* 書き方の早見表（キーボードの場所に出す） */
  .how{margin:2px 12px 10px; padding:12px 14px; background:var(--bg2); border:0; border-radius:12px;
       flex:none; text-align:left; display:grid; grid-template-columns:repeat(2,1fr); gap:9px 14px;
       overflow-y:auto; min-height:0}
  .how > span{display:flex; align-items:baseline; gap:9px; font-size:12px; min-width:0}
  .how b{font-family:"Times New Roman",serif; font-size:15px; font-weight:400; flex:none; min-width:48px}
  .how > span > span{color:var(--t3); font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
            overflow:hidden; text-overflow:ellipsis}
  .how .hb{grid-column:1/-1; justify-content:center; color:var(--t3); font-size:10.5px;
           letter-spacing:.08em; padding-top:3px; border-top:1px solid var(--bd); margin-top:1px}

  .kb{padding:2px 6px 8px; flex:none; display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
  .k{
    height:44px; border:1px solid var(--bd); background:var(--card); border-radius:9px;
    font-size:17px; display:flex; align-items:center; justify-content:center; box-shadow:var(--sh);
    font-family:"Times New Roman",serif; transition:background .08s, transform .05s; user-select:none;
  }
  .k:active{background:var(--bg2); transform:scale(.95)}
  .k.fn{background:var(--bg2); font-size:14px; font-family:inherit; color:var(--t2); box-shadow:none}
  .k.fn:active{background:var(--bd2)}
  .k.fn svg{width:17px; height:17px; stroke:var(--t2); stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .k.go{grid-column:span 2; background:var(--t1); border-color:var(--t1); color:var(--card); font-size:14.5px; font-weight:600; font-family:inherit; letter-spacing:.08em}
  .k.go:active{background:#000}
  .k .sm{font-size:12px}

  /* 記号で書けない答え（増加/減少・対称の軸など）は選択式にする */
  .chbox{padding:2px 12px 10px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; min-height:0}
  .ch{
    min-height:50px; padding:12px 16px; text-align:left; border:1px solid var(--bd);
    background:var(--card); border-radius:11px; font-size:15px; box-shadow:var(--sh);
    display:flex; align-items:center; gap:11px; transition:background .12s, border-color .12s;
  }
  .ch::before{
    content:''; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--bd2);
    flex:none; transition:border-color .12s, box-shadow .12s;
  }
  .ch:active{background:var(--bg2)}
  .ch.on{border-color:var(--t1)}
  .ch.on::before{border-color:var(--t1); border-width:5px}

  /* ---------- 判定 ---------- */
  .res{padding:14px 16px 18px; overflow-y:auto}
  .rq{font-size:14px; color:var(--t2); line-height:1.7; padding-bottom:11px; margin-bottom:12px; border-bottom:1px solid var(--bd2)}
  .rq .rg{font-size:11.5px; color:var(--t3); margin-left:4px}
  .rsub{font-size:11.5px; color:var(--t3); margin-top:5px}
  .proof{font-size:14px; line-height:1.95; color:var(--t1); white-space:pre-line}
  .selfask{font-size:11.5px; color:var(--t3); margin-top:11px; text-align:center; letter-spacing:.04em}
  .rmark{display:flex; align-items:center; gap:9px; font-size:19px; font-weight:600; letter-spacing:.06em}
  .rmark svg{width:22px; height:22px; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .rmark.ok{color:var(--t1)} .rmark.ok svg{stroke:var(--t1)}
  .rmark.ng{color:var(--err)} .rmark.ng svg{stroke:var(--err)}
  .rmark.sk{color:var(--t2)} .rmark.sk svg{stroke:var(--t2); fill:var(--t2)}
  .ryour{font-size:12px; color:var(--t3); margin-top:8px}
  .ryour b{color:var(--err); font-weight:400; font-family:"Times New Roman",serif; font-size:14px}
  .rans{
    margin-top:12px; background:var(--card); border:1px solid var(--bd); border-radius:11px;
    padding:12px 14px; box-shadow:var(--sh);
  }
  .rans .lb{font-size:10px; color:var(--t3); letter-spacing:.16em; margin-bottom:4px}
  .rans .va{font-size:19px; font-family:"Times New Roman",serif}
  .rexp{margin-top:10px; font-size:12.5px; color:var(--t2); line-height:1.85; padding:0 2px}
  .rbtns{display:flex; gap:8px; margin-top:16px}
  .rbtns .pbtn{flex:1}

  .cmsg{padding:2px 18px 18px; font-size:14px; line-height:1.8; color:var(--t2)}

  /* ---------- 横向き・画面が低いとき ----------
     6段のままだと決定キーが画面の外に出てしまうので、
     横幅を使って12列3段に組み替え、余白も詰める。 */
  @media (max-height:520px){
    .mhead{padding:22px 0 16px}
    .bar{padding:4px 8px}
    .ib{width:34px; height:34px}
    .qbox{margin-top:8px; padding:9px 13px; max-height:34vh}
    .qbox .qt{font-size:16px}
    .tools{padding:7px 12px 6px}
    .tb{height:32px}
    .foot{padding:8px 12px calc(8px + var(--safe-b))}
    .pbtn{height:44px}
    .sh{padding:2px 16px 6px}
    .ansq{padding-bottom:5px}
    .field{min-height:44px; padding:10px 14px; font-size:18px}
    .hintline{padding-bottom:5px}
    .k{height:38px; font-size:16px}
    .prev{margin-top:2px; padding:3px 12px 4px}
    .prev .pv{font-size:15px}
    .how{margin:0 12px 8px; padding:9px 12px; gap:6px 12px}
    .how b{font-size:14px; min-width:44px}
    .ch{min-height:40px; padding:8px 14px; font-size:14px}
    .ch::before{width:15px; height:15px}
    .chbox{gap:5px; padding-bottom:8px}
    .res{padding:10px 16px 14px}
    .rq{padding-bottom:8px; margin-bottom:9px}
  }
  /* 極端に低い画面（小型端末の横向き）は、あると入り切らないものを削る */
  @media (max-height:365px){
    .prev{display:none !important}
    .how{max-height:132px; gap:5px 12px; padding:8px 12px}
    .how .hb{display:none}
    .ansq{font-size:12px}
  }
  @media (max-height:520px) and (min-width:560px){
    .kb{grid-template-columns:repeat(12,1fr)}
    .chbox{display:grid; grid-template-columns:repeat(2,1fr)}
    .chbox .pbtn{grid-column:span 2; margin-top:0 !important}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ========== メニュー ========== -->
  <div id="menu">
    <div class="mhead">
      <h1>指数・対数</h1>
      <p class="cap">数学 II</p>
    </div>

    <button class="statlink" id="statBtn">
      <span class="sl">学習状況を見る</span>
      <span class="sr" id="statPeek"></span>
      <span class="arw">›</span>
    </button>

    <div id="resume" class="hide"></div>

    <p class="sec">出題モード</p>
    <div class="seg" id="modeSeg">
      <button data-m="normal" class="on">通常</button>
      <button data-m="wrong">間違えた問題</button>
      <button data-m="freq">間違い回数順</button>
    </div>
    <p class="modenote" id="modeNote"></p>

    <button class="toggle" id="shufBtn" aria-pressed="false">
      <span class="tk"><i></i></span>
      <span>順番をシャッフルする</span>
    </button>

    <p class="sec">範囲</p>
    <div class="tlist" id="tlist"></div>

    <div class="mfoot"><button class="lnk" id="resetAll">学習記録をすべて消去</button></div>
  </div>

  <!-- ========== 演習 ========== -->
  <div id="play" class="hide">
    <div class="bar">
      <button class="ib" id="backBtn" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b id="pTitle"></b><span id="pCount"></span></div>
      <button class="ib" id="menuBtn" aria-label="メニュー">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="prog"><i id="progBar"></i></div>

    <!-- button の中身は phrasing content でないといけないので span を block 表示にする -->
    <button class="qbox" id="qBox" aria-expanded="true">
      <span class="lb"><span id="qLabel">問題</span><span class="wc" id="qWrong"></span><span class="fold" id="qFold">たたむ</span></span>
      <span class="qt mq" id="qText"></span>
      <span class="gv hide" id="qGiven"></span>
    </button>

    <div class="tools">
      <button class="tb on" id="tPen" aria-label="ペン">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 10-3-3L5 16l-1 4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <button class="tb" id="tEra" aria-label="消しゴム">
        <svg viewBox="0 0 24 24"><path d="M8.5 19.5H20"/><path d="M15.5 4.5l4 4a1.5 1.5 0 010 2.2l-8 8H7l-3-3a1.5 1.5 0 010-2.2l9.3-9a1.5 1.5 0 012.2 0z"/></svg>
      </button>
      <div class="tsp"></div>
      <button class="tb" id="tUndo" aria-label="元に戻す">
        <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="tb" id="tRedo" aria-label="やり直す">
        <svg viewBox="0 0 24 24"><path d="M15 14l4-4-4-4"/><path d="M19 10h-9a5 5 0 000 10h3"/></svg>
      </button>
      <button class="tb" id="tClr" aria-label="全消去">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 12h9l1-12"/></svg>
      </button>
    </div>

    <div class="padwrap">
      <canvas id="pad"></canvas>
      <div class="padhint" id="padHint">
        計算スペース
        <small>2本指でタップすると1つ戻せます</small>
      </div>
    </div>

    <div class="foot">
      <button class="pbtn" id="ansBtn">解答する</button>
    </div>
  </div>

  <!-- ========== 学習状況（ダッシュボード） ========== -->
  <div id="stats" class="hide">
    <div class="bar">
      <button class="ib" id="stBack" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b>学習状況</b><span id="stSub"></span></div>
      <span class="ib"></span>
    </div>
    <div class="stbody" id="stBody"></div>
  </div>

  <!-- ========== 結果 ========== -->
  <div id="done" class="hide">
    <div class="dhead">
      <div class="sc" id="dScore"></div>
      <p id="dSub"></p>
    </div>
    <div id="dWrongWrap" class="hide">
      <p class="sec">間違えた問題</p>
      <div class="wlist" id="dWrong"></div>
    </div>
    <div class="dbtns" id="dBtns"></div>
  </div>
</div>

<!-- ========== オーバーレイ ========== -->
<div class="back" id="back"></div>

<!-- 解答シート -->
<div class="sheet" id="ansSheet">
  <div class="grip"></div>
  <div id="ansInput">
    <div class="sh">
      <b>解答を入力</b>
      <button class="lnk" id="peekBtn">計算を見る</button>
      <button class="lnk" id="clrIn">全消去</button>
    </div>
    <div class="ansq mq" id="ansQ"></div>
    <div class="field" id="field"></div>
    <!-- 打った文字が数式としてどう読まれるかをその場で見せる -->
    <div class="prev hide" id="prev"><span class="pl" id="prevLabel">こう読まれます</span><span class="pv mq" id="prevBody"></span></div>
    <div class="hintline">
      <span id="hintLine"></span>
      <button class="lnk" id="howBtn" aria-expanded="false">書き方 ▾</button>
    </div>
    <div class="kb" id="kb"></div>
    <!-- 早見表はキーボードと入れ替えて出す（積み上げると決定キーが画面外に出るため） -->
    <button class="how hide" id="how">
      <span><b>2<sup>3</sup></b><span>2^3</span></span>
      <span><b>2<sup>1/3</sup></b><span>2^(1/3)</span></span>
      <span><b><span class="rt">&radic;<span class="rb">2</span></span></b><span>√2</span></span>
      <span><b>4<span class="rt">&radic;<span class="rb">2</span></span></b><span>4√2</span></span>
      <span><b>log<sub>2</sub>3</b><span>log → 2 → → → 3</span></span>
      <span><b>log<sub>10</sub>5</b><span>log → 1 0 → → → 5</span></span>
      <span><b><span class="rt"><span class="ri">3</span>&radic;<span class="rb">7</span></span></b><span>&#8319;&radic; → 3 → → → 7</span></span>
      <span><b>3&frasl;2</b><span>3/2</span></span>
      <span class="hb">タップでキーボードに戻る</span>
    </button>
    <div class="chbox hide" id="choices"></div>
  </div>
  <div class="res hide" id="ansRes"></div>
</div>

<!-- メニューシート -->
<div class="sheet" id="menuSheet">
  <div class="grip"></div>
  <div class="sh"><b>メニュー</b></div>
  <div class="slist">
    <div class="prow">
      <span class="pl">ペンの太さ</span>
      <div class="seg mini" id="penSeg">
        <button data-w="1.6">細</button>
        <button data-w="2.2" class="on">中</button>
        <button data-w="3.4">太</button>
      </div>
    </div>
    <div class="shr"></div>
    <button class="sitem" data-act="prev" id="mPrev">
      <svg viewBox="0 0 24 24"><path d="M18 19l-9-7 9-7z"/><path d="M6 5v14"/></svg>
      <span class="sw">前の問題に戻る<span class="sd">書いた計算はそのまま残ります</span></span>
    </button>
    <button class="sitem" data-act="retry">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M19 9a7.5 7.5 0 00-13-3L4 8"/><path d="M5 15a7.5 7.5 0 0013 3l2-2"/></svg>
      <span class="sw">この問題をやり直す<span class="sd">計算スペースと入力を消去</span></span>
    </button>
    <button class="sitem" data-act="clear">
      <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 12h9l1-12"/></svg>
      <span class="sw">計算スペースを消す</span>
    </button>
    <button class="sitem" data-act="skip">
      <svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>
      <span class="sw">スキップ<span class="sd">記録に残さず次の問題へ</span></span>
    </button>
    <button class="sitem dg" data-act="reveal">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span class="sw">答えを見る<span class="sd">不正解として記録されます</span></span>
    </button>
    <div class="shr"></div>
    <button class="sitem" data-act="restart">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M19 9a7.5 7.5 0 00-13-3L4 8"/><path d="M20 20v-6h-6"/><path d="M5 15a7.5 7.5 0 0013 3l2-2"/></svg>
      <span class="sw">最初からやり直す</span>
    </button>
    <button class="sitem" data-act="home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
      <span class="sw">メニューに戻る<span class="sd">続きから再開できます</span></span>
    </button>
  </div>
</div>

<!-- 確認シート -->
<div class="sheet" id="confSheet">
  <div class="grip"></div>
  <div class="sh"><b id="confTtl">確認</b></div>
  <p class="cmsg" id="confMsg"></p>
  <div class="slist">
    <button class="sitem dg" id="confYes"><span class="sw" id="confYesTx">はい</span></button>
    <button class="sitem" id="confNo"><span class="sw">キャンセル</span></button>
  </div>
</div>

<script>
"use strict";

/* =======================================================================
   問題データ
   q   : 問題文（^{} _{} √{} √[n]{} のマークアップが使える）
   g   : 前提として与えられる値（任意）
   a   : 正解として受理する表記の配列
   h   : 入力欄に出すヒント
   e   : 解説
   ======================================================================= */
const TOPICS = [
{
  id:'law', name:'指数法則', desc:'整数の指数・基本計算',
  qs:[
    {q:'2^3 × 2^4', a:['2^7','128'], h:'例: 2^7 または 128', e:'底が同じ積は指数を足す。2^{3+4}=2^7=128'},
    {q:'(3^2)^3', a:['3^6','729'], h:'例: 3^6 または 729', e:'(a^m)^n = a^{mn} より 3^{2×3}=3^6=729'},
    {q:'5^7 ÷ 5^4', a:['5^3','125'], h:'例: 5^3 または 125', e:'底が同じ商は指数を引く。5^{7-4}=5^3=125'},
    {q:'2^5 × 2^{-3}', a:['2^2','4'], h:'例: 4', e:'2^{5+(-3)}=2^2=4'},
    {q:'3^{-2}', a:['1/9'], h:'分数で。例: 1/9', e:'a^{-n}=1/a^n より 1/3^2=1/9'},
    {q:'(1/2)^{-3}', a:['8'], h:'例: 8', e:'(1/2)^{-3}=2^3=8。逆数にして符号を正に。'},
    {q:'10^{-3}', a:['1/1000','0.001'], h:'分数か小数で', e:'10^{-3}=1/10^3=1/1000=0.001'},
    {q:'7^0 + 7^{-1}', a:['8/7'], h:'分数で。例: 8/7', e:'7^0=1、7^{-1}=1/7 なので 1+1/7=8/7'},
    {q:'(-2)^4 × (-2)^{-2}', a:['4'], h:'例: 4', e:'(-2)^{4-2}=(-2)^2=4'},
    {q:'(2^3)^2 ÷ 2^4', a:['4','2^2'], h:'例: 4', e:'2^6÷2^4=2^2=4'},
    {q:'(a^2 b^3)^2', a:['a^4b^6'], h:'例: a^3b^2 の形で', e:'各因数を2乗して a^{4}b^{6}'},
    {q:'a^5 ÷ a^{-2}', a:['a^7'], h:'例: a^7', e:'a^{5-(-2)}=a^7'}
  ]
},
{
  id:'root', name:'累乗根と有理数の指数', desc:'n乗根・分数の指数',
  qs:[
    {q:'√[3]{8}', a:['2'], h:'例: 2', e:'2^3=8 なので 3乗根は 2'},
    {q:'√[3]{-27}', a:['-3'], h:'例: -3', e:'(-3)^3=-27。奇数乗根は負の数もとれる。'},
    {q:'8^{1/3}', a:['2'], h:'例: 2', e:'a^{1/n}=√[n]{a} より 8^{1/3}=√[3]{8}=2'},
    {q:'8^{2/3}', a:['4'], h:'例: 4', e:'8^{2/3}=(8^{1/3})^2=2^2=4'},
    {q:'9^{3/2}', a:['27'], h:'例: 27', e:'(9^{1/2})^3=3^3=27'},
    {q:'32^{2/5}', a:['4'], h:'例: 4', e:'32=2^5 なので (2^5)^{2/5}=2^2=4'},
    {q:'16^{-3/4}', a:['1/8'], h:'分数で。例: 1/8', e:'16=2^4 → (2^4)^{-3/4}=2^{-3}=1/8'},
    {q:'27^{-2/3}', a:['1/9'], h:'分数で。例: 1/9', e:'27=3^3 → 3^{-2}=1/9'},
    {q:'√[3]{2} × √[3]{4}', a:['2'], h:'例: 2', e:'√[3]{2×4}=√[3]{8}=2'},
    {q:'(√{3})^6', a:['27'], h:'例: 27', e:'(3^{1/2})^6=3^3=27'},
    {q:'√[4]{9}', a:['√3','3^(1/2)'], h:'例: √3', e:'9^{1/4}=(3^2)^{1/4}=3^{1/2}=√3'},
    {q:'√{2} × √[3]{2} を 2^k の形で', a:['2^(5/6)','2^5/6'], h:'例: 2^(5/6)', e:'2^{1/2}×2^{1/3}=2^{1/2+1/3}=2^{5/6}'},
    {q:'(2^{1/2} × 2^{1/4})^4', a:['8','2^3'], h:'例: 8', e:'(2^{3/4})^4=2^3=8'},
    {q:'√[3]{√{64}}', a:['2'], h:'例: 2', e:'√64=8、√[3]{8}=2。64^{1/6}=2 でもよい。'}
  ]
},
{
  id:'eeq', name:'指数方程式', desc:'両辺を同じ底にそろえる',

/* 問題文から固定のIDを作る。
   添字を使うと問題を1問足したり並べ替えるだけで以降のIDがずれて、
   保存済みの間違い記録が別の問題に付いてしまうため。 */
function qhash(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* すべての問題にIDを付けてフラット化 */

TOPICS.forEach(t=>{
  t.qs.forEach(q=>{
    q.id = t.id+'-'+qhash(q.q);
    q.topic = t.id;
    q.tname = t.name;
    ALL.push(q);
  });
});
const BYID = {};

/* =======================================================================
   数式マークアップ → HTML
   ======================================================================= */
function fmt(s){
  /* 先に &, <, > をエスケープしてから数式マークアップを展開する。
     こうしないと "0<x<8" の "<x" がタグとして解釈されて文字が消える。 */
  return esc(String(s))
    .replace(/√\[(.+?)\]\{(.+?)\}/g,'<span class="rt"><span class="ri">$1</span>&radic;<span class="rb">$2</span></span>')
    .replace(/√\{(.+?)\}/g,'<span class="rt">&radic;<span class="rb">$1</span></span>')
    .replace(/\^\{(.+?)\}/g,'<sup>$1</sup>')
    .replace(/_\{(.+?)\}/g,'<sub>$1</sub>')
    .replace(/\^(-?[0-9a-zA-Z])/g,'<sup>$1</sup>')
    .replace(/_(-?[0-9a-zA-Z])/g,'<sub>$1</sub>');
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =======================================================================
   解答の正規化と判定
   ======================================================================= */

/* 不等式は向きを裏返しても同じ意味。
   "0<x<8" ⇔ "8>x>0"、"x≧10" ⇔ "10≦x" を機械的に作って照合する。 */
const FLIP = {'<':'>','>':'<','≦':'≧','≧':'≦'};
function flipIneq(s){
  if(!/[<>≦≧]/.test(s)) return s;
  const parts = s.split(/([<>≦≧])/);          // 項と不等号を交互に取り出す
  return parts.reverse().map(p=>FLIP[p]||p).join('');
}

function nz(s){
  let t = String(s==null?'':s);
  t = t.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t = t.replace(/（/g,'(').replace(/）/g,')');
  t = t.replace(/[，、]/g,',').replace(/．/g,'.');
  t = t.replace(/[①②③④⑤]/g, c=>String('①②③④⑤'.indexOf(c)+1));   // 丸数字で答えても通す
  t = t.replace(/[−–—‐ー]/g,'-');
  t = t.replace(/[\s　]/g,'');
  t = t.toLowerCase();
  t = t.replace(/sqrt/g,'√').replace(/cbrt/g,'∛');
  t = t.replace(/log_/g,'log');   // log_2(3) / log2(3) / log_2 3 を同じ形に寄せる
  /* 3乗根は ∛8 とも √[3]{8} とも書ける。n乗根の形に寄せて同じものとして扱う。 */
  t = t.replace(/∛\(([^()]*)\)/g,'√[3]{$1}').replace(/∛([0-9a-z.]+)/g,'√[3]{$1}');
  /* √2 と √{2}、√[3]{8} と √[3]8 のような書き方の揺れも吸収する */
  t = t.replace(/√\[([^\]]+)\]([0-9a-z.]+)/g,'√[$1]{$2}');
  t = t.replace(/√(?!\[|\{)([0-9a-z.]+)/g,'√{$1}');
  t = t.replace(/√\[2\]\{/g,'√{');    // ⁿ√キーで打った √[2]{2} も ただの √2 と同じ
  t = t.replace(/＜/g,'<').replace(/＞/g,'>').replace(/＝/g,'=').replace(/／/g,'/');
  t = t.replace(/>=|≥/g,'≧').replace(/<=|≤/g,'≦');
  t = t.replace(/[*・×⋅･]/g,'');
  t = t.replace(/÷/g,'/');
  t = t.replace(/桁$/,'').replace(/位$/,'').replace(/^小数第/,'');
  if(/^[xyn]=/.test(t) && !/[<>≦≧]/.test(t)) t = t.slice(2);
  /* 「x<-1, 2<x」のように解が2つに分かれる答えは、書く順番も
     不等号の向きも人によって違う。各項を裏返しも含めて一意に決めてから並べ直す。 */
  if(t.indexOf(',')>=0){
    t = t.split(',').filter(v=>v!=='').map(v=>{
      const f = flipIneq(v);
      return f<v ? f : v;
    }).sort().join(',');
  }
  return t;
}
function noParen(s){ return s.replace(/[()]/g,''); }
function numOf(s){
  const m = /^(-?\d+(?:\.\d+)?)(?:\/(-?\d+(?:\.\d+)?))?$/.exec(s);
  if(!m) return null;
  const d = m[2]!==undefined ? parseFloat(m[2]) : 1;
  if(d===0) return null;
  return parseFloat(m[1])/d;
}
function judge(input, list){
  const a = nz(input);
  if(a==='') return false;
  const av = [a, flipIneq(a)];
  for(let i=0;i<list.length;i++){
    const b = nz(list[i]);
    for(let j=0;j<av.length;j++){
      if(av[j]===b) return true;
      if(noParen(av[j])===noParen(b)) return true;
    }
    const na=numOf(a), nb=numOf(b);
    if(na!==null && nb!==null && Math.abs(na-nb)<1e-9) return true;
  }
  return false;
}

/* =======================================================================
   学習記録（localStorage）
   ST[qid] = { w: 累計の間違い回数, p: 復習対象フラグ, c: 正解回数 }
   ======================================================================= */
const SKEY = 'explog_stats_v1';
let ST = {};
function loadST(){
  try{
    const r = localStorage.getItem(SKEY);
    ST = r ? JSON.parse(r) : {};
  }catch(e){ ST = {}; }
  if(!ST || typeof ST !== 'object') ST = {};
  /* 差し替えられた問題の記録が残り続けないよう、現在ない問題は捨てる */
  let dropped = false;
  for(const k in ST){
    if(!BYID[k] || !ST[k] || typeof ST[k] !== 'object'){ delete ST[k]; dropped = true; }
  }
  if(dropped) saveST();
}
function saveST(){
  try{ localStorage.setItem(SKEY, JSON.stringify(ST)); }catch(e){}
}
function rec(id){
  if(!ST[id]) ST[id] = {w:0,p:0,c:0};
  return ST[id];
}
function markWrong(id){ const r=rec(id); r.w++; r.p=1; saveST(); }
function markRight(id){ const r=rec(id); r.c++; r.p=0; saveST(); }
function wcount(id){ return ST[id] ? (ST[id].w||0) : 0; }
function isPending(id){ return ST[id] ? ST[id].p===1 : false; }

loadST();

/* =======================================================================
   出題プール
   ======================================================================= */
function poolOf(topicId, mode){
  let list = topicId==='__all__' ? ALL.slice() : ALL.filter(q=>q.topic===topicId);
  if(mode==='wrong'){
    list = list.filter(q=>isPending(q.id));
    list.sort((a,b)=>wcount(b.id)-wcount(a.id));
  }else if(mode==='freq'){
    list = list.filter(q=>wcount(q.id)>0);
    list.sort((a,b)=>wcount(b.id)-wcount(a.id));
  }
  return list;
}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* =======================================================================
   学習状況（ダッシュボード）

   1問は必ず次の3つのどれか1つに入る（重複なし・合計＝問題数）:
     要復習   … p===1（間違えたまま、まだ正解していない）
     正解済み … p===0 かつ c>0
     未着手   … p===0 かつ c===0
   正答率は「解答回数のうち正解だった割合」= Σc / (Σc + Σw)。
   ======================================================================= */
let statSort = 'weak';        // weak: 苦手な順 / order: 出題順

function tally(list){
  let done=0, todo=0, fresh=0, c=0, w=0;
  list.forEach(q=>{
    const r = ST[q.id];
    if(r && r.p===1) todo++;
    else if(r && r.c>0) done++;
    else fresh++;
    if(r){ c += r.c||0; w += r.w||0; }
  });
  const tries = c + w;
  return {n:list.length, done, todo, fresh, c, w, tries,
          acc: tries ? c/tries : null,          // 正答率（未挑戦は null）
          touched: list.length - fresh};
}

function pct(x){ return Math.round(x*100); }

function renderStats(){
  const all = tally(ALL);
  $('stSub').textContent = all.tries ? '解答 '+all.tries+'回' : '';
  const body = $('stBody');
  body.innerHTML = '';

  if(all.tries===0){
    body.innerHTML = '<div class="stempty">まだ記録がありません。<br>問題を解くと、範囲ごとの得意・苦手がここに出ます。</div>';
    return;
  }

  /* ヒーロー数値はこの画面に1つだけ。「全問中どれだけ正解済みか」 */
  let html =
    '<div class="hero"><div class="hv">'+pct(all.done/all.n)+'<i>%</i></div>'+
    '<p class="hl">全'+all.n+'問のうち '+all.done+'問を正解済み</p></div>'+
    '<div class="tiles">'+
      '<div class="tile"><span class="tl">解いた問題</span><span class="tv">'+all.touched+'<small>/'+all.n+'</small></span></div>'+
      '<div class="tile"><span class="tl">正答率</span><span class="tv">'+pct(all.acc)+'<small>%</small></span></div>'+
      '<div class="tile"><span class="tl">要復習</span><span class="tv">'+all.todo+'<small>問</small></span></div>'+
    '</div>';

  /* 範囲ごとに集計 */
  const rows = TOPICS.map(t=>({t, s:tally(t.qs)}));
  const played = rows.filter(r=>r.s.tries>0);

  /* いちばん得意・いちばん苦手（挑戦した範囲の中で） */
  if(played.length>=2){
    const byAcc = played.slice().sort((a,b)=>a.s.acc-b.s.acc || b.s.todo-a.s.todo);
    const weak = byAcc[0], strong = byAcc[byAcc.length-1];
    html += '<div class="verdict">'+
      '<div class="vrow bad"><span class="vk">苦手</span><span class="vn">'+esc(weak.t.name)+'</span>'+
        '<span class="vp">正答率 '+pct(weak.s.acc)+'%</span></div>'+
      '<div class="vrow"><span class="vk">得意</span><span class="vn">'+esc(strong.t.name)+'</span>'+
        '<span class="vp">正答率 '+pct(strong.s.acc)+'%</span></div>'+
    '</div>';
  }

  html += '<div class="mrow"><p class="sec" style="margin:16px 0 0">範囲べつ</p>'+
    '<div class="seg mini" id="sortSeg" style="width:150px">'+
      '<button data-s="weak"'+(statSort==='weak'?' class="on"':'')+'>苦手な順</button>'+
      '<button data-s="order"'+(statSort==='order'?' class="on"':'')+'>出題順</button>'+
    '</div></div>'+
    '<div class="legend"><span><i class="k1"></i>正解済み</span><span><i class="k2"></i>要復習</span>'+
    '<span><i class="k3"></i>未着手</span></div>';

  /* 苦手な順 = 正答率の低い順。未挑戦の範囲は最後にまとめる。 */
  const sorted = statSort==='order' ? rows : rows.slice().sort((a,b)=>{
    if(a.s.tries===0 && b.s.tries===0) return 0;
    if(a.s.tries===0) return 1;
    if(b.s.tries===0) return -1;
    return a.s.acc-b.s.acc || b.s.todo-a.s.todo;
  });

  sorted.forEach(({t,s})=>{
    const seg = (v,cls)=> v>0 ? '<i class="'+cls+'" style="flex:'+v+'"></i>' : '';
    html += '<button class="srow" data-topic="'+t.id+'">'+
      '<span class="sh1"><span class="sn">'+esc(t.name)+'</span>'+
        (s.tries ? '<span class="sa">正答率 '+pct(s.acc)+'%</span>'
                 : '<span class="sa none">まだ解いていない</span>')+'</span>'+
      '<span class="sbar">'+seg(s.done,'b1')+seg(s.todo,'b2')+seg(s.fresh,'b3')+'</span>'+
      '<span class="sf"><b>正解済み '+s.done+'</b>'+
        (s.todo? '<span class="w">要復習 '+s.todo+'</span>' : '')+
        (s.fresh? '<span>未着手 '+s.fresh+'</span>' : '')+
        (s.w? '<span>間違い計 '+s.w+'回</span>' : '')+'</span>'+
    '</button>';
  });

  /* よく間違える問題 */
  const worst = ALL.filter(q=>wcount(q.id)>0)
                   .sort((a,b)=>wcount(b.id)-wcount(a.id))
                   .slice(0,6);
  if(worst.length){
    html += '<p class="sec" style="margin:22px 0 9px">よく間違える問題</p><div class="wq">';
    worst.forEach(q=>{
      html += '<button class="wqi" data-q="'+q.id+'">'+
        '<span class="h"><span class="q mq">'+fmt(q.q)+'</span><span class="n">×'+wcount(q.id)+'</span></span>'+
        '<span class="t">'+esc(q.tname)+(isPending(q.id)?' ／ まだ正解していません':'')+'</span>'+
        /* 証明問題（自己採点）には照合用の正解がないので、解答だけを見せる */
        '<span class="x hide">'+(q.a ? '正解 '+fmt(q.a[0])+'<br>' : '')+fmt(q.e)+'</span>'+
      '</button>';
    });
    html += '</div>';
  }

  body.innerHTML = html;

  $('sortSeg').addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(!b) return;
    statSort = b.dataset.s;
    renderStats();
  });
  /* 範囲をタップ → その範囲を演習（要復習があれば復習モードで） */
  body.querySelectorAll('.srow').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.dataset.topic;
      const s = tally(TOPICS.find(x=>x.id===t).qs);
      S.mode = s.todo>0 ? 'wrong' : 'normal';
      startSession(t);
    });
  });
  /* 問題をタップ → 解説の開閉 */
  body.querySelectorAll('.wqi').forEach(el=>{
    el.addEventListener('click', ()=>el.querySelector('.x').classList.toggle('hide'));
  });
}

function openStats(){ renderStats(); show('stats'); }
$('statBtn').addEventListener('click', openStats);
$('stBack').addEventListener('click', ()=>{ renderMenu(); show('menu'); });

/* =======================================================================
   セッション
   ======================================================================= */
function startSession(topicId){
  let p = poolOf(topicId, S.mode);
  if(p.length===0){ renderMenu(); return; }
  /* 復習系のモードは「間違いが多い順」に意味があるので並べ替えない */
  if(S.shuffle && S.mode==='normal') p = shuffled(p);
  runQueue(p, topicId);
}
/* 問題の並びを受け取ってセッションを始める（復習セッションもここを通る） */
function runQueue(list, topicId){
  closeSheets();
  S.locked = false;
  S.topic = topicId;
  S.queue = list;
  S.idx = 0;
  S.okCount = 0;
  S.wrongList = [];
  S.scored = {};
  resetPadStore();
  show('play');
  requestAnimationFrame(()=>{ setupPad(); renderQ(); });
}

function curQ(){ return S.queue[S.idx]; }

/* ---- 中断しても続きから再開できるようにセッションを保存する ---- */
const RKEY = 'explog_session_v1';
/* 途中で抜けても失わないよう、1問進むたびに保存する。
   書きかけの解答と、いま書いている計算も一緒に持たせる。 */
const PAD_SAVE_MAX = 300000;   // 手書きの保存はこの文字数まで（進み具合は必ず残す）
function packStrokes(){
  try{
    const r = Math.round;
    const a = strokes.map(s=>({t:s.tool==='era'?1:0, w:s.w,
      p:s.pts.map(pt=>[r(pt.x*10)/10, r(pt.y*10)/10])}));
    return JSON.stringify(a).length > PAD_SAVE_MAX ? [] : a;
  }catch(e){ return []; }
}
function unpackStrokes(a){
  if(!Array.isArray(a)) return [];
  return a.map(s=>({tool:s.t?'era':'pen', w:s.w,
    pts:(s.p||[]).map(q=>({x:q[0], y:q[1]}))}));
}
function saveSession(){
  const base = {
    topic:S.topic, mode:S.mode, idx:S.idx, ok:S.okCount,
    ids:S.queue.map(q=>q.id), wrong:S.wrongList, scored:Object.keys(S.scored),
    draft:IV, t:Date.now()
  };
  try{
    localStorage.setItem(RKEY, JSON.stringify(Object.assign({pad:packStrokes()}, base)));
  }catch(e){
    /* 手書きが大きすぎて入らないときは、それだけ諦めて進み具合は必ず残す */
    try{ localStorage.setItem(RKEY, JSON.stringify(base)); }catch(e2){}
  }
}
function clearSession(){ try{ localStorage.removeItem(RKEY); }catch(e){} }
function readSession(){
  try{
    const r = JSON.parse(localStorage.getItem(RKEY)||'null');
    if(!r || !r.ids || !r.ids.length) return null;
    if(Date.now()-r.t > 1000*60*60*24*14) return null;      // 2週間で失効
    if(r.idx<0 || r.idx>=r.ids.length) return null;          // 完了済みは復帰しない
    /* 何か手をつけていれば復帰させる。1問目でも、書いた計算や
       書きかけの解答があるなら失わせない。 */
    const started = r.idx>0 || (r.scored&&r.scored.length) ||
                    (r.draft&&r.draft.length) || (r.pad&&r.pad.length);
    if(!started) return null;
    if(r.ids.some(id=>!BYID[id])) return null;
    return r;
  }catch(e){ return null; }
}
function resumeSession(r){
  S.mode = r.mode;
  S.topic = r.topic;
  S.queue = r.ids.map(id=>BYID[id]);
  S.idx = r.idx;
  S.okCount = r.ok;
  S.wrongList = r.wrong||[];
  S.scored = {};
  (r.scored||[]).forEach(id=>{ S.scored[id]=true; });
  resetPadStore();
  show('play');
  requestAnimationFrame(()=>{
    setupPad();
    renderQ();
    /* 中断したときの解答と計算を戻す */
    const back = unpackStrokes(r.pad);
    if(back.length){ strokes.push.apply(strokes, back); bake(); }
    if(r.draft){ IV = r.draft; IC = IV.length; paintField(); }
  });
}

function renderQ(){
  const q = curQ();
  if(!q){ finish(); return; }
  const tName = S.topic==='__all__' ? q.tname : (TOPICS.find(t=>t.id===S.topic)||{}).name;
  $('pTitle').textContent = tName || '';
  $('pCount').textContent = (S.idx+1)+' / '+S.queue.length;
  $('progBar').style.width = (S.idx/S.queue.length*100)+'%';
  $('qText').innerHTML = fmt(q.q);
  if(q.g){
    $('qGiven').innerHTML = 'ただし ' + fmt(q.g) + ' とする';
    $('qGiven').classList.remove('hide');
  }else{
    $('qGiven').classList.add('hide');
  }
  const w = wcount(q.id);
  $('qWrong').textContent = w>0 ? '間違い '+w+'回' : '';
  /* 自分でたたんだ／開いたときはその状態を引き継ぐ。
     まだ触っていないなら、画面が低いとき（横向きなど）だけ自動でたたむ
     （与えられた値がある問題は隠れてしまうので開いたまま）。 */
  setFold(foldPref !== null ? foldPref : (innerHeight <= 520 && !q.g));
  usePad(S.idx+'/'+q.id);
  resetInput();
  S.locked = false;
  syncPrev();
  saveSession();
}
/* 問題文のたたみ／ひらき。null は「まだ自分で選んでいない」 */
let foldPref = null;
function setFold(on){
  const box = $('qBox');
  box.classList.toggle('fold', on);
  box.setAttribute('aria-expanded', on?'false':'true');
  $('qFold').textContent = on ? 'ひらく' : 'たたむ';
  if(!$('play').classList.contains('hide')) requestAnimationFrame(setupPad);
}
$('qBox').addEventListener('click', ()=>{
  foldPref = !$('qBox').classList.contains('fold');
  setFold(foldPref);
});

/* 「前の問題」は1問目では押せない */
function syncPrev(){
  const b = $('mPrev');
  if(b) b.disabled = S.idx===0;
}

function next(){
  S.idx++;
  if(S.idx>=S.queue.length){ finish(); }
  else{ renderQ(); }
}
function prev(){
  if(S.idx===0) return;
  S.idx--;
  renderQ();
}

function finish(){
  clearSession();
  $('progBar').style.width = '100%';
  const n = S.queue.length;
  $('dScore').innerHTML = S.okCount + '<i>/ '+n+'</i>';
  $('dSub').textContent = S.okCount===n ? 'ぜんぶ正解' : '正解数';

  const wrap = $('dWrongWrap'), list = $('dWrong');
  list.innerHTML = '';
  if(S.wrongList.length){
    wrap.classList.remove('hide');
    S.wrongList.forEach(id=>{
      const q = BYID[id];
      const d = document.createElement('button');
      d.className = 'witem';
      d.innerHTML = '<span class="q mq">'+fmt(q.q)+(q.g?'<span class="wg">（'+fmt(q.g)+'）</span>':'')+'</span>'+
                    '<span class="a">'+(q.a ? '正解 <b class="mq">'+fmt(q.a[0])+'</b> ／ ' : '')+
                    '累計 '+wcount(id)+'回'+
                    '<span class="more">'+(q.a?'解説':'解答')+'</span></span>'+
                    '<span class="wexp hide">'+fmt(q.e)+'</span>';
      /* タップで解説を開閉する（結果画面でそのまま復習できるように） */
      d.addEventListener('click', ()=>{
        const ex = d.querySelector('.wexp');
        const open = ex.classList.toggle('hide');
        d.querySelector('.more').textContent = open ? (q.a?'解説':'解答') : '閉じる';
      });
      list.appendChild(d);
    });
  }else{
    wrap.classList.add('hide');
  }

  const bts = $('dBtns');
  bts.innerHTML = '';
  const add = (label, ghost, fn)=>{
    const b = document.createElement('button');
    b.className = 'pbtn' + (ghost?' ghost':'');
    b.textContent = label;
    b.addEventListener('click', fn);
    bts.appendChild(b);
  };
  if(S.wrongList.length){
    const again = S.wrongList.slice();
    add('間違えた問題をもう一度', false, ()=>runQueue(again.map(id=>BYID[id]), S.topic));
  }
  add('同じ範囲をもう一度', S.wrongList.length>0, ()=>startSession(S.topic));
  add('メニューに戻る', true, goHome);
  show('done');
}

function goHome(){
  /* 抜けるときも必ず保存する。あとで「続きから」で同じ場所に戻れる。 */
  if(!$('play').classList.contains('hide') && S.queue.length) saveSession();
  closeSheets();
  renderMenu();
  show('menu');
}

/* アプリを閉じた・切り替えたときも取りこぼさない */
function saveIfPlaying(){
  if(!$('play').classList.contains('hide') && S.queue.length) saveSession();
}
window.addEventListener('pagehide', saveIfPlaying);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden') saveIfPlaying();
});

/* =======================================================================
   計算スペース（キャンバス）

   確定したストロークはオフスクリーンに焼き込んでおき、描画中は
   「焼き込み済みの画像 ＋ 今引いている1本」だけを描く。
   一面に書き込んでも1回の描画コストが増えないようにするため。
   ======================================================================= */
const pad  = $('pad');
const ctx  = pad.getContext('2d');
const buf  = document.createElement('canvas');
const bctx = buf.getContext('2d');

let strokes = [];        // {tool,w,pts:[{x,y}]}
let redoStack = [];
let drawing = false, cur = null;
let tool = 'pen';
let penW = 2.2;          // 細 1.6 / 中 2.2 / 太 3.4
let eraW = 24;
let penSeen = false;     // スタイラスを検出したら以後タッチは無視（手のひら対策）
let dpr = 1;
let padKey = null;
const padStore = {};     // 問題ごとに計算内容を保持（前の問題に戻っても残る）
const padOrder = [];     // 古いものから捨てるための順番

function setupPad(){
  const r = pad.getBoundingClientRect();
  if(r.width===0 || r.height===0) return;
  dpr = Math.min(window.devicePixelRatio||1, 2.5);
  pad.width  = buf.width  = Math.round(r.width*dpr);
  pad.height = buf.height = Math.round(r.height*dpr);
  bake();
}
function inkStroke(c, s){
  if(!s.pts.length) return;
  c.save();
  c.setTransform(dpr,0,0,dpr,0,0);
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.lineWidth = s.w;
  if(s.tool==='era'){
    c.globalCompositeOperation = 'destination-out';
    c.strokeStyle = c.fillStyle = 'rgba(0,0,0,1)';
  }else{
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = c.fillStyle = '#111111';
  }
  if(s.pts.length===1){
    c.beginPath();
    c.arc(s.pts[0].x, s.pts[0].y, s.w/2, 0, Math.PI*2);
    c.fill();
  }else{
    c.beginPath();
    c.moveTo(s.pts[0].x, s.pts[0].y);
    for(let i=1;i<s.pts.length-1;i++){
      const mx=(s.pts[i].x+s.pts[i+1].x)/2, my=(s.pts[i].y+s.pts[i+1].y)/2;
      c.quadraticCurveTo(s.pts[i].x, s.pts[i].y, mx, my);
    }
    const L = s.pts[s.pts.length-1];
    c.lineTo(L.x, L.y);
    c.stroke();
  }
  c.restore();
}
/* 全ストロークをバッファに焼き直す（undo・消去・リサイズ時だけ） */
function bake(){
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,buf.width,buf.height);
  for(let i=0;i<strokes.length;i++) inkStroke(bctx, strokes[i]);
  paint();
}
/* 画面に反映（描いている最中の1本だけ上乗せ） */
function paint(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,pad.width,pad.height);
  ctx.drawImage(buf,0,0);
  if(cur) inkStroke(ctx, cur);
  const n = strokes.length + (cur?1:0);
  $('padHint').style.opacity = n ? 0 : 1;
  $('tUndo').disabled = strokes.length===0;
  $('tRedo').disabled = redoStack.length===0;
}
function ptOf(e){
  const r = pad.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

pad.addEventListener('pointerdown', e=>{
  if(e.pointerType==='pen') penSeen = true;
  if(penSeen && e.pointerType==='touch') return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  pad.setPointerCapture(e.pointerId);
  drawing = true;
  redoStack.length = 0;
  cur = { tool:tool, w: tool==='era'?eraW:penW, pts:[ptOf(e)] };
  paint();
});
pad.addEventListener('pointermove', e=>{
  if(!drawing || !cur) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(let i=0;i<evs.length;i++){
    const p = ptOf(evs[i]);
    const last = cur.pts[cur.pts.length-1];
    if(Math.abs(p.x-last.x)+Math.abs(p.y-last.y) < 0.7) continue;
    cur.pts.push(p);
  }
  paint();
});
function endDraw(){
  if(!drawing) return;
  drawing = false;
  if(cur){ strokes.push(cur); inkStroke(bctx, cur); cur = null; }
  paint();
}
pad.addEventListener('pointerup', endDraw);
pad.addEventListener('pointercancel', endDraw);

/* 2本指タップで1つ戻す（手書きアプリの定番操作） */
let twoAt = 0;
pad.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    twoAt = Date.now();
    if(drawing){ drawing=false; cur=null; paint(); }   // 1本目の指が引いた線は取り消す
  }
}, {passive:true});
pad.addEventListener('touchend', e=>{
  if(twoAt && e.touches.length===0){
    const quick = Date.now()-twoAt < 320;
    twoAt = 0;
    if(quick) undo();
  }
}, {passive:true});

function undo(){ if(strokes.length){ redoStack.push(strokes.pop()); bake(); buzz(6); } }
function redo(){ if(redoStack.length){ const s=redoStack.pop(); strokes.push(s); inkStroke(bctx,s); paint(); buzz(6); } }
function clearPad(){ strokes.length = 0; redoStack.length = 0; cur = null; bake(); }

/* 問題ごとの計算内容を出し入れする。
   1セッション156問ぶんを抱え続けないよう、古いものから捨てる。 */
const PAD_KEEP = 24;
function usePad(key){
  padKey = key;
  if(!padStore[key]){
    padStore[key] = {s:[], r:[]};
    padOrder.push(key);
    while(padOrder.length > PAD_KEEP){
      const old = padOrder.shift();
      if(old !== key) delete padStore[old];
    }
  }
  strokes   = padStore[key].s;
  redoStack = padStore[key].r;
  cur = null;
  bake();
}
function resetPadStore(){
  for(const k in padStore) delete padStore[k];
  padOrder.length = 0;
}

function setTool(t){
  tool = t;
  $('tPen').classList.toggle('on', t==='pen');
  $('tEra').classList.toggle('on', t==='era');
}
$('tPen').addEventListener('click', ()=>setTool('pen'));
$('tEra').addEventListener('click', ()=>setTool('era'));
$('tUndo').addEventListener('click', undo);
$('tRedo').addEventListener('click', redo);
$('tClr').addEventListener('click', ()=>{ clearPad(); buzz(10); });

let rzT = null, lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', ()=>{
  if(innerWidth===lastW && innerHeight===lastH) return;   // ソフトキーボード等の微差では作り直さない
  lastW = innerWidth; lastH = innerHeight;
  clearTimeout(rzT);
  rzT = setTimeout(()=>{ if(!$('play').classList.contains('hide')) setupPad(); }, 140);
});

/* 触覚フィードバック（対応端末のみ） */
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* =======================================================================
   専用キーボード
   ======================================================================= */
/* 実際に解答へ出てくる文字だけを並べる。打っても正解になり得ない記号は置かない。 */
const KEYS = [
  [{t:'1'},{t:'2'},{t:'3'},{t:'('},{t:')'},{f:'bs',svg:'<path d="M9 5h11v14H9L3 12z"/><path d="M14.5 9.5l-4 5M10.5 9.5l4 5"/>'}],
  [{t:'4'},{t:'5'},{t:'6'},{t:'/'},{t:'^'},{f:'l',svg:'<path d="M14 6l-6 6 6 6"/>'}],
  [{t:'7'},{t:'8'},{t:'9'},{t:'√'},{t:','},{f:'r',svg:'<path d="M10 6l6 6-6 6"/>'}],
  [{t:'0'},{t:'.'},{t:'-'},{t:'+'},{t:'ⁿ√',cls:'sm'},{t:'='}],
  [{t:'x'},{t:'y'},{t:'a'},{t:'b'},{t:'n'},{t:'log',cls:'sm'}],
  [{t:'<'},{t:'>'},{t:'≦'},{t:'≧'},{f:'go'}]
];
function buildKB(){
  /* 1枚のグリッドに全キーを並べる。縦向きは6列6段、横向きは12列3段に
     CSS だけで組み替わる（横向きだと6段では決定キーが画面外に出るため）。 */
  const kb = $('kb');
  kb.innerHTML = '';
  KEYS.forEach(row=>{
    row.forEach(k=>{
      const b = document.createElement('button');
      if(k.f==='go'){
        b.className = 'k go'; b.textContent = '決定';
        b.dataset.f = 'go';
      }else if(k.f){
        b.className = 'k fn';
        b.innerHTML = '<svg viewBox="0 0 24 24">'+k.svg+'</svg>';
        b.dataset.f = k.f;
        b.setAttribute('aria-label', {bs:'1文字消す', l:'カーソルを左へ', r:'カーソルを右へ'}[k.f] || '');
      }else{
        b.className = 'k' + (k.cls?' '+k.cls:'');
        b.textContent = k.t;
        b.dataset.t = k.ins || k.t;
      }
      kb.appendChild(b);
    });
  });
  kb.addEventListener('pointerdown', e=>{
    const b = e.target.closest('.k');
    if(!b) return;
    e.preventDefault();
    if(b.dataset.f) doFn(b.dataset.f);
    else insert(b.dataset.t);
  });
}
let IV = '', IC = 0;   // 入力値・カーソル位置
function resetInput(){
  IV = ''; IC = 0;
  $('field').classList.remove('err');
  paintField();
}
/* log は「底」と「真数」の2か所を埋める形なので、
   log_2(3) という綴りを覚えてもらう代わりに □ を置いて埋めてもらう。 */
const BOX = '□';
const LOG_TPL = 'log_'+BOX+'('+BOX+')';
const RT_TPL  = '√['+BOX+']{'+BOX+'}';   // n乗根も「指数」と「中身」の2か所を埋める

/* 比較記号やカンマは、ひな形の中身ではなく式全体を区切るために打つもの。
   □ を埋め終えた直後はカーソルが }（や ）)の内側に残っているので、
   そのまま打つと √[3]{3<√[7]{27}} のように入れ子になってしまう。
   これらのキーに限っては、閉じ括弧の外へ自分で出てから入れる。 */
const EXITERS = '<>≦≧=,';
function escapeGroups(){
  while(IC < IV.length && '}])'.indexOf(IV[IC]) >= 0) IC++;
}
function insert(t){
  if(EXITERS.indexOf(t)>=0 && IV[IC]!==BOX) escapeGroups();
  if(t==='log' || t==='ⁿ√'){           // ひな形ごと入れて、最初の □ に移る
    const tpl = t==='log' ? LOG_TPL : RT_TPL;
    IV = IV.slice(0,IC) + tpl + IV.slice(IC);
    IC = IV.indexOf(BOX, IC);
  }else if(IV[IC]===BOX){              // □ の上で打った文字は □ と置きかわる
    IV = IV.slice(0,IC) + t + IV.slice(IC+1);
    IC += t.length;
  }else{
    IV = IV.slice(0,IC) + t + IV.slice(IC);
    IC += t.length;
  }
  $('field').classList.remove('err');
  paintField();
  buzz(4);
}
function nextBox(){                    // カーソルより後ろの □ の位置（なければ -1）
  return IV.indexOf(BOX, IC+1)>=0 ? IV.indexOf(BOX, IC+1) : IV.indexOf(BOX);
}
function doFn(f){
  if(f==='bs'){ if(IC>0){ IV = IV.slice(0,IC-1)+IV.slice(IC); IC--; } }
  else if(f==='l'){ if(IC>0) IC--; }
  else if(f==='r'){
    const nb = nextBox();
    if(nb>=0 && nb!==IC) IC = nb;      // □ が残っていれば一気にそこへ飛ぶ
    else if(IC<IV.length) IC++;
  }
  else if(f==='go'){ submit(); return; }
  paintField();
}
let pickMode = false;   // 選択式かどうか
function paintField(){
  const f = $('field');
  if(IV===''){
    f.innerHTML = pickMode
      ? '<span class="ph">下から選んでください</span>'
      : '<span class="caret"></span><span class="ph">ここに解答を入力</span>';
  }else if(pickMode){
    f.innerHTML = esc(IV);
    syncAnsBtn();
    return;
  }else{
    f.innerHTML = boxify(esc(IV.slice(0,IC))) + '<span class="caret"></span>' + boxify(esc(IV.slice(IC)));
  }
  syncAnsBtn();
  paintPreview();
}
/* □ を「埋めるところ」として見せる */
function boxify(html){
  return html.split(BOX).join('<span class="bx">'+BOX+'</span>');
}

/* 打った文字列を数式の形に直して見せる。
   ^ や √ や log_ が思ったとおりに効いているか、打ちながら確認できるように。 */
function preview(s){
  let t = String(s);
  t = t.replace(/\^\(([^()]*)\)/g, '^{$1}');      // 2^(1/3) → 上付き 1/3
  t = t.replace(/√\(([^()]*)\)/g, '√{$1}');       // √(10)
  t = t.replace(/√(\d+(?:\/\d+)?|[a-z])/g, '√{$1}');  // √2 にも横線を引く
  /* log_2(3) の括弧は入力の都合なので、表示では外して log₂3 にする */
  t = t.replace(/log_([\d□]+(?:\/\d+)?|[a-z])\(([^()]*)\)/g, 'log_{$1}$2');
  t = t.replace(/log_([\d□]+(?:\/\d+)?|[a-z])/g, 'log_{$1}');
  return boxify(fmt(t));
}
function paintPreview(){
  const box = $('prev');
  /* 数字だけ・記号なしの解答は見せても意味がないので出さない */
  const worth = IV!=='' && !pickMode && /[\^√]|log_/.test(IV);
  box.classList.toggle('hide', !worth);
  if(worth){
    $('prevBody').innerHTML = preview(IV);
    /* □ が残っている間は、次に何をすればいいかを出す */
    const left = IV.indexOf(BOX)>=0;
    $('prevLabel').innerHTML = left
      ? (IV[IC]===BOX ? '□ に入力' : '<span class="ar">→</span> で次の □ へ')
      : 'こう読まれます';
    box.classList.toggle('todo', left);
  }
}
/* 書きかけの解答は閉じても消えない。それが分かるようにボタンに出す */
function syncAnsBtn(){
  const b = $('ansBtn');
  if(!b) return;
  const q = curQ();
  if(q && q.self){ b.textContent = '解答を見る'; return; }
  if(IV==='') b.textContent = '解答する';
  else b.textContent = '解答する（入力中: '+(IV.length>14 ? IV.slice(0,14)+'…' : IV)+'）';
}
$('field').addEventListener('click', ()=>{ IC = IV.length; paintField(); });
$('clrIn').addEventListener('click', ()=>{ IV=''; IC=0; $('field').classList.remove('err'); paintField(); });
buildKB();

/* =======================================================================
   シート制御
   ======================================================================= */
function openSheet(el){
  $('back').classList.add('on');
  el.classList.add('on');
}
function closeSheets(){
  $('back').classList.remove('on');
  ['ansSheet','menuSheet','confSheet'].forEach(id=>{
    const el = $(id);
    el.classList.remove('on');
    el.style.transform = '';
  });
}

/* シートを下にドラッグして閉じる（計算スペースを覗きたいときの自然な動き） */
function dragToClose(sheet){
  let sy = 0, dy = 0, on = false;
  const grab = e=>{
    /* つまめるのは上端（つまみ・見出し・問題文）だけ。
       キーボードや一覧の操作、判定パネルのスクロールと取り合わないようにする。 */
    if(!e.target.closest('.grip, .sh, .ansq')) return;
    if(e.target.closest('.lnk')) return;
    if(S.locked) return;      /* 判定を表示中は閉じさせない（進む手段がなくなる） */
    on = true; sy = e.clientY; dy = 0;
    sheet.style.transition = 'none';
    sheet.setPointerCapture(e.pointerId);
  };
  const move = e=>{
    if(!on) return;
    dy = Math.max(0, e.clientY - sy);
    sheet.style.transform = 'translateY('+dy+'px)';
  };
  const drop = ()=>{
    if(!on) return;
    on = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if(dy > 90) closeSheets();
  };
  sheet.addEventListener('pointerdown', grab);
  sheet.addEventListener('pointermove', move);
  sheet.addEventListener('pointerup', drop);
  sheet.addEventListener('pointercancel', drop);
}
dragToClose($('ansSheet'));
dragToClose($('menuSheet'));
$('back').addEventListener('click', ()=>{
  if($('confSheet').classList.contains('on')) { closeSheets(); return; }
  if(S.locked) return;      // 判定表示中は誤タップで閉じない
  closeSheets();
});

/* 選択式の問題では、キーボードの代わりに選択肢を出す */
function buildChoices(q){
  const box = $('choices');
  box.innerHTML = '';
  q.c.forEach(label=>{
    const b = document.createElement('button');
    b.className = 'ch' + (label===IV ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', ()=>{
      IV = label; IC = IV.length;
      Array.prototype.forEach.call(box.children, x=>x.classList.remove('on'));
      b.classList.add('on');
      $('field').classList.remove('err');
      paintField();
      buzz(4);
    });
    box.appendChild(b);
  });
  const go = document.createElement('button');
  go.className = 'pbtn';
  go.style.marginTop = '6px';
  go.textContent = '決定';
  go.addEventListener('click', submit);
  box.appendChild(go);
}

/* 証明問題は答え合わせができないので、模範解答を見せて
   「わかった／わからなかった」を自分で選んでもらう。 */
function showSelf(q){
  S.locked = true;
  $('ansInput').classList.add('hide');
  const r = $('ansRes');
  r.classList.remove('hide');
  r.innerHTML =
    '<div class="rq mq">'+fmt(q.q)+'</div>'+
    '<div class="rans"><div class="lb">解答</div><div class="proof mq">'+fmt(q.e)+'</div></div>'+
    '<div class="selfask">自分の答案と見くらべて選んでください</div>'+
    '<div class="rbtns" id="resBtns"></div>';
  const bt = $('resBtns');
  const add = (label, ghost, ok)=>{
    const b = document.createElement('button');
    b.className = 'pbtn' + (ghost?' ghost':'');
    b.textContent = label;
    b.addEventListener('click', ()=>{
      score(q, ok);
      S.locked = false;
      closeSheets();
      setTimeout(next, 180);
    });
    bt.appendChild(b);
  };
  add('わからなかった', true, false);
  add('わかった', false, true);
}

function openAnswer(){
  const q = curQ();
  if(!q) return;
  if(q.self){ openSheet($('ansSheet')); showSelf(q); return; }
  $('ansInput').classList.remove('hide');
  $('ansRes').classList.add('hide');
  $('ansQ').innerHTML = fmt(q.q) + (q.g ? '<br><span style="color:var(--t3)">ただし '+fmt(q.g)+'</span>' : '');
  pickMode = !!q.c;
  $('hintLine').textContent = pickMode ? '' : (q.h || '');   /* 選択式に書式のヒントは要らない */
  $('howBtn').classList.toggle('hide', pickMode);            /* 書き方の早見表も記述式だけ */
  showHow(false);                 /* キーボードの表示/非表示もここで決まる */
  $('choices').classList.toggle('hide', !pickMode);
  $('field').classList.toggle('jp', pickMode);
  if(pickMode) buildChoices(q);
  paintField();
  openSheet($('ansSheet'));
}

/* =======================================================================
   採点
   ======================================================================= */
function submit(){
  const q = curQ();
  if(!q || q.self) return;   /* 証明問題は自己採点なので照合しない */
  if(nz(IV)==='' || IV.indexOf(BOX)>=0){   /* □ が残っている＝まだ書きかけ */
    $('field').classList.add('err');
    return;
  }
  const ok = judge(IV, q.a);
  score(q, ok);
  showResult(q, ok, IV);
}

function score(q, ok){
  if(S.scored[q.id]) return;   // 1問につき最初の1回だけ記録
  S.scored[q.id] = true;
  if(ok){
    S.okCount++;
    markRight(q.id);
  }else{
    S.wrongList.push(q.id);
    markWrong(q.id);
  }
}

/* 別解のうち「不等号を裏返しただけ」「単位付き」のものは表示しない（読み手には同じ答えなので） */
function shownAlts(list){
  return list.slice(1).filter(a=>!/[<>≦≧]/.test(a) && !/[桁位]$/.test(a) && !/^小数第/.test(a));
}

function showResult(q, ok, given){
  S.locked = true;
  $('ansInput').classList.add('hide');
  const r = $('ansRes');
  r.classList.remove('hide');

  /* ok は true=正解 / false=不正解 / null=スキップ（記録しないが答えは見せる） */
  const mark = ok===null
    ? '<div class="rmark sk"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>スキップ</div>'
    : ok
    ? '<div class="rmark ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>正解</div>'
    : '<div class="rmark ng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>不正解</div>';

  const your = (ok===false && given!=null && given!=='')
    ? '<div class="ryour">あなたの解答　<b>'+esc(given)+'</b></div>'
    : (ok===null ? '<div class="ryour">記録には残していません</div>' : '');

  const alts = shownAlts(q.a);
  const alt = alts.length
    ? '<div class="rsub">'+alts.map(a=>'<span class="mq">'+fmt(a)+'</span>').join(' / ')+' でも正解</div>' : '';

  r.innerHTML =
    /* シートが計算スペースを覆うので、判定側にも問題文を出しておく */
    '<div class="rq mq">'+fmt(q.q)+(q.g?'<span class="rg">（'+fmt(q.g)+'）</span>':'')+'</div>' +
    mark + your +
    '<div class="rans"><div class="lb">答え</div><div class="va mq">'+fmt(q.a[0])+'</div>'+alt+'</div>' +
    (q.e ? '<div class="rexp">'+fmt(q.e)+'</div>' : '') +
    '<div class="rbtns" id="resBtns"></div>';

  const bt = $('resBtns');
  const add = (label, ghost, fn)=>{
    const b = document.createElement('button');
    b.className = 'pbtn' + (ghost?' ghost':'');
    b.textContent = label;
    b.addEventListener('click', fn);
    bt.appendChild(b);
  };
  if(ok===false){
    add('もう一度解く', true, ()=>{
      S.locked = false;
      closeSheets();
      resetInput();
    });
  }
  const last = S.idx===S.queue.length-1;
  add(last ? '結果を見る' : '次の問題へ', false, ()=>{
    S.locked = false;
    closeSheets();
    setTimeout(next, 180);
  });
  if(ok!==null) buzz(ok?8:[14,60,14]);
}

/* =======================================================================
   イベント
   ======================================================================= */
$('ansBtn').addEventListener('click', openAnswer);
$('menuBtn').addEventListener('click', ()=>{ syncPrev(); openSheet($('menuSheet')); });
$('peekBtn').addEventListener('click', closeSheets);   // 入力は残したままシートだけ下ろす

/* 早見表とキーボードは入れ替えで出す */
function showHow(on){
  $('how').classList.toggle('hide', !on);
  $('kb').classList.toggle('hide', on || pickMode);
  $('howBtn').textContent = on ? '書き方 ▴' : '書き方 ▾';
  $('howBtn').setAttribute('aria-expanded', on?'true':'false');
}
$('howBtn').addEventListener('click', ()=>showHow($('how').classList.contains('hide')));
$('how').addEventListener('click', ()=>showHow(false));

$('penSeg').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  penW = parseFloat(b.dataset.w);
  Array.prototype.forEach.call($('penSeg').children, x=>x.classList.toggle('on', x===b));
  setTool('pen');
});

/* 抜けても何も失わないので、確認を挟まずそのまま戻る */
$('backBtn').addEventListener('click', goHome);

$('menuSheet').addEventListener('click', e=>{
  const b = e.target.closest('.sitem');
  if(!b || b.disabled) return;
  const act = b.dataset.act;
  closeSheets();
  setTimeout(()=>{
    if(act==='prev'){ prev(); }
    else if(act==='retry'){ clearPad(); resetInput(); }
    else if(act==='clear'){ clearPad(); }
    else if(act==='skip'){
      /* スキップでも答えと解説は見せる。記録だけ残さない。 */
      const q = curQ();
      if(!q){ next(); return; }
      openSheet($('ansSheet'));
      /* 証明問題は照合する答えがないので、いつもの自己採点画面を出す */
      if(q.self) showSelf(q); else showResult(q, null, IV);
    }
    else if(act==='reveal'){
      const q = curQ();
      if(!q) return;
      openSheet($('ansSheet'));
      if(q.self){ showSelf(q); return; }   /* 自己申告なので勝手に不正解にはしない */
      score(q, false);
      showResult(q, false, IV);
    }
    else if(act==='restart'){
      confirmAsk('最初からやり直しますか？','この範囲を1問目から出題し直します。','やり直す',()=>startSession(S.topic));
    }
    else if(act==='home'){ goHome(); }
  }, 200);
});

let confFn = null;
function confirmAsk(title, msg, yes, fn){
  $('confTtl').textContent = title;
  $('confMsg').textContent = msg;
  $('confYesTx').textContent = yes;
  confFn = fn;
  openSheet($('confSheet'));
}
$('confYes').addEventListener('click', ()=>{
  const f = confFn; confFn = null;
  closeSheets();
  setTimeout(()=>{ if(f) f(); }, 180);
});
$('confNo').addEventListener('click', ()=>{ confFn=null; closeSheets(); });

$('modeSeg').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  S.mode = b.dataset.m;
  renderMenu();
});

$('shufBtn').addEventListener('click', ()=>{
  S.shuffle = !S.shuffle;
  $('shufBtn').setAttribute('aria-pressed', S.shuffle?'true':'false');
});

$('resetAll').addEventListener('click', ()=>{
  confirmAsk('学習記録を消去しますか？','間違えた回数と復習リストがすべて消えます。この操作は元に戻せません。','すべて消去',()=>{
    ST = {}; saveST(); renderMenu();
  });
});

/* PCのキーボードでも入力できるように */
window.addEventListener('keydown', e=>{
  if(!$('ansSheet').classList.contains('on')) return;
  if($('ansRes').classList.contains('hide')===false){
    if(e.key==='Enter'){ const b=$('resBtns'); if(b&&b.lastChild){ e.preventDefault(); b.lastChild.click(); } }
    return;
  }
  if(e.key==='Enter'){ e.preventDefault(); submit(); return; }
  if(pickMode) return;        /* 選択式では文字入力を受け付けない */
  if(e.key==='Backspace'){ e.preventDefault(); doFn('bs'); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); doFn('l'); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); doFn('r'); }
  else if(e.key.length===1 && /[0-9a-zA-Z.,+\-*/^()<>=]/.test(e.key)){ e.preventDefault(); insert(e.key); }
});

/* 起動 */
/* 2本指タップの案内は、指が2本使える端末にだけ出す */
if(!(navigator.maxTouchPoints > 1)){
  const tip = $('padHint').querySelector('small');
  if(tip) tip.remove();
}
renderMenu();
show('menu');

/* ホーム画面のショートカットから学習状況を直接開けるように */
if(location.search.indexOf('view=stats')>=0) openStats();

/* オフラインでも開けるようにする（file:// では登録できないので黙って見送る） */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
