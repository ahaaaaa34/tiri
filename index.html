<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF8">
<meta name="description" content="指数関数・対数関数の演習アプリ。手書きの計算スペースと専用キーボードで、スマホだけで解いて記録できます。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./katex.min.css">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>読み込み中…</title>
<link rel="stylesheet" href="./app.css?v=7.8">
</head>
<body>
<div class="app">

  <!-- ========== トップ（教科書かオリジナルかを選ぶ） ========== -->
  <div id="home">
    <div class="mhead">
      <p class="ver">v7.8</p>
      <h1 id="hTitle"></h1>
      <p class="cap" id="hCap"></p>
    </div>

    <button class="statlink" id="statBtn">
      <span class="sl">学習状況を見る</span>
      <span class="sr" id="statPeek"></span>
      <span class="arw">›</span>
    </button>

    <div id="resume" class="hide"></div>

    <p class="sec">どれを解く？</p>
    <div class="tlist" id="sidelist"></div>

    <div id="feedBox"></div>
    <div id="otherBox"></div>

    <div class="mfoot"><button class="lnk" id="resetAll">学習記録をすべて消去</button></div>
  </div>

  <!-- ========== メニュー（選んだ側の範囲を選ぶ） ========== -->
  <div id="menu" class="hide">
    <div class="bar mbar">
      <button class="ib" id="toTop" aria-label="トップへ戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b id="sideTtl">教科書の問題</b><span id="sideCap"></span></div>
      <span class="ib"></span>
    </div>

    <p class="sec">出題モード</p>
    <div class="seg" id="modeSeg">
      <button data-m="normal" class="on">通常</button>
      <button data-m="wrong">間違えた問題</button>
      <button data-m="freq">間違い回数順</button>
    </div>
    <p class="modenote" id="modeNote"></p>

    <button class="toggle" id="shufBtn" aria-pressed="false">
      <span class="tk"><i></i></span>
      <span>順番をシャッフルする</span>
    </button>

    <p class="sec">範囲</p>
    <div class="tlist" id="tlist"></div>
    <div style="height:18px"></div>
  </div>

  <!-- ========== 演習 ========== -->
  <div id="play" class="hide">
    <div class="bar">
      <button class="ib" id="backBtn" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b id="pTitle"></b><span id="pCount"></span></div>
      <button class="ib" id="menuBtn" aria-label="メニュー">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="prog"><i id="progBar"></i></div>

    <!-- button の中身は phrasing content でないといけないので span を block 表示にする -->
    <button class="qbox" id="qBox" aria-expanded="true">
      <span class="lb"><span id="qLabel">問題</span><span class="wc" id="qWrong"></span><span class="fold" id="qFold">たたむ</span></span>
      <span class="qt mq" id="qText"></span>
      <span class="gv hide" id="qGiven"></span>
      <!-- 長い問題文のとき、下にまだ続くことが分かるようにふちをぼかす -->
      <span class="qfade" id="qFade" aria-hidden="true"></span>
    </button>

    <div class="tools">
      <button class="tb on" id="tPen" aria-label="ペン">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 10-3-3L5 16l-1 4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <button class="tb" id="tEra" aria-label="消しゴム">
        <svg viewBox="0 0 24 24"><path d="M8.5 19.5H20"/><path d="M15.5 4.5l4 4a1.5 1.5 0 010 2.2l-8 8H7l-3-3a1.5 1.5 0 010-2.2l9.3-9a1.5 1.5 0 012.2 0z"/></svg>
      </button>
      <button class="tb" id="tSel" aria-label="囲って持っていく">
        <svg viewBox="0 0 24 24"><path d="M12 4c4.4 0 8 2.7 8 6s-3.6 6-8 6-8-2.7-8-6 3.6-6 8-6z" stroke-dasharray="3 2.5"/><path d="M16.5 15.5l3 4.5"/></svg>
      </button>
      <div class="tsp"></div>
      <button class="tb" id="tFit" aria-label="枠に収める">
        <svg viewBox="0 0 24 24"><path d="M3 8V3h5"/><path d="M21 8V3h-5"/><path d="M3 16v5h5"/><path d="M21 16v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
      </button>
      <button class="tb" id="tUndo" aria-label="元に戻す">
        <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="tb" id="tRedo" aria-label="やり直す">
        <svg viewBox="0 0 24 24"><path d="M15 14l4-4-4-4"/><path d="M19 10h-9a5 5 0 000 10h3"/></svg>
      </button>
      <button class="tb" id="tClr" aria-label="全消去">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 12h9l1-12"/></svg>
      </button>
    </div>

    <div class="padwrap">
      <canvas id="pad"></canvas>
      <div class="padhint" id="padHint">
        計算スペース
        <small>2本指でタップすると1つ戻せます</small>
      </div>
    </div>

    <div class="foot">
      <button class="pbtn" id="ansBtn">解答する</button>
    </div>
  </div>

  <!-- ========== 学習状況（ダッシュボード） ========== -->
  <div id="stats" class="hide">
    <div class="bar">
      <button class="ib" id="stBack" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ttl"><b>学習状況</b><span id="stSub"></span></div>
      <span class="ib"></span>
    </div>
    <div class="stbody" id="stBody"></div>
  </div>

  <!-- ========== 結果 ========== -->
  <div id="done" class="hide">
    <div class="dhead">
      <div class="sc" id="dScore"></div>
      <p id="dSub"></p>
    </div>
    <div id="dWrongWrap" class="hide">
      <p class="sec">間違えた問題</p>
      <div class="wlist" id="dWrong"></div>
    </div>
    <div class="dbtns" id="dBtns"></div>
  </div>
</div>

<!-- ========== オーバーレイ ========== -->
<div class="back" id="back"></div>

<!-- 解答シート -->
<div class="sheet" id="ansSheet">
  <div class="grip"></div>
  <div id="ansInput">
    <div class="sh">
      <b>解答を入力</b>
      <button class="lnk" id="peekBtn">計算を見る</button>
      <button class="lnk" id="clrIn">全消去</button>
    </div>
    <div class="ansq mq" id="ansQ"></div>
    <div id="ansClip" class="hide"></div>
    <div class="field" id="field"></div>
    <!-- 打った文字が数式としてどう読まれるかをその場で見せる -->
    <div class="hintline">
      <span id="hintLine"></span>
      <button class="lnk" id="howBtn" aria-expanded="false">書き方 ▾</button>
    </div>
    <div class="kb" id="kb"></div>
    <!-- 早見表はキーボードと入れ替えて出す（積み上げると決定キーが画面外に出るため） -->
    <button class="how hide" id="how">
      <span><b>x<sup>2</sup></b><span>x^2</span></span>
      <span><b>3x<sup>2</sup>-2x</b><span>3x^2-2x</span></span>
      <span><b>3&frasl;2</b><span>2 → 分の → 3</span></span>
      <span><b>-<sup>5</sup>&frasl;<sub>27</sub></b><span>- → 27 → 分の → 5</span></span>
      <span><b>y = 3x-2</b><span>y → = → 3x-2</span></span>
      <span><b>(5, 10)</b><span>( → 5 → , → 10 → )</span></span>
      <span><b>3&pi;</b><span>3 → π</span></span>
      <span><b>2x<sup>3</sup>+C</b><span>2x^3+C　… 積分定数も書く</span></span>
      <span><b>4<span class="rt">&radic;<span class="rb">2</span></span></b><span>4√2</span></span>
      <span><b>-3 &leqq; a &leqq; 3</b><span>-3 → ≦ → a → ≦ → 3</span></span>
      <span><b>a&lt;0, a&gt;4</b><span>2つに分かれる答えは , で区切る</span></span>
      <span class="hb">タップでキーボードに戻る</span>
    </button>
    <div class="chbox hide" id="choices"></div>
    <!-- グラフをかく問題。方眼の上に曲線をかいてもらう -->
    <div class="gbox hide" id="gbox">
      <div class="gwrap"><canvas id="gcv"></canvas></div>
      <div class="gtools">
        <button class="gb" id="gUndo">1つ戻す</button>
        <button class="gb" id="gClear">消す</button>
        <button class="pbtn" id="gGo">決定</button>
      </div>
    </div>
  </div>
  <div class="res hide" id="ansRes"></div>
</div>

<!-- メニューシート -->
<div class="sheet" id="jumpSheet">
  <div class="grip"></div>
  <div class="sh"><b>問題を選ぶ</b><span class="lnk" id="jumpCap"></span></div>
  <div class="slist" id="jumpList"></div>
</div>

<div class="sheet" id="menuSheet">
  <div class="grip"></div>
  <div class="sh"><b>メニュー</b></div>
  <div class="slist">
    <div class="prow">
      <span class="pl">ペンの太さ</span>
      <div class="seg mini" id="penSeg">
        <button data-w="1.6">細</button>
        <button data-w="2.2" class="on">中</button>
        <button data-w="3.4">太</button>
      </div>
    </div>
    <div class="shr"></div>
    <button class="sitem" data-act="jump">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h11"/><circle cx="20" cy="18" r="1.4"/></svg>
      <span class="sw">問題を選ぶ<span class="sd">この範囲の一覧から選んで移動</span></span>
    </button>
    <div class="shr"></div>
    <button class="sitem" data-act="prev" id="mPrev">
      <svg viewBox="0 0 24 24"><path d="M18 19l-9-7 9-7z"/><path d="M6 5v14"/></svg>
      <span class="sw">前の問題に戻る<span class="sd">書いた計算はそのまま残ります</span></span>
    </button>
    <button class="sitem" data-act="retry">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M19 9a7.5 7.5 0 00-13-3L4 8"/><path d="M5 15a7.5 7.5 0 0013 3l2-2"/></svg>
      <span class="sw">この問題をやり直す<span class="sd">計算スペースと入力を消去</span></span>
    </button>
    <button class="sitem" data-act="clear">
      <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 12h9l1-12"/></svg>
      <span class="sw">計算スペースを消す</span>
    </button>
    <button class="sitem" data-act="skip">
      <svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>
      <span class="sw">スキップ<span class="sd">記録に残さず次の問題へ</span></span>
    </button>
    <button class="sitem dg" data-act="reveal">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span class="sw">答えを見る<span class="sd">不正解として記録されます</span></span>
    </button>
    <div class="shr"></div>
    <button class="sitem" data-act="restart">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M19 9a7.5 7.5 0 00-13-3L4 8"/><path d="M20 20v-6h-6"/><path d="M5 15a7.5 7.5 0 0013 3l2-2"/></svg>
      <span class="sw">最初からやり直す</span>
    </button>
    <button class="sitem" data-act="home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
      <span class="sw">メニューに戻る<span class="sd">続きから再開できます</span></span>
    </button>
  </div>
</div>

<!-- 確認シート -->
<div class="sheet" id="confSheet">
  <div class="grip"></div>
  <div class="sh"><b id="confTtl">確認</b></div>
  <p class="cmsg" id="confMsg"></p>
  <div class="slist">
    <button class="sitem dg" id="confYes"><span class="sw" id="confYesTx">はい</span></button>
    <button class="sitem" id="confNo"><span class="sw">キャンセル</span></button>
  </div>
</div>

<script src="./katex.min.js"></script>
<script src="./tex.js?v=7.8"></script>
<script src="./backup.js?v=7.8"></script>
<script src="./data-math.js?v=7.8"></script>
<script src="./app.js?v=7.8"></script>
</body>
</html>
